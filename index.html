    });
    var shaTxt=shaAll.map(function(n){return MAR_SHA_SAY[n]||n;}).join('　');
    if(jieSha.length)shaTxt+='　然命带'+jieSha.join('、')+'——《三命通会》「德能解煞」，吉神在位则凶煞减其力，不必过忧。';
    marry+='　［神煞之参］'+shaTxt;
  }

  // ④ 三者之合观
  var order='';
  if(cong)order='从格之局，三者皆以「顺所从之神」为纲：事业取向从其所从，财运随其气之顺逆，姻缘则仍以配偶星与日支宫之动静为主（不因从格而改）。先后之序：先立事业以顺其势，财运随之，姻缘另看星宫。';
  else{
    var mainYong=ys.yong[0]||'财';
    var by=({'财':'财运为先——财为用神，宜以经营、理财之事为进身之阶，事业随财而立，姻缘则须待财星得地之年。',
             '官杀':'事业为先——官杀为用，宜先立名位、就正途，财运随之而至，姻缘（女命）与事业常同步。',
             '食伤':'事业与财运相因——食伤为用，宜先以才艺、技艺立身（事业），由技生财（财运）则其利长；姻缘以配偶星旺相之年为期。',
             '印':'学业与事业为先——印为用神，宜先积学、积望（事业），财利不宜急求，姻缘亦迟则安。',
             '比劫':'合伙与众力为先——比劫为用，宜结众同行（事业），财宜共取而明分际（财运），姻缘须防争夺之扰，宜晚。'})[mainYong]||'';
    order='三者并非并列：用神为'+GEN_NAME[mainYong]+'，故'+by;
  }
  return {career:career,careerNote:careerNote,wealth:wealth,marry:marry,order:order,
          cKey:cKey,pctOf:pctOf,pctStr:pctStr,pwMaxCls:pwMaxCls,jdz:jdz,partner:partner,shaAll:shaAll};
}

// ═══════════════════════════════════════════════════════════════════
// 可收放之小节（命理报告内用；复用「岁运算程」之二级折叠样式，展开状态亦按 key 记忆）
// ═══════════════════════════════════════════════════════════════════
function rpFoldSec(key,title,sum,body,open){
  return '<details class="gs-sub rp-sec"'+(open?' open':'')+' data-fold-key="'+key+'">'+
    '<summary><span class="gs-sub-t">'+title+'</span>'+
    (sum?'<span class="gs-sub-sub">'+sum+'</span>':'')+
    '<span class="gs-fold-hint">点开</span></summary>'+
    '<div class="gs-sub-body">'+body+'</div></details>';
}
function rpShortTone(j){ return j.t==='喜'?'喜':j.t==='忌'?'忌':j.t==='混'?'混':'平'; }

// ═══════════════════════════════════════════════════════════════════
// 大运分事：事业 · 财运 · 姻缘 · 学业 · 健康 · 子女 · 父母 · 人际
// 【同源】① 十神之象取 SS_ASPECT——与「岁运算程·分论」同一张表，故此节与彼节之辞同源；
//         ② 学业取 STUDY_YI、姻缘取 MARRY_YI——与「岁运算程·学业／姻缘之应期」同源；
//         ③ 宫位之动取本运与四柱之刑冲合害——与「刑冲合害会·大运与原局」同一应事库。
//   故本节不立新说：只以「本运之十神」配「何宫受动」，落到一事之上。
// ═══════════════════════════════════════════════════════════════════
function dyQiShi(cd, dayGan, gender, st, cong, gj, per){
  var dg=dayGan, out=[];
  var ssg=cd.ssg, ssz=cd.ssz, CG=cd.cg, CZ=cd.cz;
  var mKey=(gender===1?'男':'女');
  var weak=(st&&(st.cls==='身弱'||st.cls==='偏弱'));
  var strong=(st&&(st.cls==='身强'||st.cls==='偏强'));
  var p1=(per&&per.h1)?('前五年（'+per.h1+'）'):'前五年';
  var p2=(per&&per.h2)?('后五年（'+per.h2+'）'):'后五年';
  function TM(j){
    return j.t==='喜'?'<span style="color:#3a6b3a;font-weight:700">喜用</span>'
         : j.t==='忌'?'<span style="color:#8b3a3a;font-weight:700">忌神</span>'
         : j.t==='混'?'<span style="color:#7a5a2a;font-weight:700">喜忌交并</span>'
         : '<span style="color:#666">闲神</span>';
  }
  // 宫位之动：只取本运与四柱相值之象（kp 为「年运／月运／日运／时运」）
  function gongDyn(kps){
    var hit=(cd.rels||[]).filter(function(o){return kps.indexOf(o.kp)>=0;});
    if(!hit.length)return '';
    return '<div class="rp-kv" style="margin:4px 0 0 2px"><b>宫位之动</b>（与「刑冲合害会·大运与原局」同库）　'+
      hit.map(function(o){return '<b>'+o.verb+'·'+rpGongName(o.kp)+'</b>'+(o.name?'（'+o.name+'）':'')+(o.yi?'——'+o.yi:'');}).join('；')+'。</div>';
  }
  // 十神本象（干、支分取；干支同类则明其「内外一贯」）
  function benXiang(key){
    var s='';
    var a=(SS_ASPECT[ssg]&&SS_ASPECT[ssg][key])?SS_ASPECT[ssg][key]:null;
    var b=(SS_ASPECT[ssz]&&SS_ASPECT[ssz][key])?SS_ASPECT[ssz][key]:null;
    if(a)s+='<div style="font-size:14px;line-height:1.9"><b>天干'+cd.g+'</b>为'+ssg+'，判为'+TM(cd.jg)+'　'+a+'</div>';
    if(b&&ssz!==ssg)s+='<div style="font-size:14px;line-height:1.9"><b>地支'+cd.z+'</b>本气'+HIDE[cd.z][0]+'为'+ssz+'，判为'+TM(cd.jz)+'　'+b+'</div>';
    else if(b)s+='<div style="font-size:14px;line-height:1.9"><b>地支'+cd.z+'</b>本气'+HIDE[cd.z][0]+'为'+ssz+'，判为'+TM(cd.jz)+'——干支同类，内外一贯，其力专。</div>';
    if(!a&&!b)s+='<div style="font-size:14px;line-height:1.9;color:#666">本运干支之十神于此事无专象，其应多随流年之引动，不在此运之全局。</div>';
    return s;
  }
  function push(key,title,sum,html){ out.push({key:key,title:title,sum:sum,html:html}); }
  var sumBase='干'+rpShortTone(cd.jg)+'·支'+rpShortTone(cd.jz);

  // ① 事业——月柱为门庭事业之宫（《三命通会·论宫分》）
  (function(){
    var h=benXiang('career');
    h+='<div class="rp-kv">［格局之参］本局为<b>'+(cong?cong.name:gj.name)+'</b>，此运所主之神为'+GEN_NAME[CG]+'（干）、'+GEN_NAME[CZ]+'（支）——'+
       (cd.jg.t==='喜'&&cd.jz.t==='喜'?'干支俱为喜用，于格局为「用神得地」，此十年宜举事业之事：谋职、升迁、创业、拓业，皆得其时。'
        :cd.jg.t==='忌'&&cd.jz.t==='忌'?'干支俱为忌神，于格局为「忌神当道」，此十年宜守其位：勿亟变、勿躁进、勿轻弃其业；守得稳则运过自复。'
        :(cd.jg.t==='喜'?'喜在干、主'+p1+'，':'喜在支、主'+p2+'，')+'故此运之进退，以前后两截分应之：得力之五年宜进，其另一截宜守。')+'</div>';
    h+=gongDyn(['月运']);
    push('career','事业',sumBase+'　'+GEN_NAME[CG]+'当运',h);
  })();

  // ② 财运——财源在月（事业生财）、任受在日（身能任财）
  (function(){
    var h=benXiang('fin');
    h+='<div class="rp-kv">［身财之任受］'+
       (cong?('从格之局，财不为「我用之财」——财运系于所从之神（'+GEN_NAME[cong.key]+'）之顺逆：顺其气则利随势来，逆其气则虽见财而难守。')
        :weak?('日主偏弱，运逢财而身不任之，是为「财多身弱，富屋贫人」——《滴天髓》「衰则喜帮喜助」，进财之实须待帮身之年（印比之流年）；运逢比劫印绶，反是得财之期。')
        :strong?('日主有力，能任其财——财星（或生财之食伤）当运之截，即进财之截；若运逢比劫而无财，则「群劫争财」，宜明契约、定分际，不宜与亲友合资。')
        :('身财之力略相当，主财来财去、量入为出；进财之期多在用神当令之年，不在财星之数。'))+'</div>';
    h+=gongDyn(['月运','日运']);
    push('fin','财运',sumBase+'　'+((CG==='财'||CZ==='财')?'财星当运':(CG==='食伤'||CZ==='食伤')?'食伤生财':'财运随流年'),h);
  })();

  // ③ 姻缘——日支为配偶之宫，配偶星男财女官杀
  (function(){
    var h=benXiang('spouse');
    var M=(MARRY_YI[mKey]||{});
    var mCls=M[CG]?CG:(M[CZ]?CZ:null);
    var mRec=mCls?M[mCls]:null;
    if(mRec){
      h+='<div class="rp-kv">［婚动之机］'+mKey+'命以'+GEN_NAME[marryStar(gender)]+'为配偶星；此运所主之神为'+GEN_NAME[mCls]+
         '，于姻缘为「'+(mRec.t==='动'?'<b style="color:#2b6b2b">动</b>':mRec.t==='碍'?'<b style="color:#8b3a3a">碍</b>':'半')+'」——'+mRec.s+'。</div>';
    }
    h+='<div class="rp-kv">［宫位］日支'+cd.dz+'为配偶之宫，'+
       ((cd.rels||[]).some(function(o){return o.kp==='日运';})
         ? '此运与日柱有刑冲合害之动（见下），主婚姻、同居、家宅之事在此十年中被牵动，宜以「动中求和」应之。'
         : '此运与日柱无刑冲合害之动，婚姻之事大体平顺，其变多随流年之引，不在此运之全局。')+'</div>';
    h+=gongDyn(['日运']);
    push('spouse','姻缘',sumBase+'　'+(mRec?(mRec.t==='动'?'婚缘当动':mRec.t==='碍'?'婚缘迟滞':'婚缘半动'):'婚缘随流年'),h);
  })();

  // ④ 学业——印、食伤为利，财星坏印为碍；月柱为学业之门庭
  (function(){
    var ageS=cd.age?cd.age.start.y:null, ageE=cd.age?cd.age.end.y:null;
    var inAge=(ageS===null)?true:(ageE>=6&&ageS<=24);
    var h='';
    if(!inAge)
      h+='<div class="rp-kv">［不在就学之年］此运约当 '+(ageS===null?'—':(ageS+'—'+ageE))+' 岁，已过（或未及）常岁就学之期，'+
         '故学业之应不在科第，而在<b>进修、考证、著述、授业</b>之事——其利钝之判仍同：印与食伤为利，财星坏印为碍。</div>';
    var sCls=STUDY_YI[CG]?CG:(STUDY_YI[CZ]?CZ:null);
    var sRec=sCls?STUDY_YI[sCls]:null;
    if(sRec){
      h+='<div style="font-size:14px;line-height:1.9">此运所主之神为<b>'+GEN_NAME[sCls]+'</b>（'+
         (sCls===CG?'天干'+cd.g:'地支'+cd.z+'本气'+HIDE[cd.z][0])+'），于学业为「'+
         (sRec.t==='利'?'<span style="color:#2b6b2b;font-weight:700">利</span>'
          :sRec.t==='碍'?'<span style="color:#8b3a3a;font-weight:700">碍</span>'
          :sRec.t==='半'?'<span style="color:#8a5a12;font-weight:700">半（有压力）</span>'
          :'<span style="color:#666">平</span>')+'」——'+sRec.s+'。</div>';
      // 干支所主不同者，须并陈（同柱财印交见，不可只见其利而没其碍）
      var oCls=(sCls===CG)?CZ:CG;
      if(STUDY_YI[oCls]&&oCls!==sCls){
        h+='<div class="rp-kv">［干支分主］'+(oCls===CG?'天干'+cd.g:'地支'+cd.z+'本气'+HIDE[cd.z][0])+'所主之'+GEN_NAME[oCls]+
           '，于学业为「'+STUDY_YI[oCls].t+'」——'+STUDY_YI[oCls].s+'。'+
           '干主外象、主'+p1+'，支主内实、主'+p2+'，'+
           (STUDY_YI[oCls].t===sRec.t?'二者同向，故前后两截所见略同，其力一贯。'
                                    :'二者向背不同，故同一运中前后两截所见有别。')+'</div>';
      }
      if(sCls==='印'&&weak)h+='<div class="rp-kv">身弱逢印，正是得补之时——然印赖身受，若课业过重反损其力，宜循序渐进。</div>';
      if(sCls==='官杀'&&weak)h+='<div class="rp-kv">身弱逢官杀，课业压力重于功名之得——《子平真诠》「官杀不可无制」，宜先养其力、后求其名。</div>';
      if(sCls==='印'&&(CG==='财'||CZ==='财'))h+='<div class="rp-kv">本运兼见财星，财能坏印（《子平真诠·论印绶》所谓「印绶用印，最忌财星坏印」），须防因实务、情事分心而废学。</div>';
    }else{
      h+='<div style="font-size:14px;line-height:1.9;color:#666">本运干支之十神于学业无专象，其应多随流年，不在此运之全局。</div>';
    }
    h+=gongDyn(['月运']);
    push('study','学业',sumBase+'　'+(sRec?('学业'+({'利':'利','半':'半利','碍':'碍','平':'平'}[sRec.t]||sRec.t)):'学业随流年'),h);
  })();

  // ⑤ 健康——日主之气在运支之十二长生＋日柱（身）受动＋十神之伤病象
  (function(){
    var h=benXiang('health');
    var sheng=['长生','冠带','临官','帝旺'].indexOf(cd.di)>=0;
    var shuai=['衰','病','死','绝','胎'].indexOf(cd.di)>=0;
    h+='<div class="rp-kv">［日主之气］日主'+dg+'临此运之支'+cd.z+'为「'+cd.di+'」——'+
       (sheng?'<b>得地</b>：根气在身，任劳有力，纵有小疾亦复之速。'
        :shuai?'<b>失地</b>：根气不厚，此十年宜节劳、节欲、慎起居；旧疾宜早治，勿以「无暇」延之。'
        :'根气居中，不厚不薄，无大补亦无大损，宜常保其起居之常度。')+
       '（此以十二长生论日主之气，与「运等」之以十神喜忌论吉凶者各为一事，须两参之。）</div>';
    if(cd.jg.t==='忌'&&cd.jz.t==='忌')
      h+='<div class="rp-kv">［忌神之防］干支俱为忌神，内外皆无所助——《三命通会》「岁运并忌，其祸必深」，此十年尤须节劳、节用、慎交，宜按岁体检、勿恃年少。</div>';
    h+=gongDyn(['日运']);
    push('health','健康',sumBase+'　'+cd.di+'（'+(sheng?'得地':shuai?'失地':'居中')+'）',h);
  })();

  // ⑥ 子女——时柱为子女之宫，男以官杀为子、女以食伤为子
  (function(){
    var childStar=(gender===1?'官杀':'食伤');
    var h=benXiang('child');
    var hitStar=(CG===childStar||CZ===childStar);
    h+='<div class="rp-kv">［子女星与子女宫］'+mKey+'命以'+GEN_NAME[childStar]+'为子女星，时柱为子女之宫（《三命通会·论宫分》「时为果」）。'+
       '此运所主之神为'+GEN_NAME[CG]+'（干）、'+GEN_NAME[CZ]+'（支）——'+
       (hitStar?'子女星当运，主生育、添丁、子女升学立业之事当令，应期多在此运中子女星得地之年。'
        :'子女星未当运，子女之事多系于流年之引动；此运所见者，偏在「为子女操持用度、教养分心」一面。')+'</div>';
    h+=gongDyn(['时运']);
    push('child','子女',sumBase+'　'+(hitStar?'子女星当运':'子女随流年'),h);
  })();

  // ⑦ 父母——年月二柱为父母之宫，父星偏财、母星正印
  (function(){
    var h=benXiang('parents');
    var isCai=(CG==='财'||CZ==='财'), isYin=(CG==='印'||CZ==='印');
    h+='<div class="rp-kv">［父母星与父母宫］父星为<b>偏财</b>、母星为<b>正印</b>（《渊海子平》取用），年、月二柱为父母之宫。'+
       '此运所主之神为'+GEN_NAME[CG]+'（干）、'+GEN_NAME[CZ]+'（支）——'+
       (isCai&&isYin?'财印交见，父母二星并动：主家计与亲疾之事同来，宜早为安排、宜分其缓急。'
        :isCai?'财星当运，主父辈之事、家计产业之耗；财为忌者，尤须防因财而伤亲情。'
        :isYin?'印星当运，主母辈之事：得荫、得助，或须留意母之健康；印为忌者，主受长辈之累。'
        :'父母之星未当运，父母之事多随流年而见，此运不以此为主。')+'</div>';
    h+=gongDyn(['年运','月运']);
    push('parents','父母',sumBase+'　'+(isCai&&isYin?'财印交见':isCai?'父星（财）当运':isYin?'母星（印）当运':'父母随流年'),h);
  })();

  // ⑧ 人际（同辈、朋友、贵人）——月柱亦为兄弟朋友之门庭
  (function(){
    var h=benXiang('rel');
    var isBi=(CG==='比劫'||CZ==='比劫');
    h+='<div class="rp-kv">［朋辈与贵人］'+
       (isBi?'比劫当运，朋辈之事当令：得同辈之助亦受其分——《三命通会》「比劫主分」，合作宜明定规约而后共事。'
        :(CG==='官杀'||CZ==='官杀')?'官杀当运，多与强势之人、上位者打交道：得其提携则贵，受其压制则劳，宜守分而勿争。'
        :(CG==='印'||CZ==='印')?'印星当运，得长辈师长之助，宜多就教、多结文字之缘。'
        :'此运所主之神于人际无专象，交游大体平顺，其变多随流年。')+'</div>';
    h+=gongDyn(['月运']);
    push('rel','人际',sumBase+'　'+(isBi?'朋辈当令':(CG==='官杀'||CZ==='官杀')?'上位者当道':(CG==='印'||CZ==='印')?'长辈师长之助':'人际随流年'),h);
  })();
  return out;
}

// 十神 × 运程维度（财务/事业/人际/健康/配偶姻缘/父母/子女）
// 依《三命通会》论十神诸篇《渊海子平》十神诸赋《子平真诠》各格喜忌取象
var SS_ASPECT={
  '比肩':{fin:'比肩分财——财务须防合伙破耗、朋友借贷，然凭实力生财则稳',
    career:'同业并肩、合作竞争之象，宜以实力立身，忌与人争权',
    rel:'广结同辈、义气相助，社交活跃，亦防闲话是非',
    health:'劳碌耗神，注意筋骨劳损',
    spouse:'须防同性争缘、聚少离多，夫妻之间宜多沟通',
    parents:'为兄弟之事牵累父母心神，家内须和睦',
    child:'为子息操劳，须防因兄弟之事分心子女教养'},

//   报告六节（原局总纲／诸步大运总览／当前大运详论／当年流年详论／
//   当月流月详论／体用合观）各自可收放，展开状态按 data-fold-key 记忆，
//   与报告内小节的机制全同（见文末「可收放区块」一段）。
// ═══════════════════════════════════════════════════════════════════
function rpSecFold(key,title,sum,body,open){
  return '<details class="gs-sub rp-sec1"'+(open?' open':'')+' data-fold-key="'+key+'">'+
    '<summary><span class="gs-sub-t">'+title+'</span>'+
    (sum?'<span class="gs-sub-sub">'+sum+'</span>':'')+
    '<span class="gs-fold-hint">点开</span></summary>'+
    '<div class="gs-sub-body">'+body+'</div></details>';
}
// 把自 pos 起已拼入 h 的内容，收为本节之体（pos 之前者不动）
function rpSecWrap(h,pos,key,title,sum,open){
  var body=h.slice(pos);
  h=h.slice(0,pos);
  return h+rpSecFold(key,title,sum,body,open);
}

// 五、当月流月详论（期）
// 【同源】① 十神之象与「岁运算程」同表；② 刑冲合害取 PAIR_OK.fm
//   （流月 × 大运／流年／四柱），与「刑冲合害会·流月与大运、流年、原局」
//   同一应事库；③ 神煞取 shenShas() 之「流月」列，与「神煞」一节同口径。
//   故本节不另立说，只以「月之干支」配「何宫受动」，落到一月之上。
// 【义理】运主十年之势、岁主一年之权、月主一月之应——
//   《滴天髓》「休囚系乎运，尤系乎岁」：岁重于运，而月又为岁之分，
//   其力虽不及岁，而发用最速，故一岁之吉凶往往先见于某月之冲动或当令。
// ═══════════════════════════════════════════════════════════════════
function rpLiuYueSec(o){
  var dg=o.dg, judge=o.judge, mingArr=o.mingArr, curDy=o.curDy, lyGZ=o.lyGZ;
  var fmList=o.fmList||[], fmIdx=(o.fmIdx||0), ss=o.ss||{}, st=o.st, cong=o.cong;
  var m=fmList[fmIdx];
  var h='';
  if(!m)return '<div class="rp-say" style="color:#888">未排流月，无当月可论。</div>';

  var mg=m.gz.charAt(0), mz=m.gz.charAt(1);
  var mjg=judge(GAN_WX[mg]), mjz=judge(WX_ZHI[mz]);
  var mgr=rpGrade(mjg,mjz);
  var mssg=shiShenName(dg,mg), mssz=shiShenName(dg,HIDE[mz][0]);
  var mq=HIDE[mz][0];
  var diM=diShi(dg,mz);

  // 起止：本月之节 → 次月之节（十二节为界，非农历月初）
  var next=fmList[fmIdx+1];
  var qiZhi=(m.label||'')+'（'+m.jie+'）';
  var zhiTxt=next?('至 '+String(next.label||'').replace('日起','日')+'（'+next.jie+'）前一日止'):'至本年之末止';

  h+='<div class="rp-lead"><b style="font-size:17px;color:#1f4e79">'+m.gz+'</b>　'+
     '月等 <span class="rp-lv" style="background:'+mgr.bg+';color:'+mgr.fg+'">'+mgr.k+'</span>'+
     '　'+qiZhi+'　'+zhiTxt+'　日主临此支为「'+diM+'」</div>';

  // 十神与喜忌
  h+='<div class="rp-say"><b>十神</b>　月干<b>'+mg+'</b>（'+GAN_WX[mg]+'·'+mssg+'）判为<span style="'+mjg.css+'">'+mjg.c+'</span>——'+RP_SS_YI[mssg]+'；'+
     '月支<b>'+mz+'</b>本气'+mq+'为'+mssz+'，判为<span style="'+mjz.css+'">'+mjz.c+'</span>——'+RP_SS_YI[mssz]+'。'+
     '《滴天髓》「休囚系乎运，尤系乎岁」：运定十年之势、岁定一年之权、月定一月之应；'+
     '月之力虽轻于岁，而发用最速，故一岁之吉凶，往往先见于某月之冲动或当令之月。</div>';

  // 得地与否（与第三节同一口径：十二长生只论日主之气，不径断吉凶）
  var dmTxt='';
  if(['长生','冠带','临官','帝旺'].indexOf(diM)>=0)
    dmTxt='日主'+dg+'临此月支'+mz+'为「'+diM+'」——<b>得地</b>：本月根气在身，任事有力，谋为易遂。';
  else if(['衰','病','死','绝','胎'].indexOf(diM)>=0)
    dmTxt='日主'+dg+'临此月支'+mz+'为「'+diM+'」——<b>失地</b>：本月根气不厚，任事费力，宜减事、宜借印比之助，忌勉强举事。';
  else
    dmTxt='日主'+dg+'临此月支'+mz+'为「'+diM+'」——根气居中，成败多系于本月之十神与受动之宫。';
  dmTxt+='<span style="color:#6a7a8a;font-size:13px">（此以十二长生论日主之气，与「月等」之以十神喜忌论吉凶者各为一事，须两参之。）</span>';
  h+='<div class="rp-say"><b>得地与否</b>　'+dmTxt+'</div>';

  // 与四柱、大运、流年之刑冲合害（与「刑冲合害会·流月」同库）
  var fmArr=[{pos:'流月',gan:mg,zhi:mz}];
  var dyA=curDy?[{pos:'大运',gan:curDy.g,zhi:curDy.z}]:[];
  var lyA=lyGZ?[{pos:'流年',gan:lyGZ.charAt(0),zhi:lyGZ.charAt(1)}]:[];
  var Rm=pickPairs(relations(fmArr.concat(lyA,dyA,mingArr)),PAIR_OK.fm);
  var Lm=rpRelList(Rm);
  if(Lm.length){
    h+='<div class="rp-say"><b>与四柱、大运、流年之刑冲合害</b>（应事依「刑冲合害会·流月与大运、流年、原局」同库）</div>';
    Lm.forEach(function(o2){
      h+='<div class="rp-kv" style="margin:3px 0 3px 4px">'+
        '<span class="rel-tag rel-'+(o2.kind==='chong'?'chong':o2.kind==='xing'||o2.kind==='ziXing'?'xing':o2.kind==='hai'?'hai':o2.kind==='hui'?'hui':o2.kind==='ganHe'||o2.kind==='ganChong'?'gan':'he')+'">'+o2.verb+'·'+rpGongName(o2.kp)+'</span>'+
        '<span class="rel-sub">'+o2.name+'</span>'+
        (o2.yi?'<span style="color:#555">'+o2.yi+'。</span>':'')+'</div>';
    });
  }else{
    h+='<div class="rp-say"><b>与四柱、大运、流年之刑冲合害</b>　本月与四柱、大运、流年之间未见刑冲合害会，无宫受动——'+
       '一月之内无甚牵动，其得失只在十神之喜忌，事应平缓。</div>';
  }

  // 神煞（与「神煞」一节同口径，只取本月所值者）
  var mSha=((ss['流月']||[]).filter(function(n){return n&&n!=='—'&&SHA_YI[n];}));
  if(mSha.length){
    h+='<div class="rp-say"><b>本月所值之神煞</b>　'+
      mSha.map(function(n){return '<span class="sha-chip sha-'+SHA_YI[n].t+'">'+n+'</span>';}).join('')+
      '<div class="rp-kv" style="margin-top:4px">'+
      mSha.map(function(n){return '<b>'+n+'</b>（'+SHA_YI[n].t+'）：'+shaYiTxt(n,st,mjz);}).join('<br>')+
      '</div></div>';
  }

  // 本年诸月之应期（原「流月应期」，移此以便与当月之论同观）
  var dz=o.dz, mzY=o.mzY, lz=lyGZ?lyGZ.charAt(1):'', dzY=curDy?curDy.z:'';
  if(fmList.length){
    var hits=[];
    fmList.forEach(function(x){
      var z2=x.gz.charAt(1);
      var tags=[];
      if(ZHI_CHONG[z2]===dz)tags.push('冲日支（身与配偶之宫）');
      if(ZHI_CHONG[z2]===mzY)tags.push('冲月支（门庭事业之宫）');
      if(lz&&ZHI_CHONG[z2]===lz)tags.push('冲流年之支');
      if(dzY&&ZHI_CHONG[z2]===dzY)tags.push('冲大运之支');
      if(ZHI_HE_PAIR[z2]===dz)tags.push('合日支');
      if(tags.length)hits.push({gz:x.gz,label:x.label,jie:x.jie,tags:tags});
    });
    var xiYue=[];
    fmList.forEach(function(x){
      var xg=x.gz.charAt(0), xz=x.gz.charAt(1);
      if(judge(GAN_WX[xg]).t==='喜'||judge(WX_ZHI[xz]).t==='喜')xiYue.push(x.gz);
    });
    var fmTxt='';
    if(hits.length){
      fmTxt='一岁之应，多落于<b>冲动或相合之月</b>：'+hits.slice(0,6).map(function(x){
        return '<b>'+x.gz+'</b>（'+x.label+'，'+x.tags.join('、')+'）';}).join('；')+
        '。冲则动——凡迁居、调动、出行、争讼之事，多应于此数月；'+
        '其所冲之支属何宫，即应何事（日支应身与配偶、月支应门庭事业、时支应子女、年月应父母）。';
    }else{
      fmTxt='本年十二月中未见冲动日、月、岁、运之支者，其应不专在一月，宜以十神当令之月为断。';
    }
    if(xiYue.length)fmTxt+='又<b>喜用得令之月</b>为 '+xiYue.slice(0,8).join('、')+'——此数月谋事、签约、进取为得时；'+
      '反之，忌神当令之月宜守、宜敛、宜待。';
    h+='<div class="rp-say"><b>本年诸月之应期</b>　'+fmTxt+
      '<span style="color:#889;font-size:13px">（流月以十二节为界，非以农历月初为界；详见「流月」一节。）</span></div>';
  }

  // 本月小结：运、岁、月三者合看
  var nDy=curDy?curDy.gr.n:0, nLy=o.nLy||0, nM=mgr.n;
  var t3=nDy+nLy+nM;
  var mSum='';
  if(t3>=3)mSum='运、岁、月三者俱顺，此月为一岁中难得之应期：宜决久悬之事、宜签署、宜出行进取，迟则势移。';
  else if(t3<=-3)mSum='运、岁、月三者俱逆，此月最宜退守：凡扩张、投资、争讼、远行皆宜暂缓；一月之所失在「争」，所得在「守」。';
  else if(t3>0)mSum='三者合看得正数，此月大体可进：惟月之力轻，所成者多为细务与铺垫，不宜以一月之利而举十年之事。';
  else if(t3<0)mSum='三者合看得负数，此月事多阻滞：多于将成之际生变，宜留退步、勿尽摊牌，待当令之月再举。';
  else mSum='三者相抵，此月吉凶各半：得失皆不深，宜按部就班，不宜大举，亦不必过忧。';
  h+='<div class="rp-say"><b>本月小结</b>　'+mSum+
     '<span style="color:#6a7a8a;font-size:13px">（运、岁、月三者之品第相加，只得其一月之倾向；月为岁之分，其力轻于岁，不可据一月而定一岁。）</span></div>';

  h+='<div class="rp-kv">本节之细目（十神象义、宫位应事、神煞）另见「岁运算程·三、流月」与「刑冲合害会·流月与大运、流年、原局」，此只括其要。</div>';
  return h;
}

function buildReport(h, ctx){
  var dg=ctx.dayGan, pillars=ctx.pillars, st=ctx.st, gj=ctx.gj, th=ctx.th, ys=ctx.ys;
  var gender=(ctx.gender===undefined||ctx.gender===null)?1:ctx.gender;   // 1=男、0=女
  var cong=(ys&&ys.cong)?ys.cong:null;
  var judge=rpJudgeFn(dg,ys);
  var mingArr=pillars.map(function(p){return {pos:p.name,gan:p.gan,zhi:p.zhi};});
  // pairGongKey 倚 PILLAR_OF_ZHI 反查「地支字→柱」；buildRelation 亦设之，
  //   此节自设一份，免以调用次序为凭（本节可先于彼调用）。
  PILLAR_OF_ZHI={};
  pillars.forEach(function(p){ if(PILLAR_OF_ZHI[p.zhi]===undefined)PILLAR_OF_ZHI[p.zhi]=p.name; });

  var strong=(st.cls==='身强'||st.cls==='偏强');
  var weak=(st.cls==='身弱'||st.cls==='偏弱');
  var yongName=(ys.yong||[]).map(function(c){return GEN_NAME[c];}).join('、');
  var jiName=(ys.ji||[]).map(function(c){return GEN_NAME[c];}).join('、');
  var mz=pillars[1].zhi, dz=pillars[2].zhi;
  var benQi=HIDE[mz][0], benCls=wxToClass(dg,GAN_WX[benQi]);

  // ── 一、原局之体 ──
  var R0=pickPairs(relations(mingArr),PAIR_OK.ming);
  var L0=rpRelList(R0);
  var cJu=(R0.he||[]).length+(R0.hui||[]).length;
  var cHe=(R0.liuHe||[]).length;
  var cChong=(R0.chong||[]).length;
  var cXing=(R0.xing||[]).length+(R0.ziXing||[]).length;
  var cHai=(R0.hai||[]).length;
  var r0txt='';
  if(!cJu&&!cHe&&!cChong&&!cXing&&!cHai){
    r0txt='四柱自相之间未见刑冲合害会，格局清纯，根基不动——吉凶全系于岁运之引动，故一生之进退，当以「用神得地」之运为进身之期。';
  }else{
    var b0=[];
    function rpCat(list,label){
      if(!list||!list.length)return;
      var names=list.map(function(it){
        var kp=pairGongKey(it.items||[]);
        return (it.name||'')+(kp?'（'+rpGongName(kp)+'）':'');
      });
      b0.push(label+' '+list.length+' 处：'+names.join('、'));
    }
    rpCat((R0.he||[]).concat(R0.hui||[]),'成局成会');
    rpCat(R0.liuHe,'六合');
    rpCat(R0.chong,'相冲');
    rpCat((R0.xing||[]).concat(R0.ziXing||[]),'相刑');
    rpCat(R0.hai,'相害');
    r0txt='四柱自相——'+b0.join('；')+'。';
    var dayT=L0.filter(function(o){return o.kp.indexOf('日')>=0&&/^(chong|xing|ziXing|hai)$/.test(o.kind);});

    //   （如年月两午），则只与后一午成半合，前一午之合漏而不得。今改为「尽收诸支、
    //   逐对而成」，一支不遗。
    var l1=arr.filter(function(a){return a.zhi===h.z[0];});
    var l2=arr.filter(function(a){return a.zhi===h.z[1];});
    l1.forEach(function(a1){
      l2.forEach(function(a2){
        if(a1.pos===a2.pos)return;
        var isYunHalf=(POS_RANK[a1.pos]<0||POS_RANK[a2.pos]<0);
        var key=isYunHalf?(h.name+'@'+a1.pos+'@'+a2.pos):h.name;
        if(seenHalf[key])return;seenHalf[key]=1;
        out.banHe.push({name:h.name,q:h.q,wx:h.wx,items:[a1.pos,a2.pos],zhi:h.z,
          desc:h.q===2?'生旺半合，力最著':h.q===1?'旺墓半合，力次之':'拱合（生墓），力弱，须待岁运补中神'});
      });
    });
  });
  // —— 六合 ——
  // 【订·去重口径】原法以「地支字对」全局去重（seenHe['子丑']）：同一字对无论
  //   出现于「年柱·月柱」还是「大运·日柱」，只报一次。于原局之内为是——
  //   一局之中同一字对只当论一次，不作两处之象；然施于岁运则误：
  //   大运之子与流年之子、与月支之丑，三者相交的应是三事，非一事。
  //   岁运为「来者」，与命局每一处相值，象各不同《三命通会·论宫分》
  //   「凡岁运之十神，加于何宫，即应何事」——宫既不同，其应即异。
  //   今改：去重只在「四柱自相」范内行之；凡涉岁运（大运/流年/流月）之对，
  //   皆各报一次，以「位置对」为键而非以「字对」为键。
  var seenHe={};
  for(var i=0;i<n;i++){
    for(var j=i+1;j<n;j++){
      if(ZHI_HE_PAIR[arr[i].zhi]!==arr[j].zhi)continue;
      var pair=pairKey(arr[i].zhi,arr[j].zhi,ZHI_ORDER);
      // 键：含岁运者以位置对为准（岁运·某柱各论），纯四柱者以字对为准（一局只一象）
      //   岁运之判用 POS_RANK<0（大运 -3、流年 -2、流月 -1），四柱为 0~3。
      var isYunHe=(POS_RANK[arr[i].pos]<0||POS_RANK[arr[j].pos]<0);
      var heKey=isYunHe?(pair+'@'+arr[i].pos+'@'+arr[j].pos):pair;
      if(seenHe[heKey])continue;seenHe[heKey]=1;
      var nm=ZHI_HE_INFO[pair]||(pair+'合');
      out.liuHe.push({name:nm,items:[arr[i].pos,arr[j].pos],zhi:[arr[i].zhi,arr[j].zhi],
        desc:'六合主和合、牵绊；合而化者须月令有化神之气，否则只合不化'});
    }
  }
  // —— 六冲 ——
  for(var i2=0;i2<n;i2++){
    for(var j2=i2+1;j2<n;j2++){
      if(ZHI_CHONG[arr[i2].zhi]!==arr[j2].zhi)continue;
      var z1=arr[i2].zhi,z2=arr[j2].zhi;
      var t1=posTierName(arr[i2].pos),t2=posTierName(arr[j2].pos);
      var kind=(t1==='运'&&t2==='运')?'岁运相冲':(t1!=='运'&&t2!=='运')?'本命相冲':(arr[i2].pos==='日柱'||arr[j2].pos==='日柱'?'冲及日主':'运冲四柱');
      var cdesc=kind==='本命相冲'?'四柱自冲，根基不宁——主该二宫所主之事（如年月主祖业父母、日时主自身子女）本有动摇，一生须防此二处之变。'
               :kind==='岁运相冲'?'岁运自冲，主当年内即有迁变、外出、争斗之事，应期最速，多在冲动之月。'
               :kind==='冲及日主'?'所冲及于日柱——日为我身与配偶之宫，冲动则主自身或家室之变，亦主身体、居所、婚配之动。'
               :'岁运之气冲入四柱，为「引动」——冲年主长辈门庭、冲月主父母兄弟与事业、冲日主自身与配偶、冲时主子女晚景，应事多在当年。';
      out.chong.push({name:pairKey(z1,z2,ZHI_ORDER)+'冲',items:[arr[i2].pos,arr[j2].pos],zhi:[z1,z2],kind:kind,desc:cdesc});
    }
  }
  // —— 三刑 ——
  // 【订】半刑之去重键：原为 dedupKey='half-'+刑名（全局），今改为分离计数，
  //   纯四柱者一局一象、涉岁运者按位置对各论（理由同六合）。
  var seenXingHalf={};
  SAN_XING.forEach(function(x){
    if(x.z.length===1){
      // 自刑：同一地支重现（至少两支）
      var cnt=arr.filter(function(a){return a.zhi===x.z[0];});
      if(cnt.length>=2){
        // 去重：同一组只报一次
        out.ziXing.push({name:x.name,kind:'ziXing',items:cnt.map(function(c){return c.pos;}),zhi:[x.z[0],x.z[0]],desc:'同类相刑，主自招、内耗、反复'});
      }
    }else if(x.z.length===2){
      // 【订】原只取 m1[0]/m2[0]（首见之一支），同字多柱者漏。今逐对而成，
      //   纯四柱按字对去重、涉岁运按位置对去重。
      var m1=arr.filter(function(a){return a.zhi===x.z[0];});
      var m2=arr.filter(function(a){return a.zhi===x.z[1];});
      m1.forEach(function(a){
        m2.forEach(function(b2){
          if(a.pos===b2.pos)return;
          var isYunX2=(POS_RANK[a.pos]<0||POS_RANK[b2.pos]<0);
          var xk2=isYunX2?('x2-'+x.name+'@'+a.pos+'@'+b2.pos):('x2-'+x.name);
          if(seenXingHalf[xk2])return;seenXingHalf[xk2]=1;
          out.xing.push({name:x.name,sub:x.sub,kind:'xing',items:[a.pos,b2.pos],zhi:[x.z[0],x.z[1]],
            desc:'相刑主刑伤、是非、诉讼、病灾；子卯为无礼之刑，主恩义失序'});
        });
      });
    }else{
      var got=x.z.filter(function(z){return zhis.indexOf(z)>=0;});
      // 三支是否各有其柱（命局与岁运同参）：三刑古法「三支俱全方为真刑」，
      // 若三支分处命局与岁运，亦算刑成《三命通会》「岁运凑齐三刑」之例，不可降为半刑。
      var cntOf=function(z){return arr.filter(function(a){return a.zhi===z;}).length;};
      var allThree=x.z.every(function(z){return cntOf(z)>0;});
      if(allThree){
        // 报告首见之三柱（同类去重，避免同一组三刑反复出现）
        // 【订】原取 arr.filter(...)[0] 即「首见之柱」，而 arr 之序为岁运在前
        //   （大运→流年→流月→四柱），故所得多为岁运而非命局。三刑既以命局为体，
        //   代表柱宜先取命局；岁运仅在其缺时补之。改用 pickRep（与三合三会同法）。
        var it3=[];x.z.forEach(function(z){var f=pickRep(z);if(f)it3.push(f.pos);});
        out.xing.push({name:x.name,sub:x.sub,kind:'xing',items:it3,full:true,zhi:x.z.slice(),
          desc:'三刑俱全（命局与岁运凑齐三支），刑力最重；主刑狱、疾患、骨肉不和'});
      }
      else if(got.length===2){
        // 半刑：以「所在之柱」报告。
        // 【订】原 dedupKey='half-'+x.name 为全局去重，且只取首见之一支（m[0]），
        //   故年月皆寅、日巳者，只与首寅成半刑，次寅之刑漏；大运寅与流年寅亦只报其一。
        //   今改：尽收诸支、逐对而成；纯四柱按「刑名+字对」去重（一局一象），
        //   涉岁运按「刑名+位置对」去重（宫异则应异）。
        var lg=got.map(function(z){return arr.filter(function(a){return a.zhi===z;});});
        lg[0].forEach(function(a){
          lg[1].forEach(function(b2){
            if(a.pos===b2.pos)return;
            var isYunX=(POS_RANK[a.pos]<0||POS_RANK[b2.pos]<0);
            var xkey=isYunX?('half-'+x.name+'@'+a.pos+'@'+b2.pos):('half-'+x.name);
            if(seenXingHalf[xkey])return;seenXingHalf[xkey]=1;
            out.xing.push({name:got.join('')+'（'+x.name+'之半）',sub:x.sub,kind:'xing',items:[a.pos,b2.pos],
              full:false,zhi:got.slice(),dedupKey:xkey,
              desc:'三刑未全，只论二支相刑，力减；须岁运补足第三支方应'});
          });
        });
      }
    }
  });
  // —— 六害 ——
  // 【订】去重口径同六合：纯四柱者按字对去重（一局只论一象），
  //   涉岁运者按位置对去重——岁运与不同之柱相害，宫异则应异。
  // 【补·刑夺其合】寅巳申三刑以巳申为「合中之刑」：巳申本六合（合水），而寅巳申
  //   三支俱全时，巳既刑申、又刑寅，其势在刑不在合。《三命通会·论三刑》所谓
  //   「寅巳申为无恩之刑……三刑俱全，虽合不化」；《渊海子平》亦谓
  //   「刑重则合不能化」。故凡寅巳申三支俱见者，其巳申之合存名而不化，
  //   另加一句以明之——非谓无合，乃谓合为刑夺、不能成化。
  var xingQuan={};   // 三刑俱全之字组，如「寅巳申」
  out.xing.forEach(function(x){
    if(x.full){
      var zz=(x.zhi||[]).join('');
      xingQuan[zz]=1;
      // 兼容未设 zhi 者：以刑名为凭（「寅巳申三刑」「无恩之刑」等）
      if(!zz && x.name) xingQuan[x.name]=1;
    }
  });
  // 【订】旧作「A || B」二句：B 者 k.indexOf('寅巳申')>=0，凡 B 真者 A（寅、巳、申三字皆在）
  //   必亦真，故 B 恒为死子句。今删 B，只留 A。
  var hasSanXing=Object.keys(xingQuan).some(function(k){
    return k.indexOf('寅')>=0&&k.indexOf('巳')>=0&&k.indexOf('申')>=0;
  });
  if(hasSanXing){
    out.liuHe.forEach(function(lh){
      var zz=(lh.zhi||[]);
      if(zz.indexOf('巳')>=0&&zz.indexOf('申')>=0){
        lh.xingDuo=true;
        lh.desc='六合本主和合牵绊，然此巳申之合与寅巳、巳申二刑并存——寅巳申三刑俱全，'
          +'「虽合不化」（此语旧标《三命通会·论三刑》原文，检原书未见此句，当为后世括引之辞；'
          +'其义则与《三命通会》论刑「合不能化」之旨相合，今存其义而标其未确），'
          +'故合存其名而其气为刑所夺：主恩中带怨、合而复合、事有成而复败之象，'
          +'宜察其刑之所伤，不可徒恃其合。';
      }
    });
  }
  var seenHai={};
  for(var i3=0;i3<n;i3++){
    for(var j3=i3+1;j3<n;j3++){
      if(ZHI_HAI[arr[i3].zhi]!==arr[j3].zhi)continue;
      var hp=pairKey(arr[i3].zhi,arr[j3].zhi,ZHI_ORDER);
      var isYunHai=(POS_RANK[arr[i3].pos]<0||POS_RANK[arr[j3].pos]<0);
      var haiKey=isYunHai?(hp+'@'+arr[i3].pos+'@'+arr[j3].pos):hp;
      if(seenHai[haiKey])continue;seenHai[haiKey]=1;
      out.hai.push({name:hp+'害',items:[arr[i3].pos,arr[j3].pos],zhi:[arr[i3].zhi,arr[j3].zhi],
        desc:'害（穿）主暗损、离心、背后是非，多主六亲缘薄或暗耗'});
    }
  }
  // —— 天干五合 ——
  // 【订】去重口径同地支之合：纯四柱按干字对（一局一象），涉岁运按位置对
  //   ——「大运甲合月柱己」与「流年甲合月柱己」为二事：一系十年之常、一系一年之应。
  var seenGH={};
  for(var i4=0;i4<n;i4++){
    for(var j4=i4+1;j4<n;j4++){
      if(GAN_HE_PAIR[arr[i4].gan]!==arr[j4].gan)continue;
      var pk=pairKey(arr[i4].gan,arr[j4].gan,GAN_ORDER);
      var isYunGH=(POS_RANK[arr[i4].pos]<0||POS_RANK[arr[j4].pos]<0);
      var ghKey=isYunGH?(pk+'@'+arr[i4].pos+'@'+arr[j4].pos):pk;
      if(seenGH[ghKey])continue;seenGH[ghKey]=1;
      var gname=GAN_HE_NAME[pk]||(pk+'合');
      out.ganHe.push({name:gname,kind:'ganHe',items:[arr[i4].pos,arr[j4].pos],gan:[arr[i4].gan,arr[j4].gan],
        desc:'天干相合主亲和、羁绊；合而化者须月令有化神当令，否则合而不化'});
    }
  }
  // —— 天干相冲 ——
  var seenGC={};
  for(var i5=0;i5<n;i5++){
    for(var j5=i5+1;j5<n;j5++){
      if(GAN_CHONG[arr[i5].gan]!==arr[j5].gan)continue;
      var gp=pairKey(arr[i5].gan,arr[j5].gan,GAN_ORDER);
      var isYunGC=(POS_RANK[arr[i5].pos]<0||POS_RANK[arr[j5].pos]<0);
      var gcKey=isYunGC?(gp+'@'+arr[i5].pos+'@'+arr[j5].pos):gp;
      if(seenGC[gcKey])continue;seenGC[gcKey]=1;
      out.ganChong.push({name:gp+'冲',kind:'ganChong',items:[arr[i5].pos,arr[j5].pos],gan:[arr[i5].gan,arr[j5].gan],
        desc:'天干相冲主显性冲突、变动、外出；较地支之冲为轻'});
    }
  }
  // —— 合以解冲：贪合忘冲 ——
  // 立说：《子平真诠·论刑冲会合解法》所谓「刑冲会合，全在四柱干支之间，各有轻重」
  //   ——合与冲同见，则合者牵之，气有所属而不旁出，冲之力减，甚至不论。
  // 古法所谓「贪合忘冲、贪合忘克」；《渊海子平》亦谓「有合则冲不破」。
  // 本工具判例如下，宁存疑而不妄断：
  //   ① 天干之合解地支之冲——须「该干恰坐于被冲之支上」，即支欲冲而干被合住，支乃不动。
  //      例：年干丙坐子、月干辛坐午，丙辛相合，则子午虽冲而不成冲。
  //   ② 地支六合解冲——被冲二支之一，另与第三支成六合（如子午冲，而子又与丑合）。
  //   ③ 冲之两支本身相合者（寅申、巳亥）——《三命通会》谓「寅申巳亥既冲且合，最的」，
  //      合而冲者主牵绊中之变动，冲仍在，故此处不视为解，只于断语中另加一句。
  //   ④ 三合、三会成局者，其局内之支不另论冲（气势归局）。
  var chongFree=[];        // 被解之冲：另存，不计入正冲之数
  var pairZhiOf=function(it){return it&&it.zhi?it.zhi.slice():[];};
  // ① 天干合住「所坐之支」→ 该柱之支不动（按柱位记，不按地支之字，理由见下）
  var ganHeLockPos={};
  out.ganHe.forEach(function(gh){
    (gh.items||[]).forEach(function(pos){
      var a=arr.filter(function(x){return x.pos===pos;})[0];
      if(a)ganHeLockPos[pos]=a.zhi;
    });
  });
  // ② 地支六合所涉之支
  var heZhi={};
  out.liuHe.forEach(function(lh){ pairZhiOf(lh).forEach(function(z){heZhi[z]=1;}); });
  // ③ 成局之支（三合三会）
  var juZhi={};
  out.he.concat(out.hui).forEach(function(g){ pairZhiOf(g).forEach(function(z){juZhi[z]=1;}); });
  out.chong=(out.chong||[]).map(function(c){
    var z=pairZhiOf(c);
    if(z.length<2)return c;
    var zz=z.slice();
    // ①②：就「本条冲所涉的两柱」查其干是否被合、其支是否另有所合
    //   不可按地支之字建表——同字可现于两柱（如年月两子），一柱被合、一柱未被合，
    //   以字为键则彼此覆盖，反把「该解」判成「不解」。
    var posA=(c.items||[])[0], posB=(c.items||[])[1];
    var colA=arr.filter(function(x){return x.pos===posA;})[0];
    var colB=arr.filter(function(x){return x.pos===posB;})[0];
    var lockA=colA?ganHeLockPos[posA]:false, lockB=colB?ganHeLockPos[posB]:false;
    // 支合：该支另与「本条冲以外」之支成六合，方为牵住（两支本身既冲又合者另论）
    var heA=out.liuHe.some(function(lh){
      var it=lh.items||[];
      return it.indexOf(posA)>=0 && it.indexOf(posB)<0;
    });
    var heB=out.liuHe.some(function(lh){
      var it=lh.items||[];
      return it.indexOf(posB)>=0 && it.indexOf(posA)<0;
    });
    // 【订·义理】「亦冲亦合」之条：旧以 ZHI_HE_PAIR 查寅申、巳亥，谓此二对既冲又合。
    //   然六合六对为子丑、寅亥、卯戌、辰酉、巳申、午未，六冲六对为子午、丑未、寅申、
    //   卯酉、辰戌、巳亥，二者无一对相重，故亦冲亦合之支对本不存在，其条恒不可现。
    //   按：寅申巳亥之说，乃谓四生之位彼此互有冲合——寅申冲而寅亥合、巳亥冲而巳申合，
    //   非谓寅与申自为六合。故不以「亦冲亦合」立条（旧变量 alsoHe 已删）。
    // 【订】旧作 (heA&&!heB)||(heB&&!heA)（异或），于「两支各有所合」时反判不解，
    //   与「贪合忘冲」之义相违——两支各自被合住，其气皆有所属，正是不冲。今改为「或」。
    var freeByHe=(lockA||lockB)||heA||heB;
    // 【订】旧有 freeByJu（两支皆已归入三合三会之局则不另论冲），其表 juZhi 按「地支之字」
    //   建成——恰与其上「不可按地支之字建表」之注相违；且三合三会局内本无相冲之支对
    //   （如申子辰局内申与子、与辰皆不冲），故两支「同归一局而相冲」实不可能，此条件恒假。
    //   若两支分属两局（如子在申子辰、午在寅午戌），则是「两局相战」，其冲愈显，尤不可解。
    //   今删此条：成局之支与局外之支相冲者，其冲照论（且为「冲犯旺局」，其应更著）。
    if(freeByHe){
      var lockZhi=(lockA?zz[0]:'')+(lockB?zz[1]:'');
      var why=(lockA||lockB)?('「'+lockZhi+'」所坐之干被合，干合则支不动——「贪合忘冲」')
             :(heA&&heB)?('冲之两支各另成六合（'+zz[0]+'、'+zz[1]+'），其气各有所属，冲力两分而不纯')
             :('「'+(heA?zz[0]:zz[1])+'」另成六合，其气有所属，冲力减而不纯');
      chongFree.push({name:c.name,items:c.items,zhi:zz,why:why});
      return null;
    }
    return c;
  }).filter(Boolean);
  // 同组重复者只留其一（半刑按「刑名 + 所在柱对」去重，避免三支交错时同一半刑反复出现；
  // 其余各对亦按「关系类 + 名 + 柱对」去重，令同一组干支多柱并见时只报一次）
  ['xing','ziXing','hai','liuHe','chong','ganHe','ganChong','banHe','he','hui'].forEach(function(k){
    var seen={};
    out[k]=(out[k]||[]).filter(function(it){
      var key=it.dedupKey||(k+'|'+it.name+'|'+(it.items||[]).slice().sort().join('-'));
      if(seen[key])return false;seen[key]=1;return true;
    });
  });
  // 被合所解之冲：单列一栏，供页面另注（不计入正冲之数）
  // 【订】旧只按关系名（name）去重：同一冲名而宫位不同者（如大运午冲年子、大运午冲月子）
  //   只留其一，与他处「按柱对去重、加于何宫即应何事」（《三命通会·论宫分》）之口径相悖。
  //   今改按「名 + 柱对」去重。
  out.chongFree=(chongFree||[]).filter(function(it,i,a){
    var key=it.name+'|'+(it.items||[]).slice().sort().join('-');
    return a.findIndex(function(x){return (x.name+'|'+(x.items||[]).slice().sort().join('-'))===key;})===i;
  });
  // —— 伏吟 / 反吟 ——
  // 立说：《三命通会·论伏吟反吟》所谓「伏吟者，干支相同也；反吟者，干支相冲也」；
  //   《渊海子平》谓「岁运伏吟，哭泣淋淋」——运与柱同其干支，如人自照镜，气无所出，
  //   故主呻吟郁滞；反吟则干支皆冲，如两军对垒，主翻覆动荡。
  // 古法只「岁运」与「四柱」相值方论，本命四柱自相同者（如两柱干支全同）另作「柱同」，
  //   其象较轻，同列而不混。
  // 判例：
  //   伏吟——岁运某柱之干支，与命局某柱之干支全同（干同、支亦同）。
  //   反吟——岁运某柱之干与命局某柱之干「相冲」、支亦相冲（如甲子见庚午）。
  //          天干四冲依《三命通会》：甲庚、乙辛、丙壬、丁癸——惟此四对为「冲」；
  //          其余克而不冲者（如丙见庚、戊见甲），只作「天克地冲」，不得以反吟论。
  //   天克地冲——干相克（不必冲）而支相冲，其力次于反吟。
  //          古法「天克地冲」原不论施受：如丙子见庚午，丙火克庚金而子午相冲；
  //          庚午见丙子亦然——两柱对看，克者仍是丙庚，冲者仍是子午，其象一也。
  //          故判定双向：a 克 b、或 b 克 a，居其一即是。若只计一向，则同一对干支
  //          因「何者为岁运、何者为本命」之不同而或论或不论，于理不通。
  //   干支半冲——只冲其一（干冲而支不冲，或支冲而干不冲），另注而不混。
  var POS_LIST=['年柱','月柱','日柱','时柱'];
  var YUN_SET={'大运':1,'流年':1,'流月':1};
  // 天干相克（不论阴阳）：甲乙木、丙丁火、戊己土、庚辛金、壬癸水
  var GAN_WX_OF={'甲':'木','乙':'木','丙':'火','丁':'火','戊':'土','己':'土','庚':'金','辛':'金','壬':'水','癸':'水'};
  // 「克我者」表：KE_ME[key] = 能克 key 之五行（金克木，故 KE_ME['木']='金'）。
  //   切忌误用「我克者」表（那表里 '金'→'木' 意为金克木，方向相反，用以判「甲克乙」必错）。
  var KE_ME_OF={'木':'金','火':'水','土':'木','金':'火','水':'土'};
  out.fuYin=[];out.fanYin=[];out.keChongZhi=[];
  // 岁运为「来者」、四柱为「受者」：不以数组先后为凭（arr 顺序随分段而变），
  //   只按 pos 之名判定，免因排序不同而漏判。
  arr.forEach(function(a){
    if(!YUN_SET[a.pos])return;
    arr.forEach(function(b){
      if(POS_LIST.indexOf(b.pos)<0)return;       // 只与四柱相值
      if(a.gan===b.gan&&a.zhi===b.zhi){
        out.fuYin.push({name:'伏吟',items:[a.pos,b.pos],gz:a.gan+a.zhi,
          desc:'岁运干支与'+b.pos+'全同，谓之伏吟——《三命通会》「伏吟者，干支相同也」，主呻吟郁滞、旧事重来；'+
               '所值之宫（'+b.pos+'）之事反复难了，宜守不宜动，忌再求扩张'});
      }
      var gcOk=(GAN_CHONG[a.gan]===b.gan);                    // 天干「冲」（甲庚、乙辛、丙壬、丁癸）
      // 天干相克（不论阴阳，亦不论施受）：如甲木见戊己土、丙火见庚辛金。
      //   与「冲」并存而不相代：丙庚同为火金，火克金故丙克庚（庚见丙亦作克论，见上「双向」）；
      //   而甲庚、乙辛、丙壬、丁癸属「冲」，非「克」，二者分列。
      //   判法：受者之「克我者」恰为施者之五行，则施者克受者。两向皆试，居其一即是。
      var keOk=((KE_ME_OF[GAN_WX_OF[b.gan]]===GAN_WX_OF[a.gan])||
                (KE_ME_OF[GAN_WX_OF[a.gan]]===GAN_WX_OF[b.gan]));
      var zcOk=(ZHI_CHONG[a.zhi]===b.zhi);                     // 地支六冲
      if(gcOk&&zcOk){
        out.fanYin.push({name:'反吟',items:[a.pos,b.pos],gz:a.gan+a.zhi+'⇄'+b.gan+b.zhi,
          desc:'岁运干支与'+b.pos+'干支俱冲（天干相冲、地支亦冲），谓之反吟——《三命通会》「反吟者，干支相冲也」，主翻覆动荡、事与愿违；'+
               '所值之宫之事必有一大变，宜先事绸缪、勿执旧局'});
      }else if(keOk&&zcOk){
        out.fanYin.push({name:'天克地冲',items:[a.pos,b.pos],gz:a.gan+a.zhi+'⇄'+b.gan+b.zhi,
          desc:'岁运干支与'+b.pos+'之干相克、支又相冲——谓之天克地冲。其力次于反吟（反吟为干冲支冲，此则干克而支冲），'+
               '然亦主该宫之事受制而生变，宜察喜忌：所克者为忌神则应吉，为喜用则应凶'});
      }else if(gcOk||keOk||zcOk){
        var nm=(gcOk?'天冲':'')+(keOk&&!gcOk?'干克':'')+(zcOk?'地冲':'')+(!zcOk?'（支不冲）':'');
        if(!gcOk&&!keOk&&zcOk)nm='地冲（支冲干不冲）';
        out.keChongZhi.push({name:nm,items:[a.pos,b.pos],gz:a.gan+a.zhi+'⇄'+b.gan+b.zhi,
          desc:'干支只动其一，未成反吟、未成天克地冲——其力又减，然亦主该宫之事有动，须合喜忌看'});
      }
    });
  });
  // 本命四柱之间干支全同者（如年、月两柱相同）：其象轻，别作「柱同」
  out.zhuTong=[];
  for(var i6=0;i6<arr.length;i6++){
    for(var j6=i6+1;j6<arr.length;j6++){
      var A=arr[i6],B=arr[j6];
      if(POS_LIST.indexOf(A.pos)<0||POS_LIST.indexOf(B.pos)<0)continue;
      if(A.gan===B.gan&&A.zhi===B.zhi)
        out.zhuTong.push({name:'柱同（干支全同）',items:[A.pos,B.pos],gz:A.gan+A.zhi,
          desc:'本命二柱干支全同，其气重叠——所主之事加倍，喜则加喜、忧则加忧，非岁运伏吟之比'});
    }
  }
  return out;
}

//   之码」直接为其位，而子时不进位、寅位之码为零，故所得恒偏。且外库之身宫与命宫
//   同出一式（皆取和之正数），与古法「命宫十四减、身宫取和」一逆一顺之旨亦不侔。
//   今依《三命通会》论命宫之法、《渊海子平》诸篇另行推算（「论命宫身宫」为旧所题，篇名待核）：
//     命宫——月数（正月建寅为一，至十二月建丑为十二）加时数（子一、丑二……亥十二），
//           和不过十四者以十四减之，过十四者以二十六减之，所得自寅顺数，即命宫地支；
//     身宫——月数加时数，过十二者减十二，自寅顺数，即身宫地支。
//           身宫与命宫一顺一逆：命宫取「十四减和」之反数而主内，身宫取「和」之正数而主外，
//           故所主不同。（古书云「身宫者，从命宫起，顺数至本生时」，即此顺数之序。）
//   宫干：以年干起五虎遁，依宫支取干（甲己之年丙作首……）。
var MZ_ORDER=['寅','卯','辰','巳','午','未','申','酉','戌','亥','子','丑'];
var ZHI_NO={'子':1,'丑':2,'寅':3,'卯':4,'辰':5,'巳':6,'午':7,'未':8,'申':9,'酉':10,'戌':11,'亥':12};
// 五虎遁：年干 → 寅月之干
var WUHU={'甲':'丙','己':'丙','乙':'戊','庚':'戊','丙':'庚','辛':'庚','丁':'壬','壬':'壬','戊':'甲','癸':'甲'};
function gongGan(yearGan, zhi){
  var start=WUHU[yearGan];
  if(!start)return '';
  var si=GAN_ORDER.indexOf(start), zi=MZ_ORDER.indexOf(zhi);
  if(si<0||zi<0)return '';
  return GAN_ORDER[(si+zi)%10];
}
// 命宫：月数+时数 → 十四（或二十六）减之 → 自寅顺数
function mingGongZhi(monthZhi, timeZhi){
  var m=MZ_ORDER.indexOf(monthZhi)+1, t=ZHI_NO[timeZhi];
  if(m<1||!t)return '';
  var n=m+t;
  var k=(n<=14?14-n:26-n);
  if(k<=0)k+=12;
  return MZ_ORDER[(k-1)%12];
}
// 身宫：月数+时数 → 过十二减十二 → 自寅顺数
function shenGongZhi(monthZhi, timeZhi){
  var m=MZ_ORDER.indexOf(monthZhi)+1, t=ZHI_NO[timeZhi];
  if(m<1||!t)return '';
  var n=m+t;
  if(n>12)n-=12;
  return MZ_ORDER[(n-1)%12];
}
function mingGongTrad(pillars){
  if(!pillars||!pillars[1]||!pillars[3])return '—';
  var z=mingGongZhi(pillars[1].zhi,pillars[3].zhi);
  return z?(gongGan(pillars[0].gan,z)+z):'—';
}
function shenGongTrad(pillars){
  if(!pillars||!pillars[1]||!pillars[3])return '—';
  var z=shenGongZhi(pillars[1].zhi,pillars[3].zhi);
  return z?(gongGan(pillars[0].gan,z)+z):'—';
}

  // 兼容：半刑（三刑未全）之 items 可能存的是「地支字」而非柱名，先用当前柱名反查其位置
  function toPos(x){
    if(POS_RANK[x]!==undefined)return x;
    var hit=PILLAR_OF_ZHI[x];
    return hit||null;
  }
  var ps=items.map(toPos).filter(function(x){return !!x;});
  if(ps.length<items.length)return null;   // 有无法定位之项，宁缺不误配
  var hosts=ps.filter(function(p){return POS_RANK[p]>=0;});
  var guests=ps.filter(function(p){return POS_RANK[p]<0;});
  hosts=hosts.slice().sort(function(a,b){return POS_RANK[a]-POS_RANK[b];});
  if(hosts.length>=2){
    if(hosts.length===2)return GONG_SHORT[hosts[0]]+GONG_SHORT[hosts[1]];
    var a=hosts[0],b=hosts[hosts.length-1];
    return GONG_SHORT[a]+GONG_SHORT[b];

  if(guests.length===1&&hosts.length===1)return GONG_SHORT[hosts[0]]+'运';
  return null;
}

// ===== 刑冲合害会 渲染 =====
// 依《三命通会》论刑冲合害诸篇《渊海子平》论刑冲合害诸篇《子平真诠·论刑冲会合解法》立说：
//   合者，和也，主牵绊、成事、聚；冲者，动也，主迁变、破、争斗；
//   刑者，伤也，主刑克、是非、疾患；害者，损也，主暗耗、离心；
//   会者，方也，三支同方，气专而势厚。
// 吉凶不预断——合而化我所喜则吉、合而化我所忌则凶，须合喜忌看。
// 位置配对白名单：决定「哪两种位置之间的关系才呈现」
// 《子平真诠》所谓「刑冲会合，全在四柱干支之间」——原局为体，岁运为用，
// 故岁运只与「其上位岁运 + 四柱」论，不与同阶或下阶自相论（大运不与流年论、流年不与流月论）。
var PAIR_OK=(function(){
  function norm(a,b){
    var A=[a,b].map(function(x){
      if(x==='年柱')return '年';if(x==='月柱')return '月';
      if(x==='日柱')return '日';if(x==='时柱')return '时';
      if(x==='大运')return '运';if(x==='流年')return '岁';if(x==='流月')return '月令';
      return x;
    });
    var ord={'年':0,'月':1,'日':2,'时':3,'运':4,'岁':5,'月令':6};
    return (ord[A[0]]<=ord[A[1]])?[A[0],A[1]]:[A[1],A[0]];
  }
  // 【订·此处为「大运与原局恒显（无）」之根因】
  //   原法：mk() 以 norm()（按 年→月→日→时→运→岁→月令 排序）拼键，而白名单却写成
  //     「运-年」「运-月」「运-日」「运-时」——「运」之序为 4、在「年」0 之后，
  //     norm('大运','年柱') 所得为「年-运」，与白名单之「运-年」永不相等。
  //   故 PAIR_OK.dy() 于任何一对皆返回 false，「大运与原局」一节拾取为空，
  //     恒书「（无）」——而 relations() 实已算出半合、六合、相冲、相刑、六害诸象。
  //   同理「年-岁」「运-岁」「年-月令」等键亦皆倒置，流年、流月二节亦有阙漏。
  //   今改正：白名单改为「无向集合」——每一对无论先后皆先拆为二名、再以「|」连接之
  //     规范化键比对；且集合内任一对命中即可，不依赖书写次第。
  function mk(pairs){
    var o={};
    pairs.forEach(function(p){
      var x=p[0],y=p[1];
      o[x+'|'+y]=1; o[y+'|'+x]=1;     // 双向皆收，免倒置之误
    });
    return function(a,b){
      var A=[a,b].map(function(x){
        if(x==='年柱')return '年';if(x==='月柱')return '月';
        if(x==='日柱')return '日';if(x==='时柱')return '时';
        if(x==='大运')return '运';if(x==='流年')return '岁';if(x==='流月')return '月令';
        return x;
      });
      return !!(o[A[0]+'|'+A[1]]||o[A[1]+'|'+A[0]]);
    };
  }
  var MING=mk([['年','月'],['年','日'],['年','时'],['月','日'],['月','时'],['日','时']]);
  return {
    // ① 原局：四柱两两（年月/年日/年时/月日/月时/日时）
    ming:MING,
    // ② 大运 × 四柱（不含大运自相）
    dy:mk([['运','年'],['运','月'],['运','日'],['运','时']]),
    // ③ 流年 × 大运、四柱（不含流年自相、不含流年与流月）
    ly:mk([['运','岁'],['年','岁'],['月','岁'],['日','岁'],['时','岁']]),
    // ④ 流月 × 大运、流年、四柱（不含流月自相）
    fm:mk([['运','月令'],['岁','月令'],['年','月令'],['月','月令'],['日','月令'],['时','月令']])
  };
})();
// 按白名单过滤 relations() 的十类结果
function pickPairs(R,ok){
  var out={};
  Object.keys(R).forEach(function(k){
    out[k]=(R[k]||[]).filter(function(it){
      var its=(it.items||[]);
      if(its.length<2)return false;
      for(var i=0;i<its.length;i++){
        for(var j=i+1;j<its.length;j++){
          if(ok(its[i],its[j]))return true;
        }
      }
      return false;
    });
  });
  return out;
}

        // 【补】合解之冲亦当有宫位之应：《三命通会·论宫分》「凡岁运之十神，加于何宫，即应何事」——
        //   冲既有所在之宫，则其宫所主之人事仍受牵动，惟其力减于无合之冲（谓之「缓冲」「伏冲」）。
        //   原只书「冲力减而不纯」一句通论，读者无从知其所应落在何人何事，今补宫位配对、三宫之判与化解方向。
        var cfItems=cf.items||[];
        var cfHosts=cfItems.filter(function(x){return POS_RANK[x]>=0;});
        var cfGp=pairGongKey(cfItems);
        var cfGal=(GONG_PAIR_YI.chong&&cfGp)?(GONG_PAIR_YI.chong[cfGp]||null):null;
        var cfSk=gongSpanKey(cfHosts);
        var cfSpan=(GONG_SPAN.chong&&cfSk)?(GONG_SPAN.chong[cfSk]||''):'';
        // 宫位配对之象：冲力虽减，其应仍在，惟须标明「缓」字，免与无合之冲同观
        if(cfGp&&cfGal&&cfGal.length){
          h+='<div class="rel-gong"><span class="rel-gl">'+gongTitle(cfGp,'chong',tier)+
             '<span style="font-weight:400;color:#8a6a3a">（合解之冲，其应缓于无合者）</span></span><ul class="rel-ul">'+
             cfGal.map(function(s){return '<li>'+s.replace(/[；。]\s*$/,'')+'</li>';}).join('')+'</ul></div>';
        }
        if(cfSpan){
          h+='<div class="rel-gong"><span class="rel-gl">'+cfHosts.map(function(x){return GONG_SHORT[x];}).join('·')+'（'+
             (cfSk==='三代'?'三宫以上':'首尾两端')+'俱动而各有所属）</span><div style="margin:2px 0 0 6px">'+cfSpan+
             '（然此局有合以系之，其动不至于失所，惟宜早为之备。）</div></div>';
        }
        // 化解方向：无合之冲「宜动、宜迁」；有合之冲则「宜守其合、勿破其系」为第一义，
        // 古法「制化」之用在冲则以合解、在已解之冲则以「勿再冲其合」为守。
        var cfHua=[];
        cfHosts.forEach(function(hh){
          if(GONG_HUA[hh])cfHua.push(GONG_SHORT[hh]+'（'+GONG_ZHU[hh].split('（')[0]+'）：'+GONG_HUA[hh]);
        });
        if(cfHua.length){
          h+='<div class="rel-gong" style="border-left:3px solid #9cc09c;padding-left:6px">'+
             '<span class="rel-gl" style="color:#3a6b3a">化解方向</span>'+
             '<div style="margin:2px 0 0 6px;color:#3a5a3a">'+
             '<b>首义在「守其合、勿破其系」</b>——此冲已得合解，其气有所归，故不宜再主动求变（无合之冲宜动，有合之冲宜守，此其别也）；凡岁运再逢冲其中一支、或合神被他支争夺之年，则伏冲复发，此期即宜谨守。'+
             '次则就其宫所主而预为之备：'+cfHua.join('；')+'。'+
             '<span style="color:#6a7a8a">（依《三命通会》论刑冲合害诸篇「合则绊、冲则动」，合既绊之，则动者伏；《子平真诠·论用神》「合而化者，以其所化之神为用」，故守其所化则安、破其所合则动。）</span></div></div>';
        }
        h+='</div>';
      });
      h+='</div></div>';
    }
    s1('相刑',Rx.xing.concat(Rx.ziXing),'xing','xing');
    s1('六害（穿）',Rx.hai,'hai','hai');
    s1('天干合冲',Rx.ganHe.concat(Rx.ganChong),'gan','ganHe');
    // —— 伏吟 / 反吟（《三命通会·论伏吟反吟》）——
    // 岁运与四柱干支全同者为伏吟，干支俱冲者为反吟；只冲其一者列为「干支半冲」，另注而不混。
    (function(){
      var fy=(Rx.fuYin||[]),fan=(Rx.fanYin||[]),half=(Rx.keChongZhi||[]),zt=(Rx.zhuTong||[]);
      if(!fy.length&&!fan.length&&!half.length&&!zt.length)return;
      had=true;any=true;NO.n++;
      h+='<div class="gs-sec"><div class="gs-sec-t">'+NUM_CN[NO.n]+'、伏吟 / 反吟</div><div class="gs-body">';
      function row(it,color){
        h+='<div class="gs-line" style="margin:6px 0 8px">'+
           '<span class="rel-tag rel-'+color+'">'+it.name+'</span>'+
           '<span class="rel-where">'+(it.items||[]).join('·')+'</span>'+
           (it.gz?'<span style="margin-left:6px;color:#6a5a4a;font-size:13px">'+it.gz+'</span>':'')+
           '<div class="rel-d">'+it.desc+'</div></div>';
      }
      fy.forEach(function(it){row(it,'chong');});
      fan.forEach(function(it){row(it,'chong');});
      half.forEach(function(it){row(it,'hui');});
      zt.forEach(function(it){row(it,'hui');});
      h+='<div class="note" style="margin-top:4px">伏吟反吟依《三命通会·论伏吟反吟》所谓「伏吟者，干支相同也；反吟者，干支相冲也」、《渊海子平》「岁运伏吟，哭泣淋淋」立说。古法以<b>岁运与四柱相值</b>者为重，本命二柱自同者（「柱同」）其象较轻，同列而不混。伏吟主郁滞、旧事重来，宜守不宜动；反吟主翻覆、事与愿违，宜先事绸缪。二者吉凶仍须合喜忌——所值之宫为喜用则「伏而得益、反而得变」，为忌神则「伏而积忧、反而生祸」，不可一见伏反便断为凶。</div>';
      h+='</div></div>';
    })();
    if(!had){
      // 无者亦留一句，然不再占一节序号——此段本无象，序号应留给有象之节，
      //   免得「三、（无）」之后径接「五、」之跳号。
      h+='<div style="font-size:14px;color:#888;padding:4px 2px">'+
         (mark==='原局'
            ?'四柱自相之间未见刑冲合害会，格局清纯，吉凶多系于岁运之引动。'
            :'本步岁运与四柱之间未见刑冲合害会，此运此年气势平和、无甚牵动。')+
         '</div>';
    }
    h+='</div></details>';
    // 段终汇入外层计数：本段几节（NO.n），外层 sectNo 累加之，
    //   末节「轻重与宜忌」遂承四段之数而续编，不致回退、亦不重号。
    sectNo+=NO.n;
  }
  // 四段各成一可收放之板块：原局（命之定数）、大运与原局（十年之势）、
  //   流年与大运原局（一年之权）、流月与三者（一月之应）。
  // 《滴天髓》「休囚系乎运，尤系乎岁」——运与岁轻重有别，故分卷列之，非徒为便览。
  sectGroup('',R0,'原局','原局',
    '四柱自相之刑冲合害会，乃<b>命之定数</b>，终身不变——其所主之事为「本来如此」，非岁时所添。《子平真诠》所谓「刑冲会合，全在四柱干支之间，各有轻重」即指此。');
  sectGroup('',R1,'大运与原局','大运',
    '只论<b>大运</b>与年、月、日、时四柱相值，不及流年流月（岁运之间不自相论，免以虚引虚）。大运主十年之势，《渊海子平》「十年一换」——此段所书，为十年中之常象。');
  sectGroup('',R2ly,'流年与大运·原局','流年',
    '只论<b>流年</b>与大运及四柱相值。《滴天髓》「休囚系乎运，尤系乎岁」——运定其体、岁发其用，故此段之象较「大运与原局」为显、为急。');
  sectGroup('',R2fm,'流月与大运·流年·原局','流月',
    '只论<b>流月</b>与大运、流年及四柱相值。月建司一月之令，其象最细、应期最速——大事看岁、小事看月，此《三命通会》「月令为提纲」之意。');

  if(!any){
    h+='<div class="note">本局四柱与所看岁运之间，未见三会、三合、六合、相冲、相刑、六害及天干合冲，气势平和、无甚牵动。</div>';
  }else{
    // 综述：依喜忌判轻重
    // 【订·此处为一处硬伤】原法用 R（=relations(七位全集)，未经白名单筛）作统计，
    //   而四段面板所显者乃 R0/R1/R2ly/R2fm（各经白名单筛）。二数不同源：
    //   ① R 中含「岁运自相」之象（流年×流月、大运×流年之类），古法不与论——
    //      《子平真诠》所谓「刑冲会合，全在四柱干支之间」，岁运之间无宫可应，论之则虚；
    //      上文本已明言「岁运之间不论冲合，以免以虚引虚」，而末节反据之统计，自相抵牾。
    //   ② 四段之间又有重叠（大运×四柱、流年×四柱、流月×四柱各计一次），
    //      合并须去其重，方成一局之总数。
    //   今改：以四段之并（去重）为统计之本，与面板所显一一相符。
    var Rall=(function(){
      var o={},keys=['hui','he','banHe','liuHe','chong','xing','ziXing','hai','ganHe','ganChong','chongFree'];
      keys.forEach(function(k){o[k]=[];});
      var seen={};
      [R0,R1,R2ly,R2fm].forEach(function(rx){
        keys.forEach(function(k){
          (rx[k]||[]).forEach(function(it){
            var sig=k+'|'+it.name+'|'+((it.items||[]).join('>')); // 同象同宫者只计一次
            if(seen[sig])return;seen[sig]=1;
            o[k].push(it);
          });
        });
      });
      return o;
    })();
    sectNo++;
    h+='<div class="gs-sec"><div class="gs-sec-t">'+(NUM_CN[sectNo]||sectNo)+'、轻重与宜忌</div><div class="gs-body">';
    var parts=[];
    // 【补·口径】四段面板各依其段列象，同一字对若大运与流年皆值之，则二段各书一次
    //   （此「来者」不同、宫应亦不同，不可合并）；而本节目在「一局之总断」，
    //   故四段之象合而观之、去其重复，所得者为一局实有之数。
    //   二数口径既别，须先声明，免读者疑其相悖。
    //   注：此句先 push 则 parts 恒非空，故末尾「无象」之兜底不可再以 parts.length 为凭，
    //   另以 bodyN 计「实质断语」之条数。
    var bodyN=0;
    parts.push('<span style="color:#6a7a8a">（上四段各依其段列象，同一字对各段分书；此节合而观之、去其重，故数目少于四段之总和——所计者乃本局实有之数，非列象之条数。）</span>');
    var yongWx=ys&&ys.yong?ys.yong.map(function(c){return classToWx(dayGan,c);}):[];
    var jiWx=ys&&ys.ji?ys.ji.map(function(c){return classToWx(dayGan,c);}):[];
    var R=Rall;
    // 三合/三会 化神为喜为忌
    R.he.concat(R.hui).forEach(function(g){
      var wx=g.wx;
      var isY=yongWx.indexOf(wx)>=0, isJ=jiWx.indexOf(wx)>=0;
      bodyN++;
      parts.push(g.name+'，化'+wx+'——'+(isY?'此为我喜用之神，合局成则喜用有力，主事有所成':isJ?'此为我忌神，合局成则忌神结党，须防因合致祸':'于我用忌之间，须合原局通盘看')+'。');
    });
    // 冲
    if(R.chong.length){
      var chongDay=R.chong.some(function(c){return c.items.indexOf('日柱')>=0;});
      bodyN++;
      parts.push('冲有 '+R.chong.length+' 处'+(chongDay?'，且有一处及于日柱——日为我身与配偶之宫，冲动则主自身或家室之变':'' )+'。《渊海子平》谓「冲则动，动则变」，本命自冲为根基之动，岁运来冲为应事之动。');
    }
    if(R.chongFree&&R.chongFree.length){
      var cfN=R.chongFree.map(function(c){return c.name;}).join('、');
      bodyN++;
      parts.push('另有 '+R.chongFree.length+' 处冲被合所牵（'+cfN+'）——合能解冲，其力不纯，故不计入正冲之数；然伏而未发，遇岁运再行冲动、或合神被破，仍当应事。');
    }
    // 刑
    if(R.xing.length){
      var full=R.xing.some(function(x){return x.full;});
      var halfN=R.xing.filter(function(x){return !x.full;}).length;
      bodyN++;
      parts.push('刑有 '+R.xing.length+' 处'+
        (full?'，且三刑俱全（三支或分处命局与岁运而凑齐），刑力最重':'')+
        (halfN?'，其中 '+halfN+' 处三刑未全、只论二支相刑，力减，须岁运补足第三支方应其全':'')+
        '。《三命通会》谓三刑主「刑伤、是非、骨肉不和」，宜守分、慎争。');
    }
    if(R.hai.length){bodyN++;parts.push('害有 '+R.hai.length+' 处，害主暗损，多在无形处耗，宜防小人、注意六亲之情。');}
    // 【订】原条件为「有六合且无三合」方出此句——三合与六合义别（三合成局、六合只合），
    //   岂可以三合之有而没六合之象？故去其「!R.he.length」之限，但书其名与数。
    if(R.liuHe.length){
      bodyN++;
      parts.push('六合有 '+R.liuHe.length+' 处（'+R.liuHe.map(function(x){return x.name;}).filter(function(v,i,a){return a.indexOf(v)===i;}).join('、')+'），六合主和合牵绊，事多顺而少争，然合亦有「羁而不进」之弊，不可一味贪合。');
    }
    if(R.banHe.length){bodyN++;parts.push('半合有 '+R.banHe.length+' 处——半合之势将成而未竟，最易为岁运所补、亦最易为他支所夺，宜守其已成之一端而待其补足。');}
    if(R.ganHe.length||R.ganChong.length){
      bodyN++;
      var gc=[];
      if(R.ganHe.length)gc.push('天干五合 '+R.ganHe.length+' 处（主亲和羁绊，合而化者须月令有化神当令）');
      if(R.ganChong.length)gc.push('天干相冲 '+R.ganChong.length+' 处（主显性冲突，较地支为轻）');
      parts.push(gc.join('；')+'。');
    }
    if(R.ziXing.length){bodyN++;parts.push('自刑有 '+R.ziXing.length+' 处，自刑主自招、内耗、反复，多由己心之执而起，宜自省、勿自缠。');}
    if(R.he.length||R.hui.length){
      bodyN++;
      parts.push('成局之数：三合 '+R.he.length+' 局、三会 '+R.hui.length+' 局——《子平真诠·论用神》所谓「三合成局，则以其所化之神为用」，成局者其力最大，可夺单支之用，须先辨其化神为喜为忌（已见上）。');
    }
    if(!bodyN)parts.push('所现者以合为主，气势和顺，宜守宜进。');
    h+=parts.join('<br>');
    h+='</div></div>';
  }

  h+='<div class="note">本节依《三命通会》论刑冲合害诸篇《渊海子平》论刑冲合害诸篇《子平真诠·论刑冲会合解法》立说：<b>合</b>主牵绊聚合、<b>冲</b>主迁变争斗、<b>刑</b>主刑伤是非、<b>害</b>主暗损离心、<b>会</b>主方气专旺。三合三会须三支齐全方成局，半合以生旺为有力、拱合为力弱；六合须两支相并，天干五合合化须月令有化神当令，否则合而不化。《子平真诠》谓「刑冲会合，全在四柱干支之间，各有轻重」，故此处只列象义、不断吉凶——同一冲合，合我所喜则吉、合我所忌则凶，须与上方喜用忌神参看。</div>';
  h+=cardFoldFoot();
  return h;
}


// ===== 岁运算程（刑冲合害会之后）=====
// 依《滴天髓》「休囚系乎运，尤系乎岁」、《子平真诠·论行运》「与用神有情有救助者皆吉，
// 反伤用神者皆凶」、《穷通宝鉴》调候之要、《渊海子平·论太岁》立说：
//   大运管十年之势、流年司一年之权、流月应一月之事；以喜忌断其向背，以十神断其事类。
function buildSuiYun(h, dayGan, pillars, ys, dyGZ, lyGZ, fmGZ, st, gj, shaMap, gender){
  if(!dyGZ&&!lyGZ&&!fmGZ)return h;
  // 岁运神煞：由 shenShas() 对「大运/流年/流月 + 四柱」统一判定，此处只取岁运三列
  var yongWx=ys&&ys.yong?ys.yong.map(function(c){return classToWx(dayGan,c);}):[];
  var jiWx=ys&&ys.ji?ys.ji.map(function(c){return classToWx(dayGan,c);}):[];
  function judge(wx,cls){
    var isY=yongWx.indexOf(wx)>=0, isJ=jiWx.indexOf(wx)>=0;
    if(isY&&!isJ)return {t:'喜',c:'喜用',css:'color:#3a6b3a;font-weight:700'};
    if(isJ&&!isY)return {t:'忌',c:'忌神',css:'color:#8b3a3a;font-weight:700'};
    if(!isY&&!isJ)return {t:'平',c:'闲神',css:'color:#666'};
    return {t:'混',c:'喜忌交并',css:'color:#7a5a2a;font-weight:700'};
  }
  // ===== 学业／姻缘之应期 =====
  // 由「本柱干支之十神」判其是否触动该事，再合日支之合冲、配偶星之旺衰、神煞之桃花
  // 学业：以印、食伤、官杀在运为利；以财坏印、枭夺食为碍
  function studyOf(g,z,ageStart,ageEnd,stx,selfName){
    // 流月不与学业合断：学业之成以年计、不以月计（详见下方姻缘同理）
    if(selfName==='流月')return '';
    // 学业之应期主要在少年（约 6—24 岁）；超出此段不强论
    var inAge=(ageEnd>=6&&ageStart<=24);
    if(!inAge)return '';
    // 【订·断期之辞须分「十年」与「一年」】大运一柱管十年，若十年尽落于就学之期，
    //   可曰「此运利学业」；若仅一端相涉（如七至十七岁之运，七至二十四岁之限），
    //   则只能说「此运前半（或某几年）当学」。今记其交叠之年，措辞随之而别。
    var ovS=Math.max(ageStart,6), ovE=Math.min(ageEnd,24);
    var cg1=wxToClass(dayGan,GAN_WX[g]);
    var cz1=wxToClass(dayGan,WX_ZHI[z]);
    var cand=[];
    [cg1,cz1].forEach(function(c){ if(c&&STUDY_YI[c])cand.push(c); });
    if(!cand.length)return '';
    // 取「最相关」者：利 > 半 > 平 > 碍
    var rank={'利':3,'半':2,'平':1,'碍':0};
    cand.sort(function(a,b){return rank[STUDY_YI[b].t]-rank[STUDY_YI[a].t];});
    var main=cand[0], rec=STUDY_YI[main];
    // 【订】干与支所主不同（干主外、主前半；支主内、主后半），若二者一利一碍，
    //   须并陈而分属之，不可只取其「最利」者而没其「碍」——否则同柱财印交见，
    //   读者只见「利学业」而不知「财坏印」之弊在焉。
    var other=(cand.length>1&&rank[STUDY_YI[cand[1]].t]<rank[rec.t])?cand[1]:null;
    var head=rec.t==='利'?'<span style="color:#2b6b2b;font-weight:600">利学业</span>'
            :rec.t==='半'?'<span style="color:#8a5a12;font-weight:600">半利（有压力）</span>'
            :rec.t==='碍'?'<span style="color:#8b3a3a;font-weight:600">碍学业</span>'
            :'<span style="color:#666">平</span>';

      //   三十岁之后」而流年只一年，语不相伦；且「已届三十岁之后」之「之后」与
      //   「已届三十岁」重复。今按层级与岁数分书。
      var aTxt=(selfName==='大运')?('此运自'+ageStart+'岁起至'+ageEnd+'岁，')
              :(selfName==='流年')?('此年正值 '+ageStart+' 岁，'):'';
      ageTxt='（'+aTxt+'已过而立而未逾婚龄之限（四十），婚事宜定不宜再缓，遇配偶星得力之期即当决之。）';
    }
    // 断语：以「合冲宫位者为动、配偶星得地者为成」二义分主次
    var main2='';
    if(lateYun){
      // 过四十者不立「婚动」之断，只就宫星之实象言之
      if(yuanYang)main2='日柱干支双合而无冲，主夫妻情分再亲、家宅重定；亦有子女之婚嫁、孙辈之添应之，非己身之婚期。';
      else if(dayChong)main2='配偶宫逢冲而星未得力，主室家之变——或配偶之身有疾、或聚少离多、或丧偶之虞；须以宫中喜忌参之：宫为喜而冲之，去病而安；宫为忌而冲之，其病乃显。';
      else if(dayHe)main2='配偶宫逢合而星未得力，主情有所系、家中人口有增；亦主迁居、置产之事落于家宅。';
      else if(isXingDay||dayHai)main2='配偶宫受刑害，主家中暗生嫌隙、事多迟滞；宜以礼相待、早言其意。';
      else if(starG||starZ)main2='配偶星现于柱中而宫未动，主此期有与配偶相关之人事（财用、亲眷、家计）显于外，非婚期之应。';
      else if(gu)main2='孤辰寡宿临而星宫未动，主此期独处之时多、亲缘往来疏，其应在远行、独居、少人共话之属。';
      else main2='桃花临而星宫未动，只主情缘之遇，主情不主婚，宜防浮泛。';
    }else if(yuanYang)main2='天干合日干、地支合日支，干支双合而无冲——婚动之最上格，主此期定亲、成婚、置业同居之事，应期最速。';
    else if(dayHe&&(starG||starZ))main2='配偶星得地而又合日支，星宫俱动——正缘现而成之，最宜议婚论嫁。';
    else if(dayChong&&(starG||starZ))main2='配偶星得地而日支逢冲，星动宫亦动——主因婚而动，或成或散，其权在人：已定者宜守，未定者宜进。';
    else if(dayHe||dayChong)main2='宫位动而配偶星未现，主感情有起落、异性缘生，然未必即成；须待配偶星得力之期方成。';
    else if(starG||starZ)main2='配偶星现而宫位未动，主有可婚之人而事未至，宜先交往、后议婚；宫动之年方为成婚之应。';
    else if(gu)main2='孤辰寡宿临而星宫未动，主情缘有隔、聚而常别，宜主动经营、多相聚首；非谓无婚，乃谓其缘须以人力相就。';
    else main2='桃花临而星宫未动，只主情缘之遇，主情不主婚，宜防浮泛。';
    // 【补四·原局配偶宫之向背】《渊海子平》「日为花，主自身配偶」，
    //   《三命通会·论妻妾》「日支为妻宫」——岁运所临只是「动」，其动之吉凶
    //   仍须以原局配偶宫之喜忌为体：宫为我喜用，则动而得益；宫为我忌神，
    //   则动而多扰。原只论合冲而不辨喜忌，故凡冲日支者一律作「聚散离合」，
    //   失「忌神之宫逢冲反解得用」之义，今补之。
    var dayCls=wxToClass(dayGan,WX_ZHI[dz]);
    var dayTone=(dayCls&&(ys&&ys.yong?ys.yong:[]).indexOf(dayCls)>=0)?'喜'
               :(dayCls&&(ys&&ys.ji?ys.ji:[]).indexOf(dayCls)>=0)?'忌':'平';
    var gongNote='';
    if(dayChong||dayHe||isXingDay||dayHai){
      var ac=(dayChong?'冲':dayHe?'合':'刑害');
      gongNote='<br><span style="color:#5a6a8a">［配偶宫之向背］</span>原局日支'+dz+'（'+(dayCls?GEN_NAME[dayCls]:'—')+
        '）于我为<b>'+dayTone+'</b>神——'+
        (dayTone==='喜'?'宫为我喜，今逢'+ac+'而动，动则得其用，主因婚而得助、因动而进；虽亦主变，然变而向吉。'
         :dayTone==='忌'?'宫为我忌，今逢'+ac+'而动，动则其病显——主感情多扰、家宅不宁；惟冲之亦有「去病」之义，若冲去此忌而局中有救，则反主解脱旧累、另开新局。'
         :'宫为闲神，其动无大吉凶，只主事有触动而已。');
      // 【订】过四十之运，上文所主已改为「配偶之身、家宅之变」，而此注仍书
      //   「因婚而得助」，前后两义不侔，故于四十以后另出年龄之解。
      if(lateYun)gongNote+='（此期已过婚龄，非初婚之应：宫动之所应，多在配偶之身、家计之变、子女亲眷之事——宫为我喜则其事虽变而向安，宫为我忌则其病随之而显，此其大略。）';
    }
    // 星象补充：只在其义不被首段（星之得地）与主判已尽时方出，免三处同语
    var tail='';
    if(rec&&!lateYun)tail=rec.t==='动'?rec.s
             :rec.t==='半'?rec.s
             :rec.t==='碍'?'<span style="color:#8b3a3a">此柱所主之十神于姻缘有碍——宜缓不宜急，须待配偶星再旺之期。</span>'
             :'';
    // 首段已言「X星得地」，若星象首句亦言得地，则去其首句，只留其后半
    if(tail&&(starG||starZ)){
      var i0=tail.indexOf('——');
      if(i0>0&&tail.slice(0,i0).indexOf('得地')>=0)tail=tail.slice(i0+2);
    }
    return '<b>姻缘</b>　'+items.join('；')+'。<br><span style="color:#5a6a8a">［婚动之判］</span>'+main2+
      (tail?'<br><span style="color:#5a6a8a">［星象］</span>'+tail:'')+gongNote+ageTxt;
  }
  // 事类：十神所主（《三命通会》论十神诸篇）
  function shiShenYi(ss){
    var M={
      '比肩':'朋辈、兄弟、同业之事，得助或分财，宜合伙亦防争利',
      '劫财':'破财、争利、克父克妻之象，得朋友而失财帛',
      '食神':'饮食、口福、才艺、生财之道，亦主子息，事多顺遂',
      '伤官':'才华外露、创新、名声，亦主口舌是非、与上司不和',
      '偏财':'意外之财、流动之财、父辈之事，亦主异性之缘',
      '正财':'正业之财、薪资田宅、妻室之事，得之安稳',
      '七杀':'压力、竞争、权柄、小人，制之则权、制不得则伤病官非',
      '正官':'官贵、职升、名誉、约束，亦主官司、丈夫之事',
      '偏印':'学习、玄学、继母长辈，亦主思虑过甚、孤立',

    };
    return M[ss]||'';
  }
  // —— 十神象义（《三命通会》论十神诸篇《渊海子平》十神取象诸篇）——
  var SS_YX={
    '印':'学业、文书、印信、母亲长辈、房产、贵人、名誉、医药',
    '财':'财帛、产业、薪资、男命之妻（妻妾）、理财经营',

  var SHENG_YI={

  var KE_YI={

    '印->食伤':'印克食伤——印制食伤：食伤若为局中用神，则才艺受抑、子息缘薄、思虑过甚（偏印尤甚，谓之「枭神夺食」；正印则只称「印绶夺食」，其力较缓）；若食伤本为忌神，则反是泄秀得制、去病为吉，不可概论为凶',
    '食伤->官杀':'食伤克官——伤官见官：官星若为用神，则主口舌是非、与上司不合、女命碍夫；若官星本为忌神（身弱杀重而赖食伤制之），则食伤制杀反为去病之吉，尤以七杀逢食制为贵（《子平真诠》「食神制杀」）',
    '官杀->比劫':'官克身——制比劫而掌权，压力与规矩并至，身弱者受制',
    '比劫->财':'比劫夺财——分财破耗、合伙生争，主财帛被分'
  };
  function ssRelTxt(a,b){
    if(!a||!b)return '';
    if(a===b)return '同为'+GEN_NAME[a]+'——同气并见，其力加倍';
    if(SS_SHENG[a]===b)return GEN_NAME[a]+'生'+GEN_NAME[b]+'：'+(SHENG_YI[a+'->'+b]||'');
    if(SS_SHENG[b]===a)return GEN_NAME[b]+'生'+GEN_NAME[a]+'：'+(SHENG_YI[b+'->'+a]||'');
    if(SS_KE[a]===b)return GEN_NAME[a]+'克'+GEN_NAME[b]+'：'+(KE_YI[a+'->'+b]||'');
    if(SS_KE[b]===a)return GEN_NAME[b]+'克'+GEN_NAME[a]+'：'+(KE_YI[b+'->'+a]||'');
    return '';
  }
  // 十神关系：判断方向为「他者对岁运之施加影响」——
  //   大运节：原局十神 对 大运 的影响
  //   流年节：大运、原局十神 对 流年 的影响
  //   流月节：大运、流年、原局十神 对 流月 的影响
  // 依《三命通会》「命为体、运为用」、《滴天髓》「休囚系乎运，尤系乎岁」——
  //   命局之十神为体，岁运之十神为用；体之十神施于用者，即其影响之来路。
  function relLines(gz,targets,dayGan,selfName){
    if(!gz||!targets||!targets.length)return '';
    var selfCls=wxToClass(dayGan,GAN_WX[gz[0]]);
    var out=[];
    targets.forEach(function(t){
      if(!t||!t.gz)return;
      var sc=wxToClass(dayGan,GAN_WX[t.gz[0]]);   // 他者（原局/大运/流年）之十神
      // 他者施于本运，故主客倒置：以 sc 为主、selfCls 为受
      var gr=ssRelTxt(sc,selfCls);
      var extra='';
      if(GAN_HE_PAIR[t.gz[0]]===gz[0])extra='天干五合（'+pairKey(gz[0],t.gz[0],GAN_ORDER)+'合）——'+(selfName||'本运')+'与之牵绊';
      else if(GAN_CHONG[t.gz[0]]===gz[0])extra='天干相冲——'+t.name+'之气来撼'+(selfName||'本运');
      else if(GAN_HE_PAIR[gz[0]]===t.gz[0])extra='天干五合（'+pairKey(gz[0],t.gz[0],GAN_ORDER)+'合）——'+(selfName||'本运')+'反合'+t.name;
      else if(GAN_CHONG[gz[0]]===t.gz[0])extra='天干相冲——'+(selfName||'本运')+'之气冲'+t.name;
      var zr='';
      // 依《三命通会》论刑冲合害诸篇序：冲则动、合则绊、刑则伤、害则暗损——四者并列，
      //   原只列冲、合、害而遗「刑」，凡岁运与四柱相刑者皆无所见，故补之。
      //   寅申、巳亥既冲且合，寅巳、巳申既刑且害，古法「刑冲会合，各有轻重」——
      //   故不以其一掩其余，各系其辞，取其重者先出。
      var pairZ=pairKey(gz[1],t.gz[1],ZHI_ORDER);
      var isXing=(pairZ==='寅巳'||pairZ==='巳申'||pairZ==='寅申'||pairZ==='丑戌'||pairZ==='丑未'||pairZ==='戌未'||pairZ==='子卯'||gz[1]===t.gz[1]);
      if(ZHI_CHONG[t.gz[1]]===gz[1])zr='地支相冲（'+t.gz[1]+gz[1]+'）——'+t.name+'来冲，主此期动摇迁变';
      else if(ZHI_HE_PAIR[t.gz[1]]===gz[1])zr='地支六合（'+pairKey(gz[1],t.gz[1],ZHI_ORDER)+'）——'+t.name+'来合，主和合牵绊';
      else if(ZHI_HAI[t.gz[1]]===gz[1])zr='地支相害（'+pairKey(gz[1],t.gz[1],ZHI_ORDER)+'）——'+t.name+'来害，主暗损离心';
      else if(ZHI_CHONG[gz[1]]===t.gz[1])zr='地支相冲（'+gz[1]+t.gz[1]+'）——'+(selfName||'本运')+'反冲'+t.name;
      else if(isXing)zr='地支相刑（'+(gz[1]===t.gz[1]?gz[1]+gz[1]+'自刑':pairKey(gz[1],t.gz[1],ZHI_ORDER))+'）——'+t.name+'来刑，主是非纠缠、迟滞反复';
      // 既刑又冲（寅申）、既刑又害（寅巳、巳申）者，两义并见，另补一句
      if(isXing&&(ZHI_CHONG[t.gz[1]]===gz[1]||ZHI_CHONG[gz[1]]===t.gz[1]||ZHI_HAI[t.gz[1]]===gz[1]||ZHI_HAI[gz[1]]===t.gz[1])&&zr.indexOf('相刑')<0){
        zr+='；又'+pairZ+'刑害并见——动中带伤，事既迁变而又多是非，宜先避锋、后图进';
      }
      // —— 宫位应事 ——
      // 「加于何宫，即应何事」：施者之十神加于受者之宫，其应落在该宫所主之人与事。
      // 原局四柱各主一事；大运、流年、流月来加，则以该步岁运所主之时限为准。
      // 【修订】古法「十神加宫」非止天干——干为外、支为内（《三命通会》「干主外象、支主内象」），
      //   支之十神（本气）加于该宫，主其宫内里之事与长久之应；干之十神加宫，主外显一时之应。
      //   原只取天干，凡地支所藏之十神概置不论，与「干支并见」之旨不合，故干支分取、各系其辞。
      // 【再订】生克之判，须以「本运之十神」加于「本宫之十神」论，非以本运之十神与自身比。
      //   宫有其本主（该柱天干之十神），岁运之神来加，则视其与本宫本主之生克：
      //   生我宫者其宫受益、克我宫者其宫受损、同气者并见而力倍——此方是「加于何宫」之义。
      var gongTxt='';
      if(t.name&&GONG_SS_JI[t.name]&&selfCls){
        var human={'年柱':'祖上父母、幼年','月柱':'父母兄弟、门庭事业、青年',
                   '日柱':'自身配偶、中年','时柱':'子女、晚景'}[t.name];
        var hostCls=wxToClass(dayGan,GAN_WX[t.gz[0]]);              // 本宫本主之十神
        var zc=wxToClass(dayGan,WX_ZHI[gz[1]]);                     // 来加者之支（本气）
        // 生克：以「来加者」为主、「本宫本主」为受，须分五态
        //   《三命通会·论五行生克》「生我、我生、克我、我克、比和」五者，其应各别——
        //   原只分「生／克／同」三态，凡「本宫生来加者」「本宫克来加者」皆误归「同气」，
        //   如月柱本主为官杀、来加者为印，实为「官杀生印」（本宫泄气于印），
        //   却书作「与本宫同气」，义不可通。今补「我生」「我克」二态。
        function relOf(src,host){
          if(!src||!host)return null;
          if(SS_SHENG[src]===host)return '生';   // 来加者生本宫
          if(SS_KE[src]===host)return '克';      // 来加者克本宫
          if(SS_SHENG[host]===src)return '我生'; // 本宫生来加者（本宫泄气）
          if(SS_KE[host]===src)return '我克';    // 本宫克来加者（本宫制彼）
          return '同';
        }
        var rG=relOf(selfCls,hostCls), rZ=relOf(zc,hostCls);
        var gRec=(rG&&GONG_SS_JI[t.name][selfCls])?GONG_SS_JI[t.name][selfCls][rG]:'';
        var zRec=(rZ&&GONG_SS_JI[t.name][zc])?GONG_SS_JI[t.name][zc][rZ]:'';
        var seg=[];
        var RELW={生:'生本宫',克:'克本宫',我生:'为本宫所生（宫气外泄）',我克:'为本宫所克（宫能制彼）',同:'与本宫同气'};
        if(gRec)seg.push('天干'+GEN_NAME[selfCls]+RELW[rG]+'（外显之事）：'+gRec);
        // 支与干同类者不重出（其辞相同）
        if(zRec&&zc!==selfCls)seg.push('地支'+GEN_NAME[zc]+RELW[rZ]+'（内里长久之事）：'+zRec);
        if(seg.length){
          gongTxt='<span style="color:#5a6a8a">［宫位应事］应于'+t.name+'（'+human+'；本宫本主为'+GEN_NAME[hostCls]+'）——'+seg.join('；')+'</span>';
        }
      }else if(sc&&(t.name==='大运'||t.name==='流年'||t.name==='流月')){
        // 岁运之柱加于本柱：以其所司时限论，事多应在该期之整体境遇
        var span={'大运':'十年之势','流年':'一年之内','流月':'一月之内'}[t.name]||'此期';
        var rel2=(SS_SHENG[sc]===selfCls)?'生我':(SS_KE[sc]===selfCls)?'克我':'同气';
        gongTxt='<span style="color:#5a6a8a">［层级］'+t.name+'与'+(selfName||'本运')+'同为岁运，'+span+'之气'+
          (rel2==='生我'?'相生灌注':rel2==='克我'?'相克相激':'同气相叠')+
          '——其应不在某一宫，而在此期整体之顺逆，须与本柱干支喜忌合看</span>';
      }
      if(!gr&&!extra&&!zr&&!gongTxt)return;
      out.push('<b>'+t.name+'</b>　'+[gr,extra,zr].filter(Boolean).join('；')+(gongTxt?'<br>'+gongTxt:''));
    });
    return out.length?'<div class="gs-line" style="font-size:13.5px"><b>十神关系</b>（'+targets.map(function(t){return t.name;}).join('、')+' 对 '+(selfName||'本运')+' 的影响）<br>'+out.join('<br>')+'</div>':'';
  }
  // —— 干支十神组合之象（干为外、为前半；支为内、为后半）——
  // 依《渊海子平》《三命通会》「干为天、支为地，干主外象、支主内象」立说：
  //   同一十神见于干，主外显、可见、主动之事；见于支，主内藏、暗受、被动之事。
  //   干支同类则内外一致、其力专；干支相生则势顺；干支相克则内外相争。

  // ssList：优先为天干十神、其次地支本气十神；jg/jz：干、支之喜忌；ct：组合类型
  function aspectLines(ssList,aspects,jg,jz,ct){

    aspects.forEach(function(a){

      var txt=null,src=null;

      if(!txt)return;

  // 流年（流月）与大运干之生克关系（《三命通会》岁运相参）
  function yunSuiRel(suiGz,yunGz){
    if(!suiGz||!yunGz)return '';
    var s=suiGz[0],y=yunGz[0];
    // 岁运并临：古法以「大运与流年干支完全相同」为是（《渊海子平·论太岁》）。
    //   若干同而支异（如甲子运遇甲午年），只属「同干」，不作并临论。
    if(suiGz===yunGz)return '与大运干支全同——<b>岁运并临</b>，十年之势与一年之权叠于一柱，吉凶皆烈、其应必显（古诀「岁运并临，灾殃立至」之诫——此诀为后世命家相传之语，义本《渊海子平·论太岁》「太岁不可犯」之旨；然喜用得地者亦倍吉）。宜慎守、勿轻举，大事多应于此年。';
    if(s===y)return '与大运同干而支异——同气相助而不为并临，十年之势增其力，其事易显；吉则加吉，凶则加凶，视干支喜忌为断。';

    if(SH[wy]===ws)return '大运干生其干——运力灌注而应，十年之积应于一期，此期为其运之应期。';
    if(KE[ws]===wy)return '其干克大运干——一期之力撼十年之势，变动之象，宜谋定后动。';
    if(KE[wy]===ws)return '大运干克其干——十年之势压于一期，压力之来，宜守分耐时。';

  // 干主外、主前半；支主内、主后半（《渊海子平》干为外象、支为内象；大运干支各管五年之通例）

    var tot=(jg.t==='喜'?1:0)+(jz.t==='喜'?1:0);
    var totJ=(jg.t==='忌'?1:0)+(jz.t==='忌'?1:0);

    // h1/h2 已含「前五年（1977—1981年）」等完整表述；此处只取其「时长词」，

      var m=String(hx||'').match(/^(前[五四]年|后[五四]年|上半年|下半年|上半月|下半月|前半|后半)/);
      return m?m[1]:'';
    }
    var dGan=durationOf(period.h1),dZhi=durationOf(period.h2);
    var cGan=dGan?('：'+dGan):'',cZhi=dZhi?('：'+dZhi):'';
    if(tot===2)verdict='干支俱为喜用——此'+unit+'「用神得地」，吉运也。所谋多遂、贵人得力，宜进取。';
    else if(totJ===2)verdict='干支俱为忌神——此'+unit+'「忌神当道」，逆运也。宜守不宜攻，防病灾破耗、小人牵绊。';
    else if(tot===1&&totJ===0)verdict='一喜一平——得其半助，平稳中有进益，看何事应于何宫。';
    else if(totJ===1&&tot===0)verdict='一忌一平——得其半碍，小有阻滞而不至大伤，谨守则安。';
    else verdict='喜忌交并——得失参半之'+unit+'：喜神之期则进，忌神之期则守，起伏分明。';
    // 干支分断：干主外·主前半；支主内·主后半
    function ganVerdict(j){
      if(j.t==='喜')return '喜神透干——外象光明'+cGan+'，贵人显于外、事可扬名进取，宜动宜攻。';
      if(j.t==='忌')return '忌神透干——外象多阻'+cGan+'防外耗、竞争、小人之明扰，宜敛守不宜张扬。';
      if(j.t==='混')return '喜忌交并于干——外象起伏'+cGan+'得失相杂，见机而作，勿执一端。';
      return '闲神透干——外象平缓'+cGan+'无大得亦无大失，随势而行。';
    }
    function zhiVerdict(j){
      if(j.t==='喜')return '喜神得支——内里安固'+cZhi+'内助得力、家宅康宁，根基渐厚，暗中得助。';
      if(j.t==='忌')return '忌神伏支——内里暗耗'+cZhi+'防家宅、健康、内部之扰，其患隐而深，宜先防之。';
      if(j.t==='混')return '喜忌交并于支——内情反复'+cZhi+'内部之事起伏，静以处之。';
      return '闲神伏支——内里平缓'+cZhi+'内部无大动，安处即安。';
    }
    // 二级可收放：一、大运／二、流年／三、流月 各自折叠，标题行带干支与吉凶摘要
    var subKey=(selfName==='流年'?'suinian':selfName==='流月'?'suiyue':'dayun');
    var vTag=(tot===2?'<span class="gs-tag" style="background:#e8f3e8;color:#2b6b2b">吉运</span>':
               totJ===2?'<span class="gs-tag" style="background:#fdeceb;color:#a33">逆运</span>':
               (tot||totJ)?'<span class="gs-tag" style="background:#fdf1e0;color:#8a5a12">参半</span>':
               '<span class="gs-tag" style="background:#f0eee6;color:#6a6050">平</span>');
    var h2='<details class="gs-sub" data-fold-key="sy-'+subKey+'"><summary><span class="gs-sub-t">'+title+'</span>'+
           '<b class="gs-sub-gz">'+g+z+'</b>'+vTag+
           '<span class="gs-sub-sub">'+(sub||'')+'</span></summary>'+
           '<div class="gs-sub-body"><div class="gs-body">';
    h2+='<div class="gs-line"><b>天干</b>　'+g+'（'+wg+'·'+ssg+'）——属'+cg+'，判为<span style="'+jg.css+'">'+jg.c+'</span>；'+cg+'之象：'+(SS_YX[cg]||'')+'；主'+shiShenYi(ssg)+'。</div>';
    h2+='<div class="gs-line"><b>地支</b>　'+z+'（'+wz+'）本气'+ben+'（'+ssz+'）——属'+cz+'，判为<span style="'+jz.css+'">'+jz.c+'</span>；'+cz+'之象：'+(SS_YX[cz]||'')+'；主'+shiShenYi(ssz)+'。</div>';
    // —— 岁君之辨（《渊海子平·论太岁》《渊海子平·论太岁》）——
    // 「岁伤日干，祸必轻；日犯岁君，祸必重」：流年天干克日干者，为岁君制我，
    //   其祸虽及身而犹轻；日干克流年天干者，为我犯岁君，以下犯上，其祸必重。
    // 又「太岁乃众煞之主，不可犯」——故凡日干克岁干、或四柱之日支冲岁支者，皆宜慎守。
    var suiTxt='';
    // 【订】「岁君」专指流年太岁（《渊海子平·论太岁》），流月为月建、非岁君，

    //   流月与日柱之冲合刑害，已见于「十神关系」之刑冲合害各条，不重出。
    if(selfName==='流年'){
      var dgWx0=GAN_WX[dayGan];
      var S0={'木':'火','火':'土','土':'金','金':'水','水':'木'};
      var K0={'木':'土','火':'金','土':'水','金':'木','水':'火'};
      // 【订·此处旧有二误，今正之】
      //   ① 判据倒置：K0 为「我克」之表（K0['火']='金' 者，火克金），故
      //      K0[wg]===dgWx0 之义为「岁干克日干」，当是「岁伤日干」；
      //      K0[dgWx0]===wg 之义为「日干克岁干」，当是「日犯岁君」。
      //      旧文二者互易，且释辞亦随之倒——「为我所克」者实为「克我」。
      //   ② 与本卡下文「太岁与日主」一节自相抵牾：彼处 KE[sw]===dw 判「岁伤日干」、
      //      KE[dw]===sw 判「日犯岁君」，其法为是；此节独反，同一卡中两说互斥。
      //      今从「太岁与日主」之正。
      if(K0[wg]===dgWx0){
        suiTxt='<span style="color:#7a5a2a;font-weight:600">岁伤日干</span>——'+g+'（'+wg+'）克我日主，岁君制我，其祸虽及而轻；《渊海子平》「岁伤日干，祸必轻」。宜顺势承受、不宜硬抗，事多外来之压而非自招。';
      }else if(K0[dgWx0]===wg){
        suiTxt='<span style="color:#8b3a3a;font-weight:600">日犯岁君</span>——'+g+'（'+wg+'）为我所克，我克岁君，以下犯上，其祸必重；《渊海子平》「日犯岁君，祸必重」。此期纵有喜神，亦须敛锋守礼，忌强出头、忌与上位者争、忌涉讼。';
      }
      // 日支冲岁支：冲动配偶宫与自身之位，应事最速
      var dz0=pillars&&pillars[2]?pillars[2].zhi:null;
      if(dz0&&ZHI_CHONG[dz0]===z){
        suiTxt+=(suiTxt?'　':'')+'又'+z+'冲日支'+dz0+'——冲动我身与配偶之宫，主居所、婚配、身体之变，应事最速，多在冲动之月。';

    }
    if(suiTxt)h2+='<div class="gs-line"><b>岁君之辨</b>　'+suiTxt+'</div>';
    h2+='<div class="gs-line"><b>断曰（总）</b>　'+verdict+'</div>';
    // h1/h2 为空者（流年）不书「·前后半」，免成「主外·）」之破句
    h2+='<div class="gs-line"><b>断曰·天干（主外'+(period.h1?'·'+period.h1:'')+'）</b>　'+ganVerdict(jg)+'</div>';

    h2+='<div class="gs-line"><b>干支组合</b>　天干'+ssg+'（外）、地支'+ssz+'（内）——'+COMBO_NAME[ct]+'：'+

       :ct==='sheng'?'内外相生，气脉贯通——外象引内象、内象承外象，事有始终，宜循其序而进，以干引支、由外成内。'
       :'内外相克，气不相下——外显与内实不侔，明处与暗处两般，防内外掣肘、表里不一，宜先通其情。')+

    h2+='<div class="gs-line" style="font-size:13.5px;color:#4a5a7a"><b>喜忌取用</b>　'+cg+'（干）为'+(jg.t==='喜'?'喜用':jg.t==='忌'?'忌神':'闲神')+'、'+cz+'（支）为'+(jz.t==='喜'?'喜用':jz.t==='忌'?'忌神':'闲神')+'——喜则得力、忌则为患，象义随喜忌而转吉凶。</div>';

      //   以运干、月干称「太岁」则名实不符，故此辨只于流年立之。
      //   大运干与日主之生克，已由「天干……判为喜/忌」与十神关系条尽之，不赘。
      if(selfName!=='流年')return;
      var dw=GAN_WX[dayGan], sw=GAN_WX[gz[0]];
      var SH={'木':'火','火':'土','土':'金','金':'水','水':'木'};
      var KE={'木':'土','火':'金','土':'水','金':'木','水':'火'};
      if(sw===dw){
        taiSui='太岁与日主同气（比劫）——主自身之事当令，得力则进取、太过则争夺，宜自省而勿争强。';
      }else if(KE[sw]===dw){
        taiSui='太岁克日主——「<b>岁伤日干，祸必轻</b>」：太岁之气凌我，然以下临上者其势顺，其祸尚轻；所主多压力、约束、上司之事，'+
          (jg.t==='喜'?'今太岁为我喜用，则克中带生，主以规矩约束而成器、因压力而受任。':'今太岁为我忌神，则约束过甚，主受压受制、宜低伏守分。');
      }else if(KE[dw]===sw){
        taiSui='日主克太岁——「<b>日犯岁君，祸必重</b>」：以下犯上，其祸较重，主与上位者、时势相争，宜避锋芒、勿强出头；'+
          (jg.t==='喜'?'然今太岁本为我喜用之神，所克者为我所欲取之物，去病得用，反有进取之机。':'今太岁又为我忌神，则争而招损，尤宜忍让。');
      }else if(SH[sw]===dw){
        taiSui='太岁生日主（印）——主得庇荫、受提携，事有依托；若太岁过旺而身弱，则「印重身轻」反须防壅塞。';
      }else if(SH[dw]===sw){
        taiSui='日主生太岁（食伤）——主付出、耗费、才气外泄，宜量力而为；身强者为泄秀之机，身弱者宜节劳。';

// 取某农历年的有效月份列表（去掉跨年残留月与无效月），按正月→腊月排序，闰月紧随同名月
// 注意：lunar-javascript 的 LunarMonth.getIndex() 在含闰月年份会整体错位（如 2004 年把
// 闰二月标成 idx=3、三月标成 idx=4），不可信。故一律以「该月首日的 Lunar 回读值」为准。
function lunarMonthsOfYear(y){
  var ms=LunarYear.fromYear(y).getMonths();
  var out=[];
  ms.forEach(function(m){
    if(m.getYear()!==y)return;
    var jd=m.getFirstJulianDay();
    var sol=Solar.fromJulianDay(jd);
    var lun=sol.getLunar();
    if(lun.getDay()!==1)return;               // 首日必为该月初一，否则跳过
    var raw=lun.getMonth();                   // 负数表示闰月
    var isLeap=raw<0;
    var name=lun.getMonthInChinese();         // 正/二/三…（闰月时库返回"闰二"等）
    if(isLeap)name=name.replace('闰','');
    var idx=LunarUtil.MONTH.indexOf(name);
    if(idx<1||idx>12)return;
    if(m.getDayCount()<29||m.getDayCount()>30)return;   // 过滤异常月
    out.push({y:y,index:idx,leap:isLeap,firstJD:jd,days:m.getDayCount(),obj:m});
  });
  out.sort(function(a,b){
    if(a.index!==b.index)return a.index-b.index;
    return (a.leap?1:0)-(b.leap?1:0);          // 同名月：普通月在前、闰月在后
  });
  return out;
}
// 依「月号+闰标志」找到该月信息
function findLunarMonth(y,index,leap){
  var list=lunarMonthsOfYear(y);
  for(var i=0;i<list.length;i++){
    if(list[i].index===index&&list[i].leap===leap)return list[i];
  }
  return null;
}
// 由月份信息 + 日期，直接以儒略日构造农历（绕开 Lunar.fromYmdHms 的月参数歧义）
function lunarFromMonth(info,day,hh){
  var jd=info.firstJD+day-1;
  var noon=Solar.fromJulianDay(jd);
  return Solar.fromYmdHms(noon.getYear(),noon.getMonth(),noon.getDay(),hh,0,0).getLunar();
}
// 自渲染农历文本（库的 toString 在多闰月年份的月序有偏差，这里按用户所选的月呈现）
function lunarText(lunar){
  var v=STATE.selMonth;                // {y,index,leap,d}
  if(!v)return lunar.toString();
  var ycn=String(v.y).split('').map(function(c){return LunarUtil.NUMBER[parseInt(c)]||c;}).join('');
  var mcn=(v.leap?'闰':'')+LunarUtil.MONTH[v.index]+'月';
  var dcn=LunarUtil.DAY[v.d]||(''+v.d);
  return ycn+'年'+mcn+dcn;
}
function renderCal(){
  var isLunar=document.getElementById('caltype').value==='lunar';
  var msel=document.getElementById('m');
  msel.innerHTML='';
  if(isLunar){
    var y=parseInt(document.getElementById('y').value);
    var months=lunarMonthsOfYear(y);
    months.forEach(function(info){
      var o=document.createElement('option');
      // 用「月号:闰标志」编码，闰月不会顶替同名普通月
      o.value=info.index+':'+(info.leap?1:0);
      o.textContent=(info.leap?'闰':'')+LunarUtil.MONTH[info.index]+'月';
      msel.appendChild(o);
    });
    if(!months.length){var o=document.createElement('option');o.value='1:0';o.textContent='正月';msel.appendChild(o);}
  }else{
    for(var i=1;i<=12;i++){var o=document.createElement('option');o.value=i+':0';o.textContent=i+'月';msel.appendChild(o);}
  }
  fillDays();
}
function fillDays(){
  var isLunar=document.getElementById('caltype').value==='lunar';
  var ds=document.getElementById('d');ds.innerHTML='';
  var n;
  var y=parseInt(document.getElementById('y').value);
  var mv=String(document.getElementById('m').value).split(':');
  if(isLunar){
    var info=findLunarMonth(y,parseInt(mv[0]),mv[1]==='1');
    n=info?info.days:30;
    if(n<1)n=30;
  }else{
    var m=parseInt(mv[0]);
    n=new Date(y,m,0).getDate();
  }
  for(var i=1;i<=n;i++){var o=document.createElement('option');o.value=i;o.textContent=(isLunar?LunarUtil.DAY[i]:(i+'日'));ds.appendChild(o);}
}
var HOURS=[['23','晚子时(23:00-23:59)'],['0','早子时(00:00-00:59)'],['1','丑时(01-02)'],['3','寅时(03-04)'],['5','卯时(05-06)'],['7','辰时(07-08)'],['9','巳时(09-10)'],['11','午时(11-12)'],['13','未时(13-14)'],['15','申时(15-16)'],['17','酉时(17-18)'],['19','戌时(19-20)'],['21','亥时(21-22)']];

// ===== 排盘 =====
var STATE={dayun:null,liunian:null,lunar:null,ec:null,yun:null,dayunList:[],selMonth:null,hour:23,ziSect:2};
function paipan(){
  var g=document.getElementById('gender').value==='1'?1:0;
  var isLunar=document.getElementById('caltype').value==='lunar';
  var y=parseInt(document.getElementById('y').value);
  var mv=String(document.getElementById('m').value).split(':');
  var m=parseInt(mv[0]), leap=mv[1]==='1';
  var d=parseInt(document.getElementById('d').value);
  var hh=parseInt(document.getElementById('h').value);
  // 时辰值若失效（如用户脚本改动、或选项被重置），则回落到子时，免静默失败
  if(isNaN(hh)||hh<0||hh>23)hh=0;
  // 晚子时(23点)之口径——本工具取「子正换日」：
  //   23:00—23:59 仍属当日，日柱用当日，时柱由当日日干起子时（五鼠遁）。
  // 库之 sect 语义须留意：getDay() 内部为「2===sect ? DayInGanZhiExact2 : DayInGanZhiExact」，
  //   而实测 calendar2 默认 sect=2 时，23:30 取到的日柱与当日正午相同（即「不换日」）。
  //   故 sect=2 → 子正换日（23 点属当日）；sect=1 → 子初换日（23 点作次日）。
  // 先前注释以为默认 sect=2 就是「23 点作次日」，实与库相反；一旦按此假设只拨时柱，
  //   便会出现「日柱已是次日、时柱却按当日日干起」的自相矛盾，
  //   且日柱错则十神、神煞、空亡、命宫、胎元、身强弱、格局全盘皆错一日。今予改正。
  var lateZi=(hh===23);
  // 子时换日两派并存，故由用户择之：sect=2 子正换日、sect=1 子初换日。
  var ziSect=parseInt((document.getElementById('zisect')||{value:'2'}).value)===1?1:2;
  document.getElementById('ziRow').style.display=(hh===23)?'':'none';
  STATE.ziSect=ziSect;
  STATE.hour=hh;
  var solar;
  try{
    if(isLunar){
      var info=findLunarMonth(y,m,leap);
      if(!info)throw new Error('该年不存在「'+(leap?'闰':'')+LunarUtil.MONTH[m]+'月」');
      if(d<1||d>info.days)throw new Error('该月只有'+info.days+'天');
      STATE.selMonth={y:info.y,index:m,leap:leap,d:d};
      // 【关键修正】晚子时须以「真实 23 点」送入库，不可改写为 0 点。
      //   库之 sect 只在「传入小时为 23」时才进入换日分支：
      //     23点 + sect=1 → 日柱换（子初换日，日柱作次日）
      //     23点 + sect=2 → 日柱不换（子正换日，日柱仍当日）
      //   若把它改写成 0 点，则恒得「不换日」之结果，两派之别尽失、
      //   且 sect=1 时当换而不换，日柱错一日，十神神煞空亡命宫胎元全盘皆错。
      //   故此处一律送真实时辰（23 点即送 23 点），换与不换交由 setSect 决定。
      solar=lunarFromMonth(info,d,hh).getSolar();
    }else{
      STATE.selMonth=null;
      solar=Solar.fromYmdHms(y,m,d,hh,0,0);
    }
  }catch(e){alert('日期无效：'+e.message);return;}
  var lunar=solar.getLunar();
  var ec=lunar.getEightChar();
  // sect：晚子时（23:00—23:59）日柱换与不换，两派并存，由用户择之（见上方 ziSect）
  if(ec.setSect)ec.setSect(ziSect);
  var yun=ec.getYun(g);
  // 时柱一律自算（五鼠遁以「本日日柱天干」起），不取库之 ec.getTime()——
  //   库在 sect=2（子正不换日）时，日柱取当日、时柱却按次日日干起，二者自相矛盾；
  //   本工具以日柱为准，丁日之子时必为庚子，方与五鼠遁「丁壬庚子居」相合。
  STATE.lunar=lunar;STATE.ec=ec;STATE.yun=yun;STATE.dayunList=yun.getDaYun();
  // 【订】旧作「if(dayunList.length>1)STATE.dayun=1」，上一行既已赋 1，此判断恒等无义；
  //   且 length<=1（库未排运）时，渲染处取 dayunList[1] 将越界。今改为有运则取第一步、无运则取 0。
  STATE.dayun=(STATE.dayunList&&STATE.dayunList.length>1)?1:0;
  STATE.liunian=STATE.dayunList[STATE.dayun]?STATE.dayunList[STATE.dayun].getStartYear():solar.getYear();
  document.getElementById('result').style.display='';
  renderAll();
}
// 时柱自算（五鼠遁）：甲己还加甲，乙庚丙作初，丙辛从戊起，丁壬庚子居，戊癸壬子是真途
// 返回「天干+地支」，如 戊日 子时 → 壬子
function shiZhu(dayGan,hour){
  var zh=hourToZhi(hour);
  var ziGan={'甲':0,'己':0,'乙':2,'庚':2,'丙':4,'辛':4,'丁':6,'壬':6,'戊':8,'癸':8}[dayGan];
  var zhiIdx=ZHIS.indexOf(zh);
  var gan=GANS[(ziGan+zhiIdx)%10];
  return gan+zh;
}
// 小时 → 地支（23 与 0 同属子）
function hourToZhi(hour){
  if(hour===23||hour===0)return '子';
  return ZHIS[Math.floor((hour+1)/2)%12];
}
// 按实际交脱日期精确计算周岁年龄（修正库「只按年相减」的虚岁偏差）
// 返回 {y,m,d} 周岁年月日，以及小数年龄
function realAge(birthSolar, targetSolar){
  var y=targetSolar.getYear()-birthSolar.getYear();
  var m=targetSolar.getMonth()-birthSolar.getMonth();
  var d=targetSolar.getDay()-birthSolar.getDay();
  if(d<0){
    m--;
    var py=targetSolar.getMonth()===1?targetSolar.getYear()-1:targetSolar.getYear();
    var pm=targetSolar.getMonth()===1?12:targetSolar.getMonth()-1;
    d+=new Date(py,pm,0).getDate();
  }
  if(m<0){y--;m+=12;}
  return {y:y,m:m,d:d};
}
// 某步大运的起止周岁：以交脱日为第1步起点，每步 10 年，逐段按实际日期算周岁
// 【订·下标以「出生段」为首】STATE.dayunList[0] 是「出生日至起运日」之段（无干支，
//   故大运格中不渲染），真正第一步大运在下标 1。故年龄仍须按 (index-1)*10 推算：
//   下标 1 者自起运日算起，下标 2 者加十年。前番误以为 0 基而改作 index*10，
//   致全局大运年龄多算十年——如 1990 年正月初一 01 时之命，起运 7 岁 0 月 20 日，
//   丙子运实自 7 岁起，却书「17 岁 → 27 岁」，与「起运 7 岁」自相矛盾。今复其正。
//   下标 0（出生段）非大运，仍斥为无效而返 null。
function dayunAgeRange(birthSolar,yun,index){
  if(index<1||index==null)return null;
  var st=yun.getStartSolar();
  var off=(index-1)*10;
  var sStart=Solar.fromYmdHms(st.getYear()+off,st.getMonth(),st.getDay(),0,0,0);
  var sEnd=Solar.fromYmdHms(st.getYear()+off+10,st.getMonth(),st.getDay(),0,0,0);
  return {start:realAge(birthSolar,sStart), end:realAge(birthSolar,sEnd)};
}

  var dayGan=ec.getDay().substr(0,1);
  var dayZhi=ec.getDay().substr(1,1);
  // 四柱

    return {name:name,gan:gz[0],zhi:gz[1]};
  }
  var pillars=[mk('年柱',ec.getYear()),mk('月柱',ec.getMonth()),mk('日柱',ec.getDay()),mk('时柱',shiZhu(ec.getDay().substr(0,1),STATE.hour))];
  // 大运列
  var dyItem=STATE.dayunList[STATE.dayun];
  var dyGZ=dyItem.getGanZhi();
  var dyCol=dyGZ?mk('大运',dyGZ):null;
  // 流年列
  // 流年干支：以「该公历年立春后」为界，与年柱同一套立春标准（getYearInGanZhiByLiChun）
  // 取当年 6 月 1 日（必在立春后）为定位点，换算成干支；与年柱口径一致，不会出现偏差

  var allCols=[dyCol,lyCol,fmCol].concat(pillars).filter(Boolean);
  // 藏干十神
  function cangganBlock(p){
    var html='';

      html+=lbl+'：'+g+' '+yy+w+' '+ss+'<br>';
    });
    return html;
  }
  // 神煞
  var ss=shenShas(dayGan,ec.getYear().substr(0,1),ec.getYear().substr(1,1),allCols);
  // 表格
  var h='<div class="card"><div class="tblwrap"><table>';

  h+='<tr><td class="rowname">天干</td>'+allCols.map(function(c){return '<td class="tg"><b>'+c.gan+'</b></td>';}).join('')+'</tr>';
  h+='<tr><td class="rowname">五行</td>'+allCols.map(function(c){var w=WX_GAN[c.gan];var cls={'木':'w-mu','火':'w-huo','土':'w-tu','金':'w-jin','水':'w-shui'}[w];return '<td class="'+cls+'">'+YINYANG[c.gan]+w+'</td>';}).join('')+'</tr>';
  h+='<tr><td class="rowname">地支</td>'+allCols.map(function(c){return '<td class="sg"><b>'+c.zhi+'</b></td>';}).join('')+'</tr>';
  h+='<tr><td class="rowname">五行</td>'+allCols.map(function(c){var w=WX_ZHI[c.zhi];var cls={'木':'w-mu','火':'w-huo','土':'w-tu','金':'w-jin','水':'w-shui'}[w];return '<td class="'+cls+'">'+YY_ZHI[c.zhi]+w+'</td>';}).join('')+'</tr>';
  // 藏干三行
  ['本气','中气','余气'].forEach(function(lbl,i){
    h+='<tr><td class="rowname">'+lbl+'</td>'+allCols.map(function(c){
      var g=HIDE[c.zhi][i];if(!g)return '<td>—</td>';
      var w=WX_GAN[g],yy=YINYANG[g],s=shiShen(dayGan,g);
      var sc=s.includes('比')||s.includes('劫')||s.includes('印')?'ss-j':(s.includes('食')||s.includes('伤')||s.includes('财')?'ss-z':'ss-x');

    }).join('')+'</tr>';
  });
  h+='<tr><td class="rowname">星运</td>'+allCols.map(function(c){return '<td>'+diShi(dayGan,c.zhi)+'</td>';}).join('')+'</tr>';
  h+='<tr><td class="rowname">自坐</td>'+allCols.map(function(c){return '<td>'+diShi(c.gan,c.zhi)+'</td>';}).join('')+'</tr>';
  // 空亡行：左列显示该柱自身所属旬之旬空；判「落空」则以日柱旬空为准
  var dayGZ=ec.getDay();
  var kongDay=xunKong(dayGZ);
  h+='<tr><td class="rowname">空亡</td>'+allCols.map(function(c){
    var k=xunKong(c.gan+c.zhi);

  var raTxt=ra.y+'岁'+(ra.m>0?ra.m+'个月':'')+(ra.d>0?ra.d+'天':'');
  if(ra.y===0&&ra.m===0)raTxt=ra.d+'天';
  h+='<div class="info" style="margin-top:8px">'+
    '<b>公历</b> '+lunar.getSolar().toYmdHms().substr(0,16)+'　<b>农历</b> '+lunarText(lunar)+'<br>'+
    '<b>生肖</b> '+sx+'　<b>日主</b> '+dayGan+'（'+YINYANG[dayGan]+WX_GAN[dayGan]+'）　<b>胎元</b> '+ec.getTaiYuan()+'　<b>命宫</b> '+mingGongTrad(pillars)+'　<b>身宫</b> '+shenGongTrad(pillars)+
    '<br><b>起运</b> 出生后 '+yun.getStartYear()+'年'+yun.getStartMonth()+'个月'+yun.getStartDay()+'天（'+

  h+='</div>';

  // 大运选择
  // 【订】大运之分界在「交脱之日」而非公历年首（「十年一换，以生日后节气为准」——此语旧题《渊海子平·论大运》，
  //   篇名待核；其义则与《渊海子平》起运法「阳男阴女顺、阴男阳女逆，三日为一岁」一贯，今存其义而去其确指），
  //   故格内改书交运之「年月日」，读者乃知该运自何日始、至何日终，不致使年中交运者误认全年皆属新运。
  //   年龄一律用「周岁」精确值（与交脱日对齐）；原另书「XXXX年」为该运起始公历年，与交脱之年或差一年，
  //   今既书交脱日，则此年不必重出。
  h+='<div class="card"><h2>大运（点选查看）</h2>';
  STATE.dayunList.forEach(function(d,i){

       '<small>'+ageTxt+'<br>'+jiaoTxt+'起</small></span>';

  h+='</div>';

  // 流年选择
  // 【订】干支原用 getYearInGanZhi()（以农历正月初一为界），而主表流年列用

  // 生月内第几日（以节气交接计），用于取司令之神

  var dayInMonth=1, monthDays=30;

  // 成格/败格简判

  //   ① 七杀格最喜食神制杀（《子平真诠·论偏官》「杀用食制」），若以食神为破，则与本工具

  var JIU_BY_PO={

    '<b>③ 括名（篇名之合称）</b>——旧籍篇目各本不同，有事见于数篇而本无专篇者：如《三命通会》论刑、论三刑、论六合、论六害、论三合诸篇，本工具合称「论刑冲合害」；《渊海子平》论四柱、论干支、论财、论印绶之说，散见卷一、卷二。凡此以<b>括名</b>标之，非谓原书有是篇。<b>本轮复核</b>：凡原书实无此篇名者（《三命通会》之「论神煞」「论十神」「论从格」「论日主」「论宫位」「论红鸾天喜」「论孤辰寡宿」「论三会」，《渊海子平》之「论四柱」「论干支」「十神取象」「十神赋」等），一律改标「某书某某诸篇」，不复冒立篇名。<br>'+
    '<b>④ 存疑之标</b>——凡书「旧题」「篇名待核」者，即示其出处未确，存疑而不删；凡近世命家相传之诀（如「岁运并临，灾殃立至」），标为「古诀」「相传之语」，不以之充经证。<br>'+
    '<b>⑤ 非四书者不入经证</b>——本工具只以《滴天髓》《子平真诠》《穷通宝鉴》《三命通会》《渊海子平》五书为据。'+
    '凡近世著述（如旧题《八字正解》）、佚名歌赋（如旧题《独步》），一律改标「旧说」「旧诀」，并注明其不出四书——不以之充经证，亦不径删，使读者知其所自。<br>'+
    '<b>⑥ 四书之分职</b>——本书立论，各有所主，不使相混：《滴天髓》主<b>气象强弱</b>（衰旺、从象、顺逆），《子平真诠》主<b>格局用神</b>（月令取格、成败救应、行运），《穷通宝鉴》主<b>调候寒暖</b>，《三命通会》主<b>神煞宫分与刑冲合害之象</b>，《渊海子平》主<b>四柱宫位与十神本象</b>。故凡强弱之断不引《穷通宝鉴》，凡调候之断不引《子平真诠》——非其书无此义，乃各从其主，免「以甲书之语证乙书之说」。'+
    '</div>';

    '<b style="color:#1f4e79;font-size:14.5px">二、校订记（本轮所正）</b><br>'+
    '<b>1. 岁君之辨倒置（义理之误，已正）</b>——旧于「岁运算程·流年」一节，以「岁干克日干」判为「日犯岁君」、以「日干克岁干」判为「岁伤日干」，与本卡下文「太岁与日主」一节自相抵牾（彼处之判为是）。'+
