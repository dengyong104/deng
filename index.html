  h+='<div class="note">时辰按当地钟表时间。年月柱以立春、节气为界（内置高精度天文算法）。子时分「早子时(00:00-00:59)」与「晚子时(23:00-23:59)」；晚子时之换日两派并存，本工具<b>默认「子正换日」</b>（23 点仍属当日，日柱按当日、时柱由当日日干起子时，如戊日子时为壬子），可在时辰选为 23 点后就地切换为「子初换日」（23 点即作次日，日柱换）——此说见《渊海子平》《三命通会》诸家互异处，本工具不专主一说。<br><b>流年流月以公历计</b>：流年为公历年份，干支以该年<b>立春</b>交节时刻为界（立春在公历2月3—5日之间浮动，非固定2月4日，且以当日具体交节时刻分界）；流月以十二<b>节</b>划分，寅月立春、卯月惊蛰、辰月清明、巳月立夏、午月芒种、未月小暑、申月立秋、酉月<b>白露</b>、戌月寒露、亥月立冬、子月大雪、丑月小寒，故一个流年的十二个流月自本年2月立春起，至次年1月小寒止，横跨两个公历年。<br><b>空亡</b>按本柱干支所属旬取旬空（甲子旬空戌亥…甲寅旬空子丑），本柱地支落空者标红；神煞之「空亡」则以<b>日柱</b>旬空为准，四柱及大运/流年/流月地支落日柱旬空者皆标「空亡」。<b>神煞</b>口径：天乙/文昌/太极/福星/金舆/国印以<b>年干或日干</b>查，禄神以<b>日干</b>查（甲禄寅、乙禄卯、丙戊禄巳、丁己禄午、庚禄申、辛禄酉、壬禄亥、癸禄子）；羊刃（甲见卯、乙见辰、丙戊见午、丁己见未、庚见酉、辛见戌、壬见子、癸见丑）、血刃（旧题《三命通会》「血刃者，禄前一位也」，即日干之禄顺行一位——甲卯、乙辰、丙戊午、丁己未、庚酉、辛戌、壬子、癸丑）以<b>日干</b>查；血刃与羊刃十二干同支（「禄前一位」为古法取刃之通例，<b>惟阳干之禄前一位即帝旺之位，阴干不然</b>），故二煞必然同柱并见，然所主不同：刃主刚烈争夺、血刃主血光破体，非一煞二名；<b>红艳</b>（红艳煞）亦以<b>日干</b>查（甲见午、乙见申、丙见寅、丁见未、戊见辰、己见辰、庚见戌、辛见酉、壬见子、癸见申），四柱及大运、流年、流月皆标；将星取三合中神（寅午戌见午、申子辰见子、巳酉丑见酉、亥卯未见卯）、<b>华盖</b>取三合墓库（寅午戌见戌、亥卯未见未、申子辰见辰、巳酉丑见丑），二者同出三合局、皆以<b>年支或日支</b>查；桃花（申子辰见酉、寅午戌见卯、巳酉丑见午、亥卯未见子）、驿马（申子辰见寅、寅午戌见申、巳酉丑见亥、亥卯未见巳）以<b>年支或日支</b>三合局查；<b>劫煞</b>（三合局之绝位：申子辰见巳、寅午戌见亥、巳酉丑见寅、亥卯未见申）与<b>灾煞</b>（该局中神之冲：申子辰见午、寅午戌见子、巳酉丑见卯、亥卯未见酉）、<b>亡神</b>（该局临官之位：申子辰见亥、寅午戌见巳、巳酉丑见申、亥卯未见寅）三者同出三合，皆以<b>年支或日支所属之三合局</b>为基准推之（《三命通会·论劫煞亡神》「劫在五行绝处，亡在五行临官，俱属寅申巳亥」——所云「申子辰以巳为劫煞」者，谓年支或日支属申子辰局，则见巳为劫煞，非谓命局须三支齐全也），与桃花、驿马、华盖、将星同一口径；孤辰/寡宿以<b>年支或日支</b>三会局查；丧门（前二位）/吊客（后二位）/披麻（后三位）以<b>年支或日支</b>推；<b>天罗地网</b>以<b>年支或日支</b>查：见戌或亥即论天罗、见辰或巳即论地网（《三命通会》「戌亥为天罗，辰巳为地网」，独见一支即论，不必互见）；命局戌亥并见或辰巳并见者标「互见」，其力倍重；天德/月德以<b>月支</b>查；<b>月德合</b>取月德所合之干（寅午戌月月德丙，丙辛合故为辛；申子辰月壬丁合故为丁；亥卯未月甲己合故为己；巳酉丑月庚乙合故为乙），以月支为准、四柱天干见者为是（《三命通会》「月德合者，月德所合之干也」）；<b>天医</b>亦以<b>月支</b>查、取月支<b>前一位</b>（正月见丑、二月见寅、三月见卯、四月见辰、五月见巳、六月见午、七月见未、八月见申、九月见酉、十月见戌、十一月见亥、十二月见子），四柱及大运、流年、流月地支见之皆标；<b>魁罡</b>（壬辰、庚戌、庚辰、戊戌）、<b>阴差阳错</b>（丙子、丁丑、戊寅、辛卯、壬辰、癸巳、丙午、丁未、戊申、辛酉、壬戌、癸亥）、<b>十恶大败</b>（甲辰、乙巳、丙申、丁亥、戊戌、己丑、庚辰、辛巳、壬申、癸亥）只以<b>日柱</b>论，年柱、月柱、时柱及大运、流年、流月皆不标；孤鸾煞（乙巳丁巳辛亥戊申甲寅丙午戊午壬子）以日柱或时柱见之。<br><b>刑冲合害会</b>：参大运、流年、流月与四柱共七位。<b>三合、三会</b>须三支齐全方成局（如申子辰全方成水局）；二支者论<b>半合</b>——生旺半合（如申子）力最著、旺墓半合（如子辰）次之、生墓拱合（如申辰）力弱须待补中神；已成三合之局不再另论半合。<b>六合</b>（子丑、寅亥、卯戌、辰酉、巳申、午未）主和合牵绊，合而化者须月令有化神当令，否则合而不化。<b>六冲</b>（子午、丑未、寅申、卯酉、辰戌、巳亥）主动摇迁变，本命自冲为根基之动、岁运来冲为应事之动、冲及日柱主自身家室之变；然「合能解冲」——若被冲之支所坐之干另与他干相合、或该支另与第三支成六合、或二支皆已归入三合三会之局，则冲被牵住，本工具另列「合解之冲」一条而不计入正冲之数（寅申、巳亥既冲又合者除外，冲仍在）。<b>三刑</b>：寅巳申（无恩）、丑戌未（恃势）三支齐全刑力最重，二支为半、力减；子卯为无礼之刑；辰午酉亥重见为自刑。<b>六害</b>（子未、丑午、寅巳、卯辰、申亥、酉戌）主暗损离心。<b>天干五合</b>（甲己、乙庚、丙辛、丁壬、戊癸）主亲和羁绊，<b>天干相冲</b>（甲庚、乙辛、丙壬、丁癸）主显性冲突，较地支为轻。<b>伏吟</b>（岁运与某柱干支全同）、<b>反吟</b>（干冲支亦冲）、<b>天克地冲</b>（干克支冲，不论施受）、<b>干支半冲</b>（只动其一）依《三命通会·论伏吟反吟》所谓「伏吟者，干支相同也；反吟者，干支相冲也」设，只论岁运与四柱相值；本命二柱全同别作「柱同」，岁运亦不与同阶或下阶自相论。<b>伏吟／反吟</b>依《三命通会·论伏吟反吟》所谓「伏吟者，干支相同也；反吟者，干支相冲也」——岁运之干支与命局某柱全同者为<b>伏吟</b>；岁运之干与某柱之干相冲（惟甲庚、乙辛、丙壬、丁癸四对）、支亦相冲者为<b>反吟</b>；干相克（不必冲）而支相冲者为<b>天克地冲</b>，其力次于反吟，古法不论施受（丙子见庚午、庚午见丙子同论）；只动其一者为<b>干支半冲</b>。伏反只论「岁运」与「四柱」相值，本命两柱干支全同者别作<b>柱同</b>，岁运亦不与同阶或下阶自相论（免流年与流月互见伏吟而生虚象）。所值之宫为喜用则伏而得益、反而得变，为忌神则伏而积忧、反而生祸。同组干支多柱并见者只报一次；吉凶不断于此，须与喜用忌神参看——合我之喜则吉、合我之忌则凶。<br><b>从格（外格）</b>依《滴天髓》「从得真者只论从，从神又有吉和凶」「旺之极者不可损，衰之极者不可益」与《子平真诠》「日主无根而从四柱之旺神」设四判据：① <b>日主无根</b>——比劫之根与印星之根（年支之根折半计）合计极微，方合「舍命从势」之前提；② <b>一方独旺</b>——所从党势（合并计算：从财＝财＋官杀、从杀＝官杀＋财、从儿＝食伤＋财、从强＝印＋比劫、从旺＝比劫＋印）占全局六成以上；③ <b>无制无化</b>——破格之神极微；④ <b>真从／假从</b>——气之纯驳为纲：破神不足一成五而党势过六成二（或破神几乎为零）为真从，破神不足二成二而党势过五成五为假从。从财、从杀、从儿以日主无根为前提；从旺、从强（从比劫、从印）则以「旺极」为前提——从旺须比劫胜于印、破神（官杀＋财，食伤为秀气不入破神）不足二成二而党势过六成，从强须印胜于比劫、日主本气之根反轻（印重身轻方从印）。<b>从旺从强另立二禁</b>：① 本命已判「身强」者不得入——从者必其「衰之极」或「旺之极而无主」者也，若同党之气既足以判身强，则日主已有凭依、能任财官，断无从印从比之理（《滴天髓》所谓「衰之极者不可益」，反之亦然）；② 日主地支得「本气之比劫根」者不得入，从强者「日主无根」之谓，自坐禄刃则身自有主，不待印生。此二禁皆以「日主之实」为断、不以百分比为断，正合古法「从格看根」之义。<b>取用与正格互为反正</b>：既从之后只论所从之神、不复论扶抑——从财喜财官食伤而忌比劫印，从杀喜官杀财而忌食伤比劫，从儿喜食伤财而忌印官杀，从旺喜比劫印而忌官杀财，从强喜印比劫而忌财食伤；调候之着若恰为破格之神，则舍调候而从格（《滴天髓》「从得真者只论从」）。真从以所从之神为用、喜其顺运；假从运行助从亦吉、遇破则祸，此即《滴天髓》「从神又有吉和凶」之谓。从格为外格，与正格互斥；程序判定仅供参考，从之真假微妙处四书皆谓须凭活法眼力。</div>';

  h+='<div class="card"><div class="note">排盘依据：年柱以立春交接为界，月柱以十二节（立春、惊蛰、清明、立夏、芒种、小暑、立秋、白露、寒露、立冬、大雪、小寒）为界，日柱按当日钟表时刻，时柱按五鼠遁。大运以<b>交脱之日</b>分界（《渊海子平·论大运》所谓「十年一换，以生日后节气为准」），非以公历年首为断；干支各管五年，干主前、支主后。流年干支亦以立春为界，与年柱同一口径。十神、藏干、纳音、神煞等依《渊海子平》《三命通会》通用规则：太乙诸贵（天乙、文昌、太极、福星、金舆、国印）古法以<b>年干或日干</b>为主、四柱地支见者为是，本工具并采年干与日干双基准；羊刃（甲见卯、乙见辰、丙戊见午、丁己见未、庚见酉、辛见戌、壬见子、癸见丑）、血刃（旧题《三命通会》「血刃者，禄前一位也」，即日干之禄顺行一位，十二干与羊刃同支——<b>此「禄前一位」是古法取刃之通例，惟阳干之禄前一位恰是帝旺，阴干则否</b>，故必同柱并见；然刃主刚烈争夺、血刃主血光破体，两存而各论）、禄神（甲禄寅、乙禄卯、丙戊禄巳、丁己禄午、庚禄申、辛禄酉、壬禄亥、癸禄子）、红艳（甲见午、乙见申、丙见寅、丁见未、戊见辰、己见辰、庚见戌、辛见酉、壬见子、癸见申，四柱及岁运皆标）皆以<b>日干</b>查；将星取三合中神（寅午戌见午、申子辰见子、巳酉丑见酉、亥卯未见卯）、华盖取三合墓库（寅午戌见戌、亥卯未见未、申子辰见辰、巳酉丑见丑），二者同出三合，皆以<b>年支或日支</b>查；桃花、驿马以<b>年支或日支</b>三合局查；劫煞（三合局之绝位：申子辰见巳、寅午戌见亥、巳酉丑见寅、亥卯未见申）、灾煞（该局中神之冲）、亡神（该局临官之位：申子辰见亥、寅午戌见巳、巳酉丑见申、亥卯未见寅）三者同出三合，皆以<b>年支或日支所属之三合局</b>为基准推之（《三命通会》「劫在五行绝处，亡在五行临官」，所云「申子辰以巳为劫煞」是就年支/日支所属之局而言，非须三支齐全），与桃花、驿马、华盖、将星同例；孤辰、寡宿以<b>年支或日支</b>三会局查；天罗地网以<b>年支或日支</b>查：见戌或亥即论<b>天罗</b>、见辰或巳即论<b>地网</b>（《三命通会》「戌亥为天罗，辰巳为地网」，古法独见一支即论）；命局戌亥（或辰巳）两支并见者标「互见」，其力倍重；空亡以<b>日柱</b>旬空为准，四柱及大运、流年、流月地支落日柱旬空者标之；丧门（前二位）、吊客（后二位）、披麻（后三位）以<b>年支或日支</b>推；魁罡（壬辰、庚戌、庚辰、戊戌）、阴差阳错（丙子、丁丑、戊寅、辛卯、壬辰、癸巳、丙午、丁未、戊申、辛酉、壬戌、癸亥）、十恶大败（甲辰、乙巳、丙申、丁亥、戊戌、己丑、庚辰、辛巳、壬申、癸亥）<b>只以日柱论</b>，年柱、月柱、时柱及大运、流年、流月皆不标；<b>天医</b>以<b>月支</b>查、取月支前一位（正月丑、二月寅、三月卯、四月辰、五月巳、六月午、七月未、八月申、九月酉、十月戌、十一月亥、十二月子），四柱及大运、流年、流月地支见之皆标；孤鸾煞取乙巳、丁巳、辛亥、戊申、甲寅、丙午、戊午、壬子八组，日柱或时柱见之（《三命通会》则须日时并见，本工具从宽取单见）。神煞仅列常用，同象重见不一一并列。本工具仅供排盘辅助，吉凶推断请以《滴天髓》《子平真诠》《穷通宝鉴》《三命通会》《渊海子平》原典活法为据。</div></div>';

        //   于是外层展开时把内层文字误写成「收起」（内层实为收起态），且 toggle 不触发时也会错。
        //   :scope > summary 限定范围，方各归其主。
        var hint=fd.querySelector(':scope > summary .gs-fold-hint');
        var key=fd.getAttribute('data-fold-key')||'';
        if(key&&FOLD_OPEN[key])fd.open=true;
        function sync(){ if(hint)hint.textContent=fd.open?'收起':'点开'; }
        sync();
        // toggle 仍监听，但只负责「重绘提示」与「记录状态」，且取值以 fd.open 为准
        fd.addEventListener('toggle',function(){
          sync();
          if(key){ if(fd.open)FOLD_OPEN[key]=1; else delete FOLD_OPEN[key]; }
        });
        // 用户直接点击 summary 时，等一帧再记，避开属性同步的空窗
        var sm=fd.querySelector(':scope > summary');
        if(sm)sm.addEventListener('click',function(){
          setTimeout(function(){
            sync();
            if(key){ if(fd.open)FOLD_OPEN[key]=1; else delete FOLD_OPEN[key]; }
          },0);
        });
      })(folds[i]);
    }
  })();
  // 版块工具栏：重渲染（切大运/流年/流月）后仍维持当前所选工具，并只显示对应版块
  applyToolView();
}
var FOLD_OPEN={};
// ===== 版块工具栏 + 字号设置 =====
// 工具栏：'pan'=排盘主视图（主表、大运、流年、流月）；其余为八个版块各自的 key，
//   与 cardFoldHead 之 data-fold-key 一一对应（xingchong/suiyun/shenqiang/geju/tiaohou/xiyong/yuanju/koujing）。
var TOOL_ACTIVE='pan';
function setTool(t){
  TOOL_ACTIVE=t;
  var bs=document.querySelectorAll('#toolbar .tb');
  for(var i=0;i<bs.length;i++){
    var k=bs[i].getAttribute('data-t');
    bs[i].classList.toggle('on',k===t||(bs[i].id==='btnSet'&&false));
  }
  document.getElementById('btnSet').classList.remove('on');
  applyToolView();
}
function applyToolView(){
  var res=document.getElementById('result');if(!res)return;
  var pan=(TOOL_ACTIVE==='pan');
  var kids=res.children;
  for(var i=0;i<kids.length;i++){
    var el=kids[i];
    if(el.tagName==='DETAILS'&&el.classList.contains('card-fold')){
      // 八个版块卡：只显示当前工具所对应者，选中者自动展开
      var show=el.getAttribute('data-fold-key')===TOOL_ACTIVE;
      el.style.display=show?'':'none';
      if(show&&!el.open)el.open=true;
    }else{
      // 主表/大运/流年/流月/落款等普通卡片：仅「排盘」视图显示
      el.style.display=pan?'':'none';
    }
  }
  if(!pan)window.scrollTo(0,0);
}
// 设置面板：字号四档（小/标准/大/特大），以 zoom 缩放整个盘面，本机 localStorage 记忆
var FS_ZOOM={s:0.85,m:1,l:1.15,xl:1.32};
function toggleSet(){

  var show=!p.classList.contains('show');
  p.classList.toggle('show',show);

// 一键展开/收起全部版块
function toggleAllFolds(open){

function selDY(i){STATE.dayun=i;var d=STATE.dayunList[i];STATE.liunian=d.getStartYear();STATE.liuyue=0;renderAll();}

// 流月：以十二「节」划分
// 十二节与十二支严格对应：寅=立春、卯=惊蛰、辰=清明、巳=立夏、午=芒种、未=小暑、
//                          申=立秋、酉=白露、戌=寒露、亥=立冬、子=大雪、丑=小寒
// 易错点：①白露是「节」（酉月起点），秋分是「气」，漏白露会导致酉月起点错到寒露、9月空缺；
//         ②lunar-javascript 的 getJieQiTable() 混合两张表——中文 key 属「本年」，英文 key 属「跨年」，
//           若把英文 key 也映射进来会覆盖本年中文 key（如 2024 表的 LI_CHUN 实为 2025-02-03）。
//           故只取中文 key；子月（大雪）在 12 月属本年表，丑月（小寒）在次年 1 月取次年表。
// 【订】月干须逐月依「该月所属之节气年」起五虎遁，不可整年共用一个年干。
//   十二节所辖之月跨两个公历年：寅月自本年立春起，子月大雪、丑月小寒实入十二月与次年正月前，
//   此时岁干仍是本年（如甲辰年之丑月，立春未至，岁干仍为甲）。若整年共用「次年立春后」之
//   岁干，则子、丑两月之月干全错（甲年丑月应得丁丑，误作戊寅之类）。
//   今改以「各节交接时刻」取该时之立春年干（getYearInGanZhiExact），逐月依五虎遁推之。
function getFlowMonths(year){
  var seqCur=['立春','惊蛰','清明','立夏','芒种','小暑','立秋','白露','寒露','立冬','大雪'];
  var nodes=[];
  var tCur=Lunar.fromYmd(year,6,1).getJieQiTable();
  seqCur.forEach(function(n){
    if(tCur[n])nodes.push({name:n,date:tCur[n]});
  });
  // 丑月起点「小寒」在次年公历 1 月，取次年表的中文 key
  var tNext=Lunar.fromYmd(year+1,6,1).getJieQiTable();
  if(tNext['小寒'])nodes.push({name:'小寒',date:tNext['小寒']});
  nodes.sort(function(a,b){return a.date.toYmdHms()<b.date.toYmdHms()?-1:1;});
  var out=[];
  // 寅月~丑月，月干依五虎遁（五虎遁：甲己之年丙作首，乙庚之岁戊为头，丙辛必定寻庚起，
  //   丁壬壬位顺行流，戊癸甲寅之上好追求）
  var zhiOrder=['寅','卯','辰','巳','午','未','申','酉','戌','亥','子','丑'];
  for(var i=0;i<12;i++){
    var node=nodes[i];if(!node)break;
    var zhi=zhiOrder[i];
    // 【订】月干不自算，径取引擎在该节交接「当时」所排之月柱——
    //   引擎之月柱已依五虎遁、按立春交接时刻定岁干，与此处同源，免两套算法各生歧异。
    //   （须取「交节时刻之后」之瞬间，方入该节所辖；若取当日正午，交节在午后者仍属上一节，
    //     则月柱错一位。故于交节时刻加一分钟取之。）
    // 【订】旧法只进位「时」，不进位「日」：交节时刻若在 23:59，加一分钟即成 24:00，
    //   旧码将其折回当日 0 时（_h=(_h+1)%24），取样点反落到交节之前，月柱退一位。
    //   今改用「毫秒加一秒」之绝对时刻（Date 自动进位日、月、年），取样点必在交节之后。
    var _d=new Date(node.date.getYear(),node.date.getMonth()-1,node.date.getDay(),
                    node.date.getHour(),node.date.getMinute(),node.date.getSecond()||0);
    _d=new Date(_d.getTime()+1000);   // 加一秒，必在交节之后
    var _lun=Solar.fromYmdHms(_d.getFullYear(),_d.getMonth()+1,_d.getDate(),
                              _d.getHours(),_d.getMinutes(),_d.getSeconds()).getLunar();
    var gz=_lun.getEightChar().getMonth();
    var start=node.date;
    // 标签须带年份：十二节所辖之月跨两个公历年（大雪在 12 月属本年、小寒在次年 1 月），
    //   原只书「X月X日起」，读者无从分辨是本年还是次年，断应期之月遂易错一年。
    var label=start.getYear()+'年'+start.getMonth()+'月'+start.getDay()+'日起';
    out.push({gz:gz,label:label,jie:node.name,start:start.toYmdHms(),year:start.getYear(),month:start.getMonth(),day:start.getDay(),zhi:zhi});
  }
  return out;
}

<script>
/* === 独立部署增强：图标 / 添加到主屏幕提示 / 记住上次输入 === */
(function(){
  // 1. 图标（内联 SVG→canvas→PNG，避免额外文件；iOS 主屏幕图标需 PNG）
  try{
    var cv=document.createElement('canvas');cv.width=cv.height=180;
    var cx=cv.getContext('2d'),r=38;
    cx.fillStyle='#1f4e79';
    cx.beginPath();
    cx.moveTo(r,0);cx.lineTo(180-r,0);cx.quadraticCurveTo(180,0,180,r);
    cx.lineTo(180,180-r);cx.quadraticCurveTo(180,180,180-r,180);
    cx.lineTo(r,180);cx.quadraticCurveTo(0,180,0,180-r);
    cx.lineTo(0,r);cx.quadraticCurveTo(0,0,r,0);cx.closePath();cx.fill();
    cx.fillStyle='#fff';cx.textAlign='center';cx.textBaseline='middle';
    cx.font='104px "PingFang SC","Microsoft YaHei",serif';
    cx.fillText('卦',90,96);
    var url=cv.toDataURL('image/png');
    var l1=document.createElement('link');l1.rel='apple-touch-icon';l1.href=url;document.head.appendChild(l1);
    var l2=document.createElement('link');l2.rel='icon';l2.type='image/png';l2.href=url;document.head.appendChild(l2);
  }catch(e){}

  // 2. 添加到主屏幕提示（仅 iOS Safari、非独立模式；关闭后当天不再提示）
  try{
    var standalone=('standalone' in navigator&&navigator.standalone)||
                   (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
    var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||
              (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    if(isIOS&&!standalone&&localStorage.getItem('a2hs_dismiss')!==new Date().toDateString()){
      document.getElementById('a2hs').classList.add('show');
    }
  }catch(e){}

  // 3. 记住上次输入（本机 localStorage，不上传）
  var KEY='bazi_last_input';
  function snap(){
    try{
      var o={};
      ['gender','caltype','y','m','d','h'].forEach(function(id){
        var el=document.getElementById(id);if(el)o[id]=el.value;
      });
      localStorage.setItem(KEY,JSON.stringify(o));
    }catch(e){}
  }
  function restore(){
    try{
      var raw=localStorage.getItem(KEY);if(!raw)return false;
      var o=JSON.parse(raw);if(!o||!o.caltype)return false;
      document.getElementById('caltype').value=o.caltype;renderCal();
      if(o.y){document.getElementById('y').value=o.y;renderCal();}
      if(o.m){var m=document.getElementById('m');
        if([].some.call(m.options,function(x){return x.value===o.m}))m.value=o.m;fillDays();}
      if(o.d){var d=document.getElementById('d');
        if([].some.call(d.options,function(x){return x.value===o.d}))d.value=o.d;}
      if(o.h)document.getElementById('h').value=o.h;
      if(o.gender)document.getElementById('gender').value=o.gender;
      return true;
    }catch(e){return false;}
  }
  ['gender','caltype','y','m','d','h'].forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.addEventListener('change',snap);
  });
  if(restore()){
    try{ if(typeof paipan==='function')paipan(); }catch(e){}
  }
})();
</script>
