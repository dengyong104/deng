<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>八字排盘</title>
<meta name="theme-color" content="#1f4e79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="八字排盘">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="四柱八字排盘：十神、藏干、纳音、神煞、大运流年流月">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#f2f4f7;color:#222;padding-bottom:40px}
.wrap{max-width:760px;margin:0 auto;padding:10px}
h1{font-size:19px;text-align:center;margin:10px 0 6px;color:#1f4e79}
.card{background:#fff;border-radius:10px;padding:10px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.row{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.fld{flex:1;min-width:70px}
.fld label{display:block;font-size:13px;color:#888;margin-bottom:2px}
select,input{width:100%;padding:7px 4px;font-size:16px;border:1px solid #ccc;border-radius:6px;background:#fff}
.btn{width:100%;padding:11px;font-size:18px;border:none;border-radius:8px;background:#1f4e79;color:#fff;margin-top:6px}
.btn2{padding:6px 12px;font-size:15px;border:1px solid #1f4e79;border-radius:6px;background:#fff;color:#1f4e79;margin-right:6px;margin-bottom:6px}
.btn2.on{background:#1f4e79;color:#fff}
.info{font-size:14.5px;line-height:1.9;color:#444}
.info b{color:#1f4e79}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
th,td{border:1px solid #d0d6dd;padding:5px 5px;text-align:center;vertical-align:middle;line-height:1.55}
th{background:#1f4e79;color:#fff;font-weight:600;font-size:14px}
td.rowname{background:#eef2f6;font-weight:600;font-size:13px;width:64px;min-width:64px}
.tg{background:#fdf6ee} .sg{background:#eef6ff} .yg{background:#f6f9ff}
/* 大运/流年/流月列填充色与四柱一致（同用表头深蓝） */
.dy,.ln{background:#1f4e79}
.ly.on{border-color:#1f4e79;background:#e8f1fa;font-weight:700}
.w-shui{color:#3a7bd5}.w-mu{color:#2e9e5b}.w-huo{color:#e0533d}.w-tu{color:#a0762c}.w-jin{color:#b8860b}
.jq{font-size:13px;color:#666}
.ss{display:inline-block;padding:1px 5px;border-radius:4px;font-size:13px;margin:1px}
.ss-j{background:#e8f4ff;color:#1f4e79}
.ss-z{background:#fff3e0;color:#a06000}
.ss-x{background:#ffecec;color:#c0392b}
.badge{display:inline-block;background:#eef2f6;border-radius:5px;padding:2px 8px;font-size:14px;margin:2px 4px 2px 0}
.strong{color:#c0392b;font-weight:700}.weak{color:#1a6fb5;font-weight:700}.mid{color:#2e9e5b;font-weight:700}
.liuyue{display:flex;flex-wrap:wrap;gap:4px}
.ly{border:1px solid #d0d6dd;border-radius:6px;padding:4px 6px;font-size:13.5px;text-align:center;min-width:74px;flex:1}
.ly b{font-size:14.5px}
.note{font-size:13px;color:#999;line-height:1.6;margin-top:8px}
h2{font-size:16px;color:#1f4e79;margin:4px 0 8px;border-left:3px solid #1f4e79;padding-left:8px}
.yun-item{display:inline-block;border:1px solid #ccc;border-radius:6px;padding:4px 8px;font-size:14px;margin:2px;text-align:center;cursor:pointer}
.yun-item.on{border-color:#1f4e79;background:#e8f1fa;font-weight:700}
.yun-item small{color:#888;display:block;font-size:12px}
/* 格局/调候/取用 区块 */
.gs-line{font-size:14.5px;line-height:1.85;color:#333;margin:4px 0}
.gs-body{font-size:14.5px;line-height:1.9;color:#333;margin-top:3px}
.gs-sec{margin-bottom:12px}
.gs-sec-t{font-size:14.5px;font-weight:700;color:#1f4e79;border-left:3px solid #1f4e79;padding-left:7px;margin-bottom:5px}
.gs-tag{display:inline-block;background:#e8f1fa;color:#1f4e79;font-size:13px;padding:1px 7px;border-radius:4px;font-weight:600}
.gs-pill{display:inline-block;background:#eef6ff;color:#1f4e79;border:1px solid #cfe2f5;font-size:13.5px;padding:1px 7px;border-radius:11px;margin:1px 3px 1px 0}
.gs-pill-main{background:#1f4e79;color:#fff;border-color:#1f4e79;font-weight:600}
.gs-pill-bad{background:#ffecec;color:#c0392b;border-color:#f5c6c6}
.gs-warn{color:#c0392b;font-weight:600}
.gs-step{font-size:14px;line-height:1.75;color:#444;padding:3px 0 3px 0}
.gs-step-tag{display:inline-block;background:#2e7d5b;color:#fff;font-size:12.5px;padding:0 6px;border-radius:3px;margin-right:5px;font-weight:600}
.gs-mini{display:inline-block;font-size:12px;padding:0 4px;border-radius:3px;margin-left:2px}
.gs-mini-y{background:#1f4e79;color:#fff}
.gs-mini-j{background:#c0392b;color:#fff}
/* 可收放区块（从格之判等） */
.gs-fold{border:1px solid #e0d6c2;border-radius:6px;background:#fdfbf6;margin:8px 0 0}
.gs-fold>summary{list-style:none;cursor:pointer;padding:7px 10px;font-size:14.5px;font-weight:700;color:#7a5a2a;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;-webkit-tap-highlight-color:transparent;user-select:none}
.gs-fold>summary::-webkit-details-marker{display:none}
.gs-fold>summary::before{content:'▸';display:inline-block;font-size:14px;color:#a08a5a;transition:transform .18s ease;flex:0 0 auto}
.gs-fold>summary>.gs-tag{white-space:nowrap;flex:0 0 auto}
.gs-fold-sum{font-weight:400;color:#7a6a4a;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 120px;min-width:0}
.gs-fold[open]>summary::before{transform:rotate(90deg)}
.gs-fold>summary:hover{background:#f7f1e6}
.gs-fold[open]>summary{border-bottom:1px solid #efe6d4}
.gs-fold-arrow{display:none}
.gs-fold-hint{margin-left:auto;font-size:12.5px;font-weight:400;color:#9a8a6a;flex:0 0 auto}
.gs-fold-body{padding:6px 10px 8px}
/* 整卡可收放（card-fold）：外观仍是原卡片，仅标题行变作可点按的折叠条 */
details.card.card-fold{padding:0;overflow:hidden}
details.card.card-fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:7px;
  flex-wrap:wrap;padding:11px 14px 11px 12px;-webkit-tap-highlight-color:transparent;user-select:none}
details.card.card-fold>summary::-webkit-details-marker{display:none}
details.card.card-fold>summary>h2{margin:0;padding:0;border:0;font-size:17px;flex:0 0 auto;white-space:nowrap}
details.card.card-fold>summary::before{content:'▸';font-size:15px;color:#8a9aa8;transition:transform .18s ease;flex:0 0 auto}
details.card.card-fold[open]>summary::before{transform:rotate(90deg)}
details.card.card-fold>summary:hover{background:#f6f8fa}
details.card.card-fold[open]>summary{border-bottom:1px solid #eceff3}
.card-fold-sum{font-size:13.5px;font-weight:400;color:#7a8290;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 100px;min-width:0;text-align:right}
.card-fold-body{padding:2px 14px 12px}
details.card.card-fold>summary>.gs-tag{flex:0 0 auto}
/* 二级折叠（岁运算程内：一、大运／二、流年／三、流月） */
details.gs-sub{border:1px solid #e6e9ee;border-radius:5px;margin:7px 0;background:#fbfcfd;overflow:hidden}
details.gs-sub>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:6px 9px;font-size:14.5px;font-weight:700;color:#1f4e79;-webkit-tap-highlight-color:transparent;user-select:none}
details.gs-sub>summary::-webkit-details-marker{display:none}
details.gs-sub>summary::before{content:'▸';font-size:13px;color:#8a9aa8;transition:transform .18s ease;flex:0 0 auto}
details.gs-sub[open]>summary::before{transform:rotate(90deg)}
details.gs-sub>summary:hover{background:#f2f6fa}
details.gs-sub[open]>summary{border-bottom:1px solid #e6e9ee;background:#f7fafc}
.gs-sub-t{flex:0 0 auto}
.gs-sub-gz{color:#b35c00;font-size:14.5px;flex:0 0 auto}
.gs-sub-sub{font-size:13px;font-weight:400;color:#889;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gs-sub-body{padding:4px 9px 6px}
/* ===== 命理报告 ===== */
/* 报告内可收放之小节（原局三事、此运分事）：复用二级折叠样式，只微调间距 */
details.gs-sub.rp-sec{margin:5px 0 6px}
details.gs-sub.rp-sec>.gs-sub-body{padding:5px 9px 7px}
details.gs-sub.rp-sec>summary>.gs-sub-sub{font-size:12.5px;color:#7a6a4a}
/* 报告六节（体／势／用／应／期／合）之节级折叠：比小节重一级，收起时标题右侧留结论 */
details.gs-sub.rp-sec1{margin:9px 0 10px;border:1px solid #d9e3ee;background:#fdfefe;box-shadow:0 1px 2px rgba(31,78,121,.05)}
details.gs-sub.rp-sec1>summary{padding:8px 10px;font-size:15.5px;background:#f3f8fc;border-left:3px solid #1f4e79}
details.gs-sub.rp-sec1[open]>summary{background:#eef5fb;border-left-color:#1f4e79}
details.gs-sub.rp-sec1>summary>.gs-sub-t{color:#1f4e79}
details.gs-sub.rp-sec1>summary>.gs-sub-sub{font-size:12.5px;color:#6a7a8a;text-align:right}
details.gs-sub.rp-sec1>.gs-sub-body{padding:7px 10px 9px}
details.gs-sub.rp-sec1 .rp-h{margin:9px 0 5px;font-size:14px;color:#2d5a86;border-left-color:#b9d3e8}
details.gs-sub.rp-sec1 .rp-lead{margin-top:6px}
.rp-h{font-size:14.5px;font-weight:700;color:#1f4e79;margin:13px 0 5px;padding-left:7px;border-left:3px solid #9dc3e6}
.rp-lead{font-size:15px;line-height:1.95;color:#222;background:#f7f9fc;border-left:3px solid #1f4e79;
  padding:8px 10px;border-radius:0 6px 6px 0;margin:3px 0 9px}
.rp-grid{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 9px}
.rp-cell{flex:1 1 44%;min-width:132px;border:1px solid #dfe5ec;border-radius:7px;padding:6px 8px;background:#fbfcfe}
.rp-cell-t{font-size:12.5px;color:#8894a4;margin-bottom:2px}
.rp-cell-v{font-size:15px;font-weight:700;color:#1f4e79;line-height:1.45}
.rp-cell-d{font-size:12.5px;color:#666;line-height:1.55;margin-top:1px}
.rp-tbl{min-width:600px;font-size:13px}
.rp-tbl th{font-size:12.5px;padding:4px 3px;background:#2d5a86;line-height:1.4}
.rp-tbl td{padding:4px 3px;line-height:1.5}
.rp-tbl tr.cur td{background:#fffbe8}
.rp-lv{display:inline-block;font-size:12.5px;padding:0 7px;border-radius:9px;font-weight:700;white-space:nowrap}
.rp-rel{text-align:left;font-size:12.5px;color:#5a6472;line-height:1.55}
.rp-say{font-size:14.5px;line-height:1.9;color:#333;margin:4px 0}
.rp-say b{color:#1f4e79}
.rp-kv{font-size:13.5px;line-height:1.8;color:#4a5a7a;margin:3px 0}
.tb-report{border-color:#b35c00;color:#b35c00;font-weight:600}
.tb-report.on{background:#b35c00;border-color:#b35c00;color:#fff}
/* ===== 刑冲合害会 ===== */
.sha-chip{display:inline-block;font-size:13px;padding:1px 7px;border-radius:10px;margin:0 4px 2px 0;font-weight:600;border:1px solid}
.sha-吉{background:#eaf5ec;color:#2f6b3a;border-color:#bcdcc4}
.sha-凶{background:#fbeceb;color:#8b3a3a;border-color:#e6c0bd}
.sha-中{background:#f3f0e6;color:#7a6320;border-color:#ded3b4}
.rel-tag{display:inline-block;font-size:13.5px;padding:1px 7px;border-radius:10px;font-weight:600;margin-right:5px;border:1px solid transparent}
.rel-he{background:#eef7f0;color:#2e7d5b;border-color:#bfe3cf}
.rel-hui{background:#f0f0ff;color:#3f3f9e;border-color:#cfcff0}
.rel-chong{background:#fff4e6;color:#b35c00;border-color:#f5d5a8}
.rel-xing{background:#ffecec;color:#c0392b;border-color:#f5c6c6}
.rel-hai{background:#f7f0f7;color:#8e4b8e;border-color:#e5cfe5}
.rel-gan{background:#eef4fb;color:#1f4e79;border-color:#cfe2f5}
.rel-sub{display:inline-block;font-size:12.5px;color:#777;margin-right:5px}
.rel-where{display:inline-block;font-size:12.5px;color:#888;background:#f5f6f8;border-radius:3px;padding:0 5px}
.rel-d{font-size:14px;color:#555;line-height:1.65;margin-top:2px;padding-left:2px}
.rel-gong{font-size:13.5px;color:#5a6b7a;line-height:1.6;margin-top:3px;background:#f7f9fb;border-left:2px solid #c9d6e2;padding:2px 6px;border-radius:0 3px 3px 0}
.rel-gl{display:inline-block;background:#c9d6e2;color:#3a4a58;font-size:12px;padding:0 4px;border-radius:2px;margin-right:5px;font-weight:600}
.rel-ul{margin:2px 0 0;padding-left:16px;list-style:disc}
.rel-ul li{margin:0;padding:0;line-height:1.6}
.rel-zhi{font-size:13.5px;color:#4a5560;line-height:1.65;margin-top:2px;background:#f6f7f9;border-left:2px solid #b8c2cc;padding:2px 6px;border-radius:0 3px 3px 0}
.rel-zl{display:inline-block;background:#b8c2cc;color:#2f3a44;font-size:12px;padding:0 4px;border-radius:2px;margin-right:5px;font-weight:600}
.rel-yi{font-size:13.5px;color:#6b4423;line-height:1.65;margin-top:2px;background:#fdf8f2;border-left:2px solid #e0c9a8;padding:2px 6px;border-radius:0 3px 3px 0}
.rel-yl{display:inline-block;background:#e0c9a8;color:#5a3510;font-size:12px;padding:0 4px;border-radius:2px;margin-right:5px;font-weight:600}
.gs-gong{display:flex;gap:5px;margin:6px 0 2px}
.gs-gong-c{flex:1;border:1px solid #d0d6dd;border-radius:7px;padding:5px 3px;text-align:center;font-size:13px;line-height:1.5}
.gs-gong-喜{background:#e8f1fa;border-color:#9dc3e6}
.gs-gong-忌{background:#ffecec;border-color:#f5c6c6}
.gs-gong-中{background:#f7f9fb}
.gs-gong-h{font-weight:700;color:#1f4e79;font-size:13px}
.gs-gong-gz{font-size:16px;font-weight:700;margin:2px 0;color:#222}
.gs-gong-d{color:#888;font-size:12px}
.gs-gong-t{color:#555;font-size:12px;margin-top:1px}
/* 版块工具栏：每个版块作一个工具按钮，点按切换显示 */
.toolbar{position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;gap:5px;
  background:#f2f4f7;padding:7px 0 3px;margin-bottom:8px;
  padding-top:calc(7px + env(safe-area-inset-top))}
.tb{padding:6px 10px;font-size:14px;border:1px solid #c3cddb;border-radius:16px;background:#fff;
  color:#1f4e79;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
.tb.on{background:#1f4e79;color:#fff;border-color:#1f4e79;font-weight:600}
.tb-set{margin-left:auto;border-color:#b8a878;color:#7a5a2a}
.tb-set.on{background:#7a5a2a;border-color:#7a5a2a}
/* 设置面板（字号） */
.setpanel{display:none;background:#fff;border:1px solid #cdd6e0;border-radius:8px;
  padding:8px 10px 9px;margin-bottom:8px}
.setpanel.show{display:block}
.setpanel .sp-t{font-size:13px;color:#888;margin-bottom:6px}
.fsbtn{padding:5px 14px;font-size:14px;border:1px solid #c3cddb;border-radius:14px;background:#fff;
  color:#1f4e79;margin-right:6px;cursor:pointer;font-family:inherit}
.fsbtn.on{background:#1f4e79;color:#fff;border-color:#1f4e79;font-weight:600}
/* iOS 添加到主屏幕提示条 */
.a2hs{display:none;position:sticky;top:0;z-index:99;background:#1f4e79;color:#fff;font-size:14px;
  padding:8px 12px;line-height:1.5;align-items:center;justify-content:space-between;gap:10px;
  padding-top:calc(8px + env(safe-area-inset-top))}
.a2hs b{font-weight:400;opacity:.8;padding:0 4px;cursor:pointer;flex:none}
.a2hs.show{display:flex}
</style>
</head>
<body>
<div id="a2hs" class="a2hs"><span>点下方「分享」→「添加到主屏幕」，可当 App 用</span><b onclick="(function(){try{localStorage.setItem('a2hs_dismiss',new Date().toDateString())}catch(e){};document.getElementById('a2hs').remove();})()">✕</b></div>
<div class="wrap">
<h1>八字排盘</h1>

<div class="card">
  <div class="row">
    <div class="fld" style="max-width:90px"><label>性别</label>
      <select id="gender"><option value="1">男</option><option value="0">女</option></select></div>
    <div class="fld" style="max-width:110px"><label>历法</label>
      <select id="caltype" onchange="renderCal()">
        <option value="lunar">农历</option><option value="solar">公历</option>
      </select></div>
  </div>
  <div class="row">
    <div class="fld"><label>年</label><select id="y"></select></div>
    <div class="fld"><label>月</label><select id="m"></select></div>
    <div class="fld"><label>日</label><select id="d"></select></div>
    <div class="fld"><label>时辰</label><select id="h"></select></div>
  </div>
  <div class="row" id="ziRow" style="display:none;margin-top:-2px">
    <div class="fld" style="flex:1 1 100%"><label>子时口径（23:00—23:59）</label>
      <select id="zisect" onchange="paipan()">
        <option value="2">子正换日：23 点仍属当日（日柱不换）</option>
        <option value="1">子初换日：23 点即为次日（日柱换）</option>
      </select></div>
  </div>
  <button class="btn" onclick="paipan()">开始排盘</button>

</div>

<div id="toolbar" class="toolbar">
  <button type="button" class="tb on" data-t="pan" onclick="setTool('pan')">排盘</button>
  <button type="button" class="tb tb-report" data-t="report" onclick="setTool('report')">命理报告</button>
  <button type="button" class="tb" data-t="xingchong" onclick="setTool('xingchong')">刑冲合害会</button>
  <button type="button" class="tb" data-t="suiyun" onclick="setTool('suiyun')">岁运算程</button>
  <button type="button" class="tb" data-t="shenqiang" onclick="setTool('shenqiang')">身强身弱</button>
  <button type="button" class="tb" data-t="geju" onclick="setTool('geju')">格局</button>
  <button type="button" class="tb" data-t="tiaohou" onclick="setTool('tiaohou')">调候</button>
  <button type="button" class="tb" data-t="xiyong" onclick="setTool('xiyong')">喜用神</button>
  <button type="button" class="tb" data-t="yuanju" onclick="setTool('yuanju')">原局总体运程</button>
  <button type="button" class="tb" data-t="koujing" onclick="setTool('koujing')">口径说明</button>
  <button type="button" class="tb tb-set" id="btnSet" onclick="toggleSet()">⚙ 设置</button>
</div>
<div id="setpanel" class="setpanel">
  <div class="sp-t">字号大小（本机记住，下次打开仍生效）</div>
  <button type="button" class="fsbtn" data-fs="s" onclick="setFont('s')">小</button>
  <button type="button" class="fsbtn" data-fs="m" onclick="setFont('m')">标准</button>
  <button type="button" class="fsbtn" data-fs="l" onclick="setFont('l')">大</button>
  <button type="button" class="fsbtn" data-fs="xl" onclick="setFont('xl')">特大</button>
</div>

<div id="result"></div>
</div>

<script>
;(function(root,factory){
  if (typeof define==='function'&&define.amd){
    define(factory);
  }else if(typeof module!='undefined'&&module.exports){
    module.exports = factory();
  }else{
    var o = factory();
    for(var i in o){
      root[i] = o[i];
    }
  }
})(this,function(){
  var Solar = (function(){
    var _fromDate = function(date){
      return _fromYmdHms(date.getFullYear(),date.getMonth()+1,date.getDate(),date.getHours(),date.getMinutes(),date.getSeconds());
    };
    var _fromJulianDay = function(julianDay){
      var d = Math.floor(julianDay + 0.5);

        _getYearNineStar:function(yearInGanZhi){
          var indexExact = LunarUtil.getJiaZiIndex(yearInGanZhi) + 1;
          var index = LunarUtil.getJiaZiIndex(this.getYearInGanZhi()) + 1;
          var yearOffset = indexExact - index;
          if (yearOffset > 1) {
            yearOffset -= 60;
          } else if (yearOffset < -1) {
            yearOffset += 60;
          }
          var yuan = Math.floor((this._p.year + yearOffset + 2696) / 60) % 3;
          var offset = (62 + yuan * 3 - indexExact) % 9;
          if(0 === offset){
            offset = 9;
          }
          return NineStar.fromIndex(offset - 1);
        },
        getYearNineStar:function(sect){
          var yearInGanZhi;
          switch (sect) {
            case 1:
              yearInGanZhi = this.getYearInGanZhi();
              break;
            case 3:
              yearInGanZhi = this.getYearInGanZhiExact();
              break;
            default:
              yearInGanZhi = this.getYearInGanZhiByLiChun();
          }
          return this._getYearNineStar(yearInGanZhi);

        getMonthNineStar:function(sect){
          var yearZhiIndex;
          var monthZhiIndex;
          switch (sect) {
            case 1:
              yearZhiIndex = this._p.yearZhiIndex;
              monthZhiIndex = this._p.monthZhiIndex;
              break;
            case 3:
              yearZhiIndex = this._p.yearZhiIndexExact;
              monthZhiIndex = this._p.monthZhiIndexExact;
              break;
            default:
              yearZhiIndex = this._p.yearZhiIndexByLiChun;
              monthZhiIndex = this._p.monthZhiIndex;
          }
          var n = 27 - (yearZhiIndex % 3 * 3);
          if (monthZhiIndex < LunarUtil.BASE_MONTH_ZHI_INDEX) {
            n -= 3;
          }
          return NineStar.fromIndex((n - monthZhiIndex) % 9);
        },
        getDayNineStar:function(){
          var solarYmd = this._p.solar.toYmd();
          var dongZhi = this._getJieQiSolar(I18n.getMessage('jq.dongZhi'));
          var dongZhi2 = this._getJieQiSolar('DONG_ZHI');
          var xiaZhi = this._getJieQiSolar(I18n.getMessage('jq.xiaZhi'));
          var dongZhiIndex = LunarUtil.getJiaZiIndex(dongZhi.getLunar().getDayInGanZhi());
          var dongZhiIndex2 = LunarUtil.getJiaZiIndex(dongZhi2.getLunar().getDayInGanZhi());
          var xiaZhiIndex = LunarUtil.getJiaZiIndex(xiaZhi.getLunar().getDayInGanZhi());
          var solarShunBai;
          var solarShunBai2;
          var solarNiZi;
          if (dongZhiIndex>29) {
            solarShunBai = dongZhi.next(60 - dongZhiIndex);
          } else {
            solarShunBai = dongZhi.next(-dongZhiIndex);
          }
          var solarShunBaiYmd = solarShunBai.toYmd();
          if (dongZhiIndex2>29) {
            solarShunBai2 = dongZhi2.next(60 - dongZhiIndex2);
          } else {
            solarShunBai2 = dongZhi2.next(-dongZhiIndex2);
          }
          var solarShunBaiYmd2 = solarShunBai2.toYmd();
          if (xiaZhiIndex>29) {
            solarNiZi = xiaZhi.next(60 - xiaZhiIndex);
          } else {
            solarNiZi = xiaZhi.next(-xiaZhiIndex);
          }
          var solarNiZiYmd = solarNiZi.toYmd();
          var offset = 0;
          if (solarYmd >= solarShunBaiYmd && solarYmd < solarNiZiYmd) {
            offset = this._p.solar.subtract(solarShunBai) % 9;
          } else if (solarYmd >= solarNiZiYmd && solarYmd < solarShunBaiYmd2){
            offset = 8 - (this._p.solar.subtract(solarNiZi) % 9);
          } else if (solarYmd >= solarShunBaiYmd2) {
            offset = this._p.solar.subtract(solarShunBai2) % 9;
          } else if (solarYmd < solarShunBaiYmd) {
            offset = (8 + solarShunBai.subtract(this._p.solar)) % 9;
          }
          return NineStar.fromIndex(offset);
        },
        getTimeNineStar:function(){
          var solarYmd = this._p.solar.toYmd();
          var asc = false;
          if((solarYmd >= this._getJieQiSolar(I18n.getMessage('jq.dongZhi')).toYmd() && solarYmd < this._getJieQiSolar(I18n.getMessage('jq.xiaZhi')).toYmd()) || solarYmd >= this._getJieQiSolar('DONG_ZHI').toYmd()){

          var offset = asc ? [0, 3, 6] : [8, 5, 2];
          var start = offset[this.getDayZhiIndex() % 3];
          var timeZhiIndex = this.getTimeZhiIndex();
          var index = asc ? (start + timeZhiIndex) : (start + 9 - timeZhiIndex);
          return NineStar.fromIndex(index % 9);

        _buildJieQi:function(name, solar){
          var jie=false;
          var qi=false;
          for(var i=0,j=LunarUtil.JIE_QI.length;i<j;i++){
            if(LunarUtil.JIE_QI[i]===name){
              if(i%2===0){
                qi = true;
              }else{
                jie = true;
              }
              break;
            }
          }
          return {
            _p: {
              name: name,
              solar: solar,
              jie: jie,
              qi: qi
            },
            getName: function(){return this._p.name;},
            getSolar: function(){return this._p.solar;},
            setName: function(name){this._p.name=name;},

            toString: function(){return this.getName();}
          };

        _getNearJieQi:function(forward, conditions, wholeDay){
          var name = null;
          var near = null;
          var filters = {};
          var filter = false;
          if(null!=conditions){
            for(var i=0,j=conditions.length;i<j;i++){
              filters[conditions[i]] = true;
              filter = true;
            }
          }
          var today = this._p.solar[wholeDay ? 'toYmd' : 'toYmdHms']();
          for(var key in this._p.jieQi){
            var jq = this._convertJieQi(key);
            if(filter){
              if(!filters[jq]){
                continue;
              }
            }
            var solar = this._getJieQiSolar(key);
            var day = solar[wholeDay ? 'toYmd' : 'toYmdHms']();
            if(forward){
              if(day<=today){
                continue;
              }
              if(null == near || day < near[wholeDay ? 'toYmd' : 'toYmdHms']()){
                name = jq;
                near = solar;
              }
            }else{
              if(day>today){
                continue;
              }
              if(null == near || day > near[wholeDay ? 'toYmd' : 'toYmdHms']()) {
                name = jq;
                near = solar;
              }
            }
          }
          if(null==near){
            return null;
          }
          return this._buildJieQi(name, near);
        },

      XIU_SONG:{
        '{xx.jiao}': '角星造作主荣昌，外进田财及女郎，嫁娶婚姻出贵子，文人及第见君王，惟有埋葬不可用，三年之后主瘟疫，起工修筑坟基地，堂前立见主人凶。',
        '{xx.kang}': '亢星造作长房当，十日之中主有殃，田地消磨官失职，接运定是虎狼伤，嫁娶婚姻用此日，儿孙新妇守空房，埋葬若还用此日，当时害祸主重伤。',
        '{xx.di}': '氐星造作主灾凶，费尽田园仓库空，埋葬不可用此日，悬绳吊颈祸重重，若是婚姻离别散，夜招浪子入房中，行船必定遭沉没，更生聋哑子孙穷。',
        '{xx.fang}': '房星造作田园进，钱财牛马遍山岗，更招外处田庄宅，荣华富贵福禄康，埋葬若然用此日，高官进职拜君王，嫁娶嫦娥至月殿，三年抱子至朝堂。',
        '{xx.xin}': '心星造作大为凶，更遭刑讼狱囚中，忤逆官非宅产退，埋葬卒暴死相从，婚姻若是用此日，子死儿亡泪满胸，三年之内连遭祸，事事教君没始终。',
        '{xx.tail}': '尾星造作主天恩，富贵荣华福禄增，招财进宝兴家宅，和合婚姻贵子孙，埋葬若能依此日，男清女正子孙兴，开门放水招田宅，代代公侯远播名。',
        '{xx.ji}': '箕星造作主高强，岁岁年年大吉昌，埋葬修坟大吉利，田蚕牛马遍山岗，开门放水招田宅，箧满金银谷满仓，福荫高官加禄位，六亲丰禄乐安康。',
        '{xx.dou}': '斗星造作主招财，文武官员位鼎台，田宅家财千万进，坟堂修筑贵富来，开门放水招牛马，旺蚕男女主和谐，遇此吉宿来照护，时支福庆永无灾。',
        '{xx.niu}': '牛星造作主灾危，九横三灾不可推，家宅不安人口退，田蚕不利主人衰，嫁娶婚姻皆自损，金银财谷渐无之，若是开门并放水，牛猪羊马亦伤悲。',
        '{xx.nv}': '女星造作损婆娘，兄弟相嫌似虎狼，埋葬生灾逢鬼怪，颠邪疾病主瘟惶，为事遭官财失散，泻利留连不可当，开门放水用此日，全家财散主离乡。',
        '{xx.xu}': '虚星造作主灾殃，男女孤眠不一双，内乱风声无礼节，儿孙媳妇伴人床，开门放水遭灾祸，虎咬蛇伤又卒亡，三三五五连年病，家破人亡不可当。',
        '{xx.wei}': '危星不可造高楼，自遭刑吊见血光，三年孩子遭水厄，后生出外永不还，埋葬若还逢此日，周年百日取高堂，三年两载一悲伤，开门放水到官堂。',
        '{xx.shi}': '室星修造进田牛，儿孙代代近王侯，家贵荣华天上至，寿如彭祖八千秋，开门放水招财帛，和合婚姻生贵儿，埋葬若能依此日，门庭兴旺福无休。',
        '{xx.qiang}': '壁星造作主增财，丝蚕大熟福滔天，奴婢自来人口进，开门放水出英贤，埋葬招财官品进，家中诸事乐陶然，婚姻吉利主贵子，早播名誉著祖鞭。',
        '{xx.kui}': '奎星造作得祯祥，家内荣和大吉昌，若是埋葬阴卒死，当年定主两三伤，看看军令刑伤到，重重官事主瘟惶，开门放水遭灾祸，三年两次损儿郎。',
        '{xx.lou}': '娄星修造起门庭，财旺家和事事兴，外进钱财百日进，一家兄弟播高名，婚姻进益生贵子，玉帛金银箱满盈，放水开门皆吉利，男荣女贵寿康宁。',
        '{xx.vei}': '胃星造作事如何，家贵荣华喜气多，埋葬贵临官禄位，夫妇齐眉永保康，婚姻遇此家富贵，三灾九祸不逢他，从此门前多吉庆，儿孙代代拜金阶。',
        '{xx.mao}': '昴星造作进田牛，埋葬官灾不得休，重丧二日三人死，尽卖田园不记增，开门放水招灾祸，三岁孩儿白了头，婚姻不可逢此日，死别生离是可愁。',
        '{xx.bi}': '毕星造作主光前，买得田园有余钱，埋葬此日添官职，田蚕大熟永丰年，开门放水多吉庆，合家人口得安然，婚姻若得逢此日，生得孩儿福寿全。',
        '{xx.zi}': '觜星造作有徒刑，三年必定主伶丁，埋葬卒死多因此，取定寅年使杀人，三丧不止皆由此，一人药毒二人身，家门田地皆退败，仓库金银化作尘。',
        '{xx.can}': '参星造作旺人家，文星照耀大光华，只因造作田财旺，埋葬招疾哭黄沙，开门放水加官职，房房子孙见田加，婚姻许遁遭刑克，男女朝开幕落花。',
        '{xx.jing}': '井星造作旺蚕田，金榜题名第一光，埋葬须防惊卒死，狂颠风疾入黄泉，开门放水招财帛，牛马猪羊旺莫言，贵人田塘来入宅，儿孙兴旺有余钱。',
        '{xx.gui}': '鬼星起造卒人亡，堂前不见主人郎，埋葬此日官禄至，儿孙代代近君王，开门放水须伤死，嫁娶夫妻不久长，修土筑墙伤产女，手扶双女泪汪汪。',
        '{xx.liu}': '柳星造作主遭官，昼夜偷闭不暂安，埋葬瘟惶多疾病，田园退尽守冬寒，开门放水遭聋瞎，腰驼背曲似弓弯，更有棒刑宜谨慎，妇人随客走盘桓。',
        '{xx.xing}': '星宿日好造新房，进职加官近帝王，不可埋葬并放水，凶星临位女人亡，生离死别无心恋，要自归休别嫁郎，孔子九曲殊难度，放水开门天命伤。',
        '{xx.zhang}': '张星日好造龙轩，年年并见进庄田，埋葬不久升官职，代代为官近帝前，开门放水招财帛，婚姻和合福绵绵，田蚕人满仓库满，百般顺意自安然。',
        '{xx.yi}': '翼星不利架高堂，三年二载见瘟惶，埋葬若还逢此日，子孙必定走他乡，婚姻此日不宜利，归家定是不相当，开门放水家须破，少女恋花贪外郎。',
        '{xx.zhen}': '轸星临水造龙宫，代代为官受皇封，富贵荣华增寿禄，库满仓盈自昌隆，埋葬文昌来照助，宅舍安宁不见凶，更有为官沾帝宠，婚姻龙子入龙宫。'
      },

  var kongDay=xunKong(dayPillar.gan+dayPillar.zhi);

  //   今劫亡灾三煞已改从「年支或日支所属之局」查（详下），此门槛废而不用，故删。

  var basis=[dayGan]; if(yearGan&&basis.indexOf(yearGan)<0)basis.push(yearGan);
  // 「岁前诸煞」（孤辰寡宿/丧门吊客披麻）的查法基准：年支 + 日支（年日支见者为是）
  var zbasis=[yearZhi]; if(zbasis.indexOf(dayZhi)<0)zbasis.push(dayZhi);

  cols.forEach(function(c){

    if(HUA_GAI[yGroup]===z||HUA_GAI[sanHeGroup(dayZhi)]===z)list.push('华盖');

    // 红鸾、天喜之查法以「年支」为基准（非三合局），亦兼日支（古法年日皆可从，今从年支为主、

    if(HONG_LUAN[yearZhi]===z||HONG_LUAN[dayZhi]===z)list.push('红鸾');
    if(YUE_DE_XI[yearZhi]===z||YUE_DE_XI[dayZhi]===z)list.push('天喜');

    //   即以此局为基准推其所绝之位，非谓命局须有申子辰三支俱全也。

    //   为基准、四柱见之为是）相悖。今改从「年支或日支所属之局」查，与桃花、驿马、华盖、
    //   将星同一口径。（桃花、驿马、华盖、将星本已如此，独劫、亡、灾三煞另设门槛，是自相矛盾。）
    if(JIESHA[yGroup]===z||JIESHA[sanHeGroup(dayZhi)]===z)list.push('劫煞');
    // 驿马：以「年支或日支」三合局查（申子辰见寅、寅午戌见申、巳酉丑见亥、亥卯未见巳）
    if(YIMA[yGroup]===z||YIMA[sanHeGroup(dayZhi)]===z)list.push('驿马');

    if(ZAI_SHA[yGroup]===z||ZAI_SHA[sanHeGroup(dayZhi)]===z)list.push('灾煞');
    // 亡神：三合局之「临官」位（申子辰见亥、寅午戌见巳、巳酉丑见申、亥卯未见寅），同上口径
    if(WANG_SHEN[yGroup]===z||WANG_SHEN[sanHeGroup(dayZhi)]===z)list.push('亡神');
    // —— 天罗地网 ——
    // 【订】旧法要求「命局四支同时互见戌亥／辰巳」，门槛过苛，与古法不合。
    //   《三命通会·论天罗地网》「戌亥为天罗，辰巳为地网」，古法以年支或日支（或纳音）
    //   见之即为命带，不必两支齐全——独见戌或亥者即论天罗、独见辰或巳者即论地网；
    //   两支互见者其力更重。今改：年支或日支见戌／亥即标「天罗」，见辰／巳即标「地网」，
    //   并于命局互见者加「互见」二字以别轻重。
    var luoBoth=(pillarZhis.indexOf('戌')>=0&&pillarZhis.indexOf('亥')>=0);
    var wangBoth=(pillarZhis.indexOf('辰')>=0&&pillarZhis.indexOf('巳')>=0);
    if(zbasis.some(function(bz){return bz==='戌'||bz==='亥';})&&(z==='戌'||z==='亥'))
      list.push(luoBoth?'天罗（互见）':'天罗');
    if(zbasis.some(function(bz){return bz==='辰'||bz==='巳';})&&(z==='辰'||z==='巳'))
      list.push(wangBoth?'地网（互见）':'地网');
    // —— 孤辰寡宿：以「年支或日支」三会局为基准 ——
    if(hasZhui(GUCHEN_HE))list.push('孤辰');
    if(hasZhui(GUASU_HE))list.push('寡宿');
    // —— 丧门/吊客/披麻：以「年支或日支」前后推 ——
    if(hasZ(SANG_MEN_D))list.push('丧门');
    if(hasZ(DIAO_KE_D))list.push('吊客');
    if(hasZ(PI_MA_D))list.push('披麻');
    // —— 天德/月德/月德合：以月支为基准；天德值或为干或为支，须分别比对该柱天干/地支 ——
    var td=TIAN_DE[monthZhi];
    if(td&&(td===z||td===g))list.push('天德贵人');
    if(YUE_DE[monthZhi]===g)list.push('月德贵人');
    // 月德合：月德所合之干（《三命通会》「月德合者，月德所合之干也」），亦以月支为准
    if(YUE_DE_HE[monthZhi]===g)list.push('月德合');
    // —— 天医：以「月支」查，取月支前一位（正月丑、二月寅…十二月子）——
    if(TIAN_YI_DOC[monthZhi]===z)list.push('天医');
    // —— 以下只论命局四柱，不看大运流年 ——
    // —— 魁罡、阴差阳错：只以「日柱」论，年柱/月柱/时柱及岁运皆不标 ——
    if(c.name==='日柱'){
      if(HUI_GANG[gz])list.push(HUI_GANG[gz]);        // 魁罡：壬辰、庚戌、庚辰、戊戌
      if(YIN_CHA[gz])list.push(YIN_CHA[gz]);           // 阴差阳错：丙子丁丑戊寅辛卯壬辰癸巳丙午丁未戊申辛酉壬戌癸亥
      if(SHI_E[gz])list.push(SHI_E[gz]);               // 十恶大败：甲辰乙巳丙申丁亥戊戌己丑庚辰辛巳壬申癸亥
    }
    // 孤鸾煞：日柱或时柱见八组之一（乙巳丁巳辛亥戊申甲寅丙午戊午壬子）
    if((c.name==='日柱'||c.name==='时柱')&&GU_LUAN[gz])list.push('孤鸾煞');
    // —— 空亡：以「日柱」旬空为准，四柱及岁运（大运/流年/流月）地支落日柱旬空者皆标之 ——
    if(kongDay.indexOf(z)>=0)list.push('空亡');
    if(list.length===0)list.push('—');
    out[c.name]=list;
  });
  return out;
}
// ===== 身强身弱 =====
function strength(dayGan, pillars){
  var dw=wxOfGan(dayGan), dyy=YINYANG[dayGan];
  var tong=dw; var sheng={'木':'水','火':'木','土':'火','金':'土','水':'金'};
  var party=[dw, sheng[dw]];
  var supporter=0, oppose=0;
  // 权重量化依《滴天髓》「得时、得地、得势」三要：
  //   得时——月令司权最重，本气独计 40；
  //   得地——日支为日主坐下之地（即《渊海子平》所谓「坐下」），其根较年、时支为亲，故按 1.4 倍计；
  //          月支本气已计入得时，故月支中余气仍按常权；
  //   得势——天干与地支余气为党，干较支为显，故干 12、支本气 10、中气 6、余气 4。
  // 同党＝比劫＋印（扶身），异党＝食伤＋财＋官杀（耗身），取同党占全体之比率定强弱。
  // 得时之辨（《滴天髓》「得时」、《三命通会·论五行旺相休囚死》）：
  //   五行于四时各有气——当令者旺、令生者相、令泄者休、令克者囚、克令者死。
  //   月令本气一神之力，依「日主之五行」与「月令本气之五行」相较而定五等：
  //   旺（同气当令，如春木）40；相（月令生我，如春水）34；休（我生月令）26；
  //   囚（我克月令）22；死（月令克我）18。
  // 昔法一律 40，则日主纵处「死」地亦享满权；今分五等，弱者不再虚盈、强者亦不虚折。
  // 注：此权只系于「月令本气」一神，其余干支另按常权计，不至重复。
  var mg=HIDE[pillars[1].zhi][0];
  var mgWx=wxOfGan(mg);
  var SHENG_MAP={'木':'水','火':'木','土':'火','金':'土','水':'金'};   // 生我者
  var WO_SHENG={'木':'火','火':'土','土':'金','金':'水','水':'木'};   // 我生者
  var WO_KE={'木':'土','火':'金','土':'水','金':'木','水':'火'};      // 我克者
  var KE_ME={'土':'木','金':'火','水':'土','木':'金','火':'水'};      // 克我者
  function seasonQi(me,mz){   // 五行 me 于月令 mz 之气：旺/相/休/囚/死
    if(me===mz)return '旺';
    if(SHENG_MAP[me]===mz)return '相';
    if(WO_SHENG[me]===mz)return '休';
    if(WO_KE[me]===mz)return '囚';
    if(KE_ME[me]===mz)return '死';
    return '平';
  }
  var lingQi=seasonQi(dw,mgWx);
  var LING_SCORE={旺:40,相:34,休:26,囚:22,死:18,平:30};
  var lingScore=LING_SCORE[lingQi]||30;
  // 【订】月令本气一神之力，当系于「与日主较其气」之五等，而非径照其所属之党。
  //   气之得否（旺相休囚死）本是「日主」于月令之地位：日主得气则有力，
  //   日主失气（死、囚）则此神虽为同党，其生我之力亦薄。
  //   原法：同党者（比劫、印）一律记 lingScore、异党者（财官食伤）亦记 lingScore，
  //     则月令为「杀」而日主「死」时，七杀反得 18 分之弱权，身弱之局因而虚高；
  //     月令为「印」而日主「相」时，印得 34 分，其生我之力反不如「比劫当令」之 40，
  //     亦与《三命通会》「印旺身强」之义相左。
  //   今分二路：月令本气为同党（比劫、印）者，其扶身之力随日主得气之等而增减
  //     （旺 40、相 34、休 26、囚 22、死 18——「休囚死」者，日主于此令并不受生，
  //      虽为印比而力已退）；月令本气为异党（财官食伤）者，其耗身之力亦取「日主
  //      于此令之受制程度」为权（月令为财，日主处「囚」得 22；月令为杀，日主处「死」
  //      得 18；月令为食伤，日主处「休」得 26）——
  //      盖月令只一神，其权之大小当视日主受其影响之深浅，非以其自身当令即满权也。
  //      《三命通会·论五行旺相休囚死》五等本以「日主对月令」立义，故权归日主一侧。
  //   两路俱以 seasonQi(日主, 月令本气) 之五等为纲，法理一致，而于同党、异党各得其宜。
  // 【订·义理】月令本气之力，当依「得时」之义恒取满权四十，不论其为同党抑或异党。
  //   旧法以「日主于月令之旺相休囚死」五等折算此权（旺40、相34、休26、囚22、死18），
  //   于异党当令时遂生大谬：月令为七杀而日主处「死」，杀仅得十八分——
  //   是「克我之杀当令最旺」反被计为最弱，身弱杀旺之局被算成身不弱，与《滴天髓》
  //   「得时」之旨、《三命通会·论五行旺相休囚死》之义俱不合。
  //   盖五等（旺相休囚死）所论者，是「日主于此令之地位」，非「月令之神之力」：
  //   月令一神既已当令，其力即最重，不因日主之得失而增减。《滴天髓》云「得时」，
  //   谓得月令之气者权最重——同党得之则我强，异党得之则我弱，其权一也，皆四十。
  //   日主之得令与否（lingQi）别作「得令／失令」之判，用于表述，不用于折算权重。
  supporter+=40; if(party.indexOf(mgWx)<0){ supporter-=40; oppose+=40; }
  // 藏干(不含月支已计) + 天干(日主不计)
  // 【订】年支之根折半计——《渊海子平》「年为根、月为苗、日为花、时为果」，
  //   年支去日主最远（隔月柱一位），其气至日主已减；且古法通根以日支（坐下）、月支为重，
  //   年、时支为轻。本工具「从格判日主无根」一节已依此折半（dayRoot 中 i===0 处乘 0.5），
  //   而旺衰一节未折，两处口径不一——同一命局「无根」与否，前后可以相反。
  //   今归一：年支藏干（含本气、中气、余气）在旺衰统计中一律折半，与从格之判同法。
  //   日支仍按 1.4 倍（坐下最亲）；月支本气另以「月令司权」独计，此处只补其中余气。
  pillars.forEach(function(p,i){
    var zhiMul=(i===2)?1.4:(i===0?0.5:1);   // 日支得地 1.4；年支去日主远，折半
    HIDE[p.zhi].forEach(function(g,gi){
      var w=gi===0?10:(gi===1?6:4);
      if(i===1&&gi===0)return;
      var v=Math.round(w*zhiMul*10)/10;
      if(party.includes(wxOfGan(g))) supporter+=v; else oppose+=v;
    });
    if(p.gan!==dayGan){
      if(party.includes(wxOfGan(p.gan))) supporter+=12; else oppose+=12;
    }
  });
  var r=supporter/(supporter+oppose);
  var cls,txt,clsCss;

function shiShenPower(dayGan,pillars){

// 日主之根：地支中与日主同类（比劫）之藏干，或印星之藏干（生扶之根）
function dayRoot(dayGan,pillars){
  var roots=[],yinRoots=[];
  pillars.forEach(function(p,i){
    HIDE[p.zhi].forEach(function(g,gi){
      var c=wxToClass(dayGan,GAN_WX[g]);
      var w=gi===0?1:(gi===1?0.6:0.4);
      // 年支离日主最远，古法多不作日主之根，故折半计（不废其力，亦不使其独当一面）

      //   时支为亲，旺衰一节已按 1.4 倍计之，而此处旧无此倍率——同一「日支通根」两处算法不同，
      //   从格之判与旺衰之判可就同一局而相左。今归一：日支之根亦按 1.4 倍。
      if(i===2)w*=1.4;
      if(c==='比劫')roots.push({zhi:p.zhi,gan:g,pos:p.name,w:w});
      if(c==='印')yinRoots.push({zhi:p.zhi,gan:g,pos:p.name,w:w});

  });

      //   破神逾二成则气已分流、仍归正格；一成至二成之间者为「旺极带泄」，可作假从。
      //   党势须过六成五——旺极之象必是「满盘同气」，非仅「略占多数」。
      // 【订】原阈「破神 <22%、党势 >70%」过严：一气专旺之局，时上或透一点食伤为「秀气流行」，
      //   正是转旺为贵之处（《滴天髓》「旺极者宜泄」、《子平真诠》专旺格喜食伤吐秀），
      //   如「甲寅 丙寅 甲寅 丁卯」比劫九成余、食伤一成、官杀全无，古法正以为曲直仁寿之象，
      //   而原阈斥之，反使专旺格十不获一。今以「破神不过二成二、党势过六成五」为度：
      //   既不致把「印比同旺而过半」的正格身强误收为从，亦不使「一气专旺而略见秀气」者见弃。
      if(po2>=0.22)return;
      // 【订】党势之阈由 0.65 再让一步至 0.60，且许「破神极微（<5%）」者径过——
      //   何以故？「旺极」之实，在「克泄耗俱无」而不在「同气过半」。八字只四柱，
      //   若比劫六成四、食伤一成、财一成余、官杀为零（如甲寅 丙寅 甲寅 丁卯），
      //   同气虽未及六成五，而全局无一丝逆气，正是《滴天髓》所谓「一气专旺」之象；
      //   若仍以党势硬阈相绳，则专旺格必见弃于程序，反不如古法之宽。
      //   然须防「身强而近半」之正格误收：故党势仍须过六成，且破神须 < 二成二，
      //   二者俱备乃入，非单以破神之微为凭。
      if(p<0.60)return;
      // 【订】「极微」之限由 5% 改为 10%：从旺之破神只计官杀与财（食伤为秀气，不入破神），
      //   故破神之数已较旧法为小；若仍执 5%，则财星一成之局（如甲寅 丙寅 甲寅 丁卯，
      //   财仅 8.1%）反被斥为「非极微」，须党势过六成五，而此局党势 63.5%，仍不得入，
      //   是「订而未尽」也。今以 10% 为「极微」之限。
      if(po2>=0.10&&p<0.65)return;   // 破神非极微者，仍须党势过六成五
    }
    cands.push({k:k,camp:camp[k],pct:p,own:own,poW:poW,pure:po2,biW:biW,yinW:yinW});
  });
  if(!cands.length)return null;
  cands.sort(function(a,b){return b.pct-a.pct;});
  var c=cands[0];
  // 真从／假从之判，以「气之纯驳」为纲，党势为辅：
  //   真从——所从之气纯，破神几无（<15%），且党势足以笼罩（≥62%）；
  //   假从——气犹带驳，破神尚存（<22%）而党势过半（≥55%），从之而未纯。
  //   从旺从强本以「破神有无」定其旺极与否，故破神极微者虽党势仅六成余，
  //   仍是「一气专旺」之真从（如满盘比劫而官杀零分者，岂可谓之假从）。
  // 【订】真从之党势阈由 0.72 下调至 0.68——八字只有四柱，稍有秀气透出则百分比即降，
  //   若必执七成二，则「比劫九成余、食伤一成、官杀全无」之曲直格反落「假从」，与古法相违。
  // 【订】真从之阈再放宽：破神 <15%、党势过六成二（或破神几无）者为真从。
  //   古法「曲直仁寿」「炎上」「从革」诸专旺格，本无「假」之说——凡成格即真；
  //   而八字只四柱，读数一有秀气透出，党势即落六成余、破神即在一成上下，
  //   若必执「破神 <12%、党势 ≥68%」，则诸专旺格尽落「假从」，与古法名实相违。
  //   今以「破神 <15%、党势 ≥62%，或破神近无」为真从之度。
  var zhen=(c.pure<0.15&&(c.pct>=0.62||c.pure<0.03));
  var grade=zhen?'真从':(c.pct>=0.55&&c.pure<0.22)?'假从':'疑从（须细审）';
  // 疑从者不以从格断，避免误判
  if(grade==='疑从（须细审）')return null;
  var def=CONG_DEF[c.k];
  return {
    key:c.k,name:def.name,alias:def.alias,y:def.y,yong:def.yong,ji:def.ji,
    pct:c.pct,own:c.own,camp:c.camp,pure:c.pure,pw:pw,tot:tot,
    zhen:zhen,grade:grade,
    biW:c.biW,yinW:c.yinW,
    roots:rt.bi, yinRoots:rt.yin,
    cands:cands
  };
}

// 摘要（sum）显示在标题右侧，供用户收起时仍能一眼看到要点。
function cardFoldHead(title,key,sum,extra){
  return '<details class="card card-fold" data-fold-key="'+key+'"><summary><h2>'+title+'</h2>'+
         (extra||'')+
         (sum?'<span class="card-fold-sum">'+sum+'</span>':'<span class="card-fold-sum"></span>')+
         '</summary><div class="card-fold-body">';
}

      h+='<div class="gs-line" style="font-size:13.5px;line-height:1.7">'+yr.map(function(y){

        return '<span style="display:inline-block;margin:2px 4px 2px 0;padding:1px 6px;border-radius:3px;background:#f4f0e8">'+
          '<b>'+y.gz+'</b><span style="color:'+col+';font-weight:700">（'+y.t+'）</span></span>';
      }).join('')+'</div>';
      // 举一步详解（取第一个「逆」运，无则取第一个）
      var ex=yr.filter(function(y){return y.t==='逆'||y.t==='偏逆';})[0]||yr[0];
      if(ex)h+='<div class="gs-line" style="font-size:13.5px;color:#555">如行 <b>'+ex.gz+'</b>（'+ex.label+'）：'+ex.note+'</div>';
    }

  h+='<div class="note">从格依《滴天髓·从象》「从得真者只论从，从神又有吉和凶」——既从之后，<b>只论所从之神，不复论扶抑</b>；所从之神得地为吉、逆之者为凶。又《滴天髓》所谓「旺之极者不可损，衰之极者不可益」，故从旺从强者喜生扶、从财官食伤者喜财官食伤，皆忌逆其气。真从须日主无根、一方独旺、又无制化三者俱备；假从者仍以正格论，行运补助可转真。此判为程序辅助，尚须合月令司令、刑冲会合、调候与岁运通盘活看。</div>';
  h+='</div></details>';
  return h;
}

function congYun(cong,dayGan,gzList){
  if(!cong||!gzList||!gzList.length)return [];
  var KEY_CLS={'比劫':['比劫','印'],'印':['印','比劫'],'财':['财','食伤'],'官杀':['官杀','财'],'食伤':['食伤','财']};
  var good=KEY_CLS[cong.key]||[];
  var bad=(cong.ji||'').split('、');
  return gzList.map(function(it){
    var cg=wxToClass(dayGan,GAN_WX[it.gz[0]]);
    var cz=wxToClass(dayGan,GAN_WX[HIDE[it.gz[1]][0]]);
    var score=0;
    [cg,cz].forEach(function(c){
      if(good.indexOf(c)>=0)score++;
      else if(bad.indexOf(c)>=0)score--;
    });
    var t=score>=2?'顺':score===1?'偏顺':score===-2?'逆':score===-1?'偏逆':'平';
    var note=t==='顺'?'所从之神得地，其势愈旺，为从格之吉运——宜进取、宜扩张，所谋多遂。'
      :t==='偏顺'?'干支一顺一逆，得其半助，宜顺势而为、勿强求。'
      :t==='逆'?'逆所从之神，为从格之忌运——主破格生变，宜守成、防是非病灾，勿妄动。'

       未:{y:['庚','辛'],j:['癸'],s:'六月癸水，燥土易涸——急以庚辛生水之源；忌火土燥烈'},
       戌:{y:['辛','甲'],j:['戊'],s:'九月癸水，土燥源涸——喜辛金滋源、甲木疏土；忌土多浊水'},
       丑:{y:['丙','辛'],j:['戊'],s:'十二月癸水，寒凝欲冻——专用丙火解冻、辛金滋源；忌戊土重塞、水多无制'}}
};

// —— 十神归类 ——
var GAN_WX={'甲':'木','乙':'木','丙':'火','丁':'火','戊':'土','己':'土','庚':'金','辛':'金','壬':'水','癸':'水'};
function shiShenName(dg,og){
  var d=GAN_WX[dg],o=GAN_WX[og];
  var same=(YINYANG[dg]===YINYANG[og]);
  var SH={'木':'火','火':'土','土':'金','金':'水','水':'木'};   // 我生
  var KE={'木':'土','火':'金','土':'水','金':'木','水':'火'};   // 我克
  var SHENG={'火':'木','土':'火','金':'土','水':'金','木':'水'};
  var KE_ME={'土':'木','金':'火','水':'土','木':'金','火':'水'};
  if(d===o)return same?'比肩':'劫财';
  if(SH[d]===o)return same?'食神':'伤官';
  if(KE[d]===o)return same?'偏财':'正财';
  if(KE_ME[d]===o)return same?'七杀':'正官';
  if(SHENG[d]===o)return same?'偏印':'正印';
  return '';
}
function shiShenClass(s){
  if(s==='比肩'||s==='劫财')return '比劫';
  if(s==='食神'||s==='伤官')return '食伤';
  if(s==='正财'||s==='偏财')return '财';
  if(s==='正官'||s==='七杀')return '官杀';
  if(s==='正印'||s==='偏印')return '印';
  return '';
}
var GEN_NAME={'比劫':'比劫','食伤':'食伤','财':'财星','官杀':'官杀','印':'印星'};
// 五行 → 十神类（以日干为准）
function wxToClass(dg,w){
  var d=GAN_WX[dg];
  var SH={'木':'火','火':'土','土':'金','金':'水','水':'木'};
  var KE={'木':'土','火':'金','土':'水','金':'木','水':'火'};
  var SHENG={'火':'木','土':'火','金':'土','水':'金','木':'水'};
  var KE_ME={'土':'木','金':'火','水':'土','木':'金','火':'水'};
  if(d===w)return '比劫';
  if(SH[d]===w)return '食伤';
  if(KE[d]===w)return '财';
  if(KE_ME[d]===w)return '官杀';
  if(SHENG[d]===w)return '印';
  return '';
}
// 十神类 → 对应五行
function classToWx(dg,c){
  var d=GAN_WX[dg];
  var SH={'木':'火','火':'土','土':'金','金':'水','水':'木'};
  var KE={'木':'土','火':'金','土':'水','金':'木','水':'火'};
  var SHENG={'火':'木','土':'火','金':'土','水':'金','木':'水'};
  var KE_ME={'土':'木','金':'火','水':'土','木':'金','火':'水'};
  if(c==='比劫')return d;
  if(c==='食伤')return SH[d];
  if(c==='财')return KE[d];
  if(c==='官杀')return KE_ME[d];
  if(c==='印')return SHENG[d];

}

// —— 月令司权：寅月戊七日丙七日甲十六日…（《三命通会·论人元司事》）——
// 以「日主生于月令第几日」定司令之神。其用有二：一以辨月内气候之深浅（初气得令、
//   中气次之、本气最后而最旺），二以参旺衰之轻重；不以之定格局之名（详见 geJu() 之注）。
//   寅月之序为「戊七、丙七、甲十六」——长生之后、本气之前，先戊土、次丙火、终甲木，
//   与《三命通会》所列相合；注释旧作「甲七丙七戊十六」者误，表为是。
var SILING={
 寅:[['戊',7],['丙',7],['甲',16]],
 卯:[['甲',10],['乙',20]],
 辰:[['乙',9],['癸',3],['戊',18]],
 巳:[['戊',5],['庚',9],['丙',16]],
 午:[['丙',10],['己',9],['丁',11]],
 未:[['丁',9],['乙',3],['己',18]],
 申:[['戊',7],['壬',7],['庚',16]],
 酉:[['庚',10],['辛',20]],
 戌:[['辛',9],['丁',3],['戊',18]],
 亥:[['戊',7],['甲',5],['壬',18]],
 子:[['壬',10],['癸',20]],
 丑:[['癸',9],['辛',3],['己',18]]
};
// 依「生月内第几日」取司令之干
// 注：SILING 各月合计 30 日（《三命通会》通行之分日法），而节气月实有 29—31 天，
//   故先按「表内 30 日 : 该月实际日数」折算，再落段；否则生于第 31 日者一律越界，
//   被默认归入末位（虽多为本气、结果常对，然法理不严）。
// 【订·总日数当以表内实际合计为准】上文既言「各月合计 30 日」，而巳月为 5+9+16=30、
//   寅月 7+7+16=30、辰月 9+3+18=30——皆合；然亥月 7+5+18=30、未月 9+3+18=30 亦合，
//   故折算之分子仍以「表内实际合计」取之（原以 total 计，本已无差），此处不改算法，
//   惟将巳月之分日由「戊七庚七」校正为「戊五庚九」——《三命通会·论人元司事》巳月
//   「戊土五日、庚金九日、丙火十六日」，原表作七、七，与古法差二日，司令之干
//   在巳月初六至初八三日之内随之易位。
function siLingGan(monthZhi, dayInMonth, monthDays){
  var seg=SILING[monthZhi]; if(!seg)return HIDE[monthZhi][0];
  var total=0; for(var k=0;k<seg.length;k++)total+=seg[k][1];
  var md=(monthDays&&monthDays>0)?monthDays:total;
  // 折算：实际第 n 日 → 表内坐标（1..total）
  var d=Math.max(1,Math.min(total,Math.ceil(dayInMonth*total/md)));
  var acc=0;
  for(var i=0;i<seg.length;i++){
    acc+=seg[i][1];
    if(d<=acc)return seg[i][0];
  }
  return seg[seg.length-1][0];
}

// —— 格局判定（《子平真诠》）——
// 八格：正官、七杀、正财、偏财、正印、偏印、食神、伤官
// 特别格：建禄（月令为日主之禄）、羊刃（月令为日主之刃）、月劫（月令为劫财）
function geJu(dayGan, pillars, dayInMonth, monthDays){
  var mz=pillars[1].zhi;
  var dg=dayGan;
  var ling=siLingGan(mz, dayInMonth, monthDays);   // 司令之神
  var hidden=HIDE[mz];                       // 月令藏干（本气/中气/余气）
  var ganSet=pillars.map(function(p){return p.gan;});
  // 1) 建禄 / 羊刃 / 月劫 优先
  var LU={'甲':'寅','乙':'卯','丙':'巳','丁':'午','戊':'巳','己':'午','庚':'申','辛':'酉','壬':'亥','癸':'子'};
  // 【订·阳刃只取五阳干】旧表并录阴干之刃（乙辰、丁未、己未、辛戌、癸丑），本于「禄前一位」遍推十二支之法。
  //   然阴干逆行，其帝旺不在禄前而在禄后：乙禄卯而帝旺在寅、丁禄午而帝旺在巳、己同、
  //   辛禄酉而帝旺在申、癸禄子而帝旺在亥——故「禄前一位」不可通用于阴干。
  //   《子平真诠·论阳刃》主「五阳干有刃，五阴干无刃」，今从之：阴干不立刃格，
  //   其月令本气为比劫者，仍归建禄／月劫之属，或就月令所藏之财官食伤取用。
  //   旧以「禄前一位」遍推，致「未月丁日」（本气己为食神）、「丑月癸日」（本气己为七杀）、
  //   「辰月乙日」（本气戊为正财）等皆误作羊刃格，掩没月令本气，今删阴干四项。
  var REN={'甲':'卯','丙':'午','戊':'午','庚':'酉','壬':'子'};
  if(LU[dg]===mz) return {name:'建禄格',type:'禄',ling:ling,ss:'比肩',cls:'比劫',
    tou:'月令'+mz+'即日主'+dg+'之禄',
    // 【订】旧作「须看月令<b>之外</b>财官食伤何者有力」，与本工具他处所引《子平真诠》
    //   「月令建禄，则取月令<b>所藏</b>财官食伤为用」相冲突——建禄格之用正在月令所藏之中，
    //   非于月令之外别求。今改「月令所藏」，使前后一贯。
    note:'月令为日主之禄（《子平真诠》「月令建禄」）。禄居月令，日主得根自强，不以禄为用神；须看月令所藏财官食伤何者有力，取以为用。'};
  if(REN[dg]===mz) return {name:'羊刃格',type:'刃',ling:ling,ss:'劫财',cls:'比劫',
    tou:'月令'+mz+'即日主'+dg+'之刃',
    note:'月令为日主之羊刃（《子平真诠》「月劫羊刃」）。刃旺喜制，最喜七杀制刃（杀刃格）或正官制刃；忌刃再逢刃、刃逢冲。'};
  // 2) 八格：以「透干」者取格；先看月令本气是否透，再看中余气透出
  // 【订·取格之序】原法以「司令之神」（按日序之人元司令）置于最高优先（pri:0），
  //   谓「先看司令之神是否透」。此与《子平真诠》本文不合：
  //   《子平真诠·论用神》云「八字用神，专求月令，以日干配月令地支，生克不同而格局分焉」——
  //   所据者为「月令地支」，即五月之气（本气），非按月内日序而递迁之司令神。
  //   人元司令（戊七日、丙七日、甲十六日之类）《三命通会·论人元司事》本用以
  //   「分月内之气候、辨旺衰之深浅」，非以定格局之名。若以司令取格，则同生寅月、
  //   同为一甲日者，生于初一为建禄、生于初十为食神，格局随日期而移，大悖古法。
  //   今改：取格以「月令本气」为先，本气不透而后中气、余气；司令仍用于旺衰与
  //   「透干得力与否」之参（另见 strength()），不入取格之序。
  var cand=[];   // {gan, cls, isLing}
  // ① 月令本气（hidden[0]）透干者，即以本气取格——此为「专求月令」之正法。
  //   然本气若为比劫（与我同类），则不成八格之一，当另于中余气取财官食伤
  //   （《子平真诠》「月令为比劫，则取月令所藏财官食伤为用」——建禄月劫之格，
  //   其用不在禄刃本身，而在月令所藏之神透出者）。故本气为比劫时不入 cand。
  var benQiIsBiJie=(shiShenClass(shiShenName(dg,hidden[0]))==='比劫');
  // 【订】旧有 lingIdx 之求（求司令之神在月令藏干中之位次），乃「以司令取格」旧法之残留，
  //   今取格以「月令本气透干」为先，全函数未用此值，删之免为死代码。
  if(!benQiIsBiJie && hidden[0]!==dg && ganSet.indexOf(hidden[0])>=0) cand.push({gan:hidden[0],pri:0});
  // ② 本气不透（或本气为比劫），则中气、余气透出者取之
  // 【订·比劫不立格】旧法于此径以「中余气所透者」取格，不问其为何神。然古法所立之八格者，
  //   正官、七杀、正财、偏财、正印、偏印、食神、伤官而已——比肩劫财不与焉。
  //   何则？比劫与我同类，非财非官非食伤，不能为我所用，故不能定格局之名
  //   （《子平真诠·论用神》「八字用神，专求月令，以日干配月令地支，生克不同而格局分焉」，
  //   格局之名生于「我所取用者为何物」，比劫无所取，是以无格）。
  //   故若月令本气不透、而中余气所透者恰为比劫，则<b>比劫非格，乃破格之病</b>，
  //   仍当归取月令本气：如甲日未月，本气己土为正财，虽不透亦当以正财立格，
  //   所透之乙木劫财只夺我之财，于「格局成败、救应」一路论之（须官杀制劫、或食伤化劫生财以救），
  //   不得因之改称「月劫格」。旧以「丙寅 乙未 甲子 戊辰」一造误作月劫格，正坐此失，今正之。
  var biJieTou=null;   // 中余气所透之比劫（只记不取，备说明之用）
  var yinTou=null;     // 中余气所透之印（本气为比劫时不取，备说明之用）
  // 禄刃之格所取用者：财、官杀、食伤三者（印不与焉，见下注）
  var YONG_CLS={财:1,官杀:1,食伤:1};
  hidden.forEach(function(g,i){
    if(i===0)return;
    if(g===dg)return;
    if(ganSet.indexOf(g)<0)return;
    if(shiShenClass(shiShenName(dg,g))==='比劫'){ if(!biJieTou)biJieTou=g; return; }   // 比劫不立格，跳过
    // 【订·禄刃不取印】若月令本气即比劫（建禄、羊刃、月劫之属），日主已得根而旺，
    //   其取格只在月令所藏之<b>财官食伤</b>——印为生我之物，禄刃既旺，何劳印生？
    //   故本气为比劫、而中余气所透者为印者，不取以立格，仍于中余气中别求财官食伤；
    //   求之不得，始归月劫格。旧法不别，致「戊生未月透丁」者径作正印格，今正之。
    if(benQiIsBiJie && shiShenClass(shiShenName(dg,g))==='印'){ if(!yinTou)yinTou=g; return; }
    if(!cand.some(function(c){return c.gan===g;})) cand.push({gan:g,pri:i});
  });
  // ③ 若本气为比劫、中余气皆不透，而中余气中另有财官食伤之神（虽不透亦取之），
  //   取其中最有力者——古法「月令所藏之神，透则用透，不透则用藏中最旺者」。
  //   若中余气所藏亦无非比劫者，则归「月劫格」（见下）。
  // ③ 若本气为比劫、中余气皆不透：则于中余气中取「财官食伤」之神（虽不透亦取之），
  //   此为「月令所藏之神，透则用透，不透则用藏」之法；若中余气所藏亦无非比劫者，
  //   始归「月劫格」——禄刃之格其用不在禄刃本身，而在月令所藏之神。
  var tianfu=null;
  if(cand.length){cand.sort(function(a,b){return a.pri-b.pri;});tianfu=cand[0].gan;}
  else if(!benQiIsBiJie && hidden[0]!==dg){ tianfu=hidden[0]; }
  if(!tianfu){
    // 本气为比劫（或本气即日干）而中余气无透：先取中余气之财官食伤，无则归月劫
    var alt=null;
    for(var ai=1;ai<hidden.length;ai++){
      var g2=hidden[ai];
      if(g2===dg)continue;
      var c2=shiShenClass(shiShenName(dg,g2));
      if(YONG_CLS[c2]){ alt=g2; break; }   // 禄刃之格只取财官食伤；印非所取（见上注）
    }
    // 【订】旧作 (LU[dg]===mz?'建禄格':'月劫格')，然本函数开头已判「月令＝日主之禄」即 return 建禄格，
    //   至此 LU[dg]===mz 必为假，三元之「建禄」一支恒不可达。今直书「月劫格」，免虚设之辞。
    if(!alt) return {name:'月劫格',type:'劫',ling:ling,
      note:'月令为日主之比劫（建禄、羊刃、月劫之属），而月令所藏中余气<b>亦无财官食伤可取</b>者，作月劫论。身旺无依，最须食伤泄秀、或财官为用；《子平真诠》「月令建禄，则取月令所藏财官食伤为用」——建禄月劫同一取用之法，皆于月令所藏中求财官食伤。'+
      (yinTou?'　<b>辨</b>：月令中余气虽透「'+yinTou+'」，然其为印——印乃生我之物，禄刃既旺，何劳印生？故不以之立格。':'')};
    tianfu=alt;
  }
  var ss=shiShenName(dg,tianfu);
  var cls=shiShenClass(ss);
  var map={'正官':'正官格','七杀':'七杀格','正财':'正财格','偏财':'偏财格',
           '正印':'正印格','偏印':'偏印格','食神':'食神格','伤官':'伤官格',
           '比肩':'建禄格','劫财':'月劫格'};
  var name=map[ss]||(GEN_NAME[cls]+'格');
  // 【订】取格之说明：古法「专求月令」，故所述者当为「本气／中余气之透与不透」，
  //   不可再书「司令」——司令乃旺衰之候，非取格之据（详见上注）。
  var touStr=(cand.length
    ? ('月令本气「'+hidden[0]+'」'+(hidden[0]===tianfu?'透干':'未透')
       + (hidden[0]===tianfu?'':'，取中余气所透之「'+tianfu+'」'))
    : (biJieTou
        ? ('月令本气「'+hidden[0]+'」未透，中余气所透之「'+biJieTou+'」为比劫——'
           +'比劫与我同类，非财非官非食伤，不能为用，<b>不能立格</b>；'
           +'所透之劫乃<b>破格之病</b>（劫财夺财、比肩争官），只于成败救应一路论之，'
           +'不得因之改称月劫格。仍以月令本气「'+tianfu+'」取格。')
        : ('月令所藏「'+tianfu+'」未透，就其藏神取之')));
  return {name:name,type:'八格',ling:ling,ss:ss,cls:cls,tou:touStr,
    note:'月令'+mz+'，'+touStr+'，为'+ss+'，故立'+name+'（《子平真诠》「八字用神，专求月令」）。'
        +'（人元司令为「'+ling+'」，乃月内气候之候，只以参旺衰轻重，不据以定格局之名。）'};
}

// —— 格局行运（《子平真诠·论行运》等）——
// 顺逆：依月令与日干之生克定顺行逆行大略；此处列各格喜运、忌运与要点。

}

// 依身强弱与格局名取断语（身强/偏强→强档，身弱/偏弱→弱档，中和→并陈）
function geJuDuan(gj,st){
  var t=GEJU_DUAN[gj&&gj.name];
  if(!t)return null;
  var strong=st&&(st.cls==='身强'||st.cls==='偏强');
  var weak=st&&(st.cls==='身弱'||st.cls==='偏弱');
  var strongTxt=st?(st.r!==undefined?'（同党'+(st.r*100).toFixed(0)+'%，'+st.cls+'）':''):'';
  // 取用喜忌已见「格局行运」上方与「喜用神·忌用神」栏，此处不再重出；
  // 只论格局所主之事：事业、性格、六亲、成败救应。
  var body;
  if(strong){
    var d=t['强'];
    body=[['事业',d.s],['性格',d.x],['六亲',d.l],['成败救应',d.b]];
  }else if(weak){
    var d2=t['弱'];
    body=[['事业',d2.s],['性格',d2.x],['六亲',d2.l],['成败救应',d2.b]];
  }else{
    // 中和：两档并陈，各标其向
    body=[['身偏向强则',t['强'].s],
          ['身偏向弱则',t['弱'].s],
          ['性格',t['强'].x+'　（若身偏弱，则见下：）'+t['弱'].x],
          ['六亲',t['强'].l+'　（身偏弱时：）'+t['弱'].l],
          ['成败救应',t['强'].b+'　（身偏弱时：）'+t['弱'].b]];
  }
  var rows=body.map(function(r){
    return '<b style="color:#1f4e79">'+r[0]+'</b>　'+r[1];
  }).join('<br>');
  return '<div class="gs-sec" style="margin-top:8px">'+
    '<div class="gs-sec-t">格局断语　'+gj.name+strongTxt+'</div>'+
    '<div class="gs-body">'+rows+'</div></div>'+
    '<div class="note">格局断语依《滴天髓》「何知其人贵，官星有理会」论其位分，依《三命通会·论六亲》论妻财子禄，依《子平真诠·论用神成败救应》论其成败所防，参《穷通宝鉴》调候之缓急、《渊海子平》论财官印食诸篇。取用喜忌已见上方「格局行运」及「喜用神·忌用神」栏，此处专论格局所主之事，不复重出。身之强弱不同，同一格而所应向背相反——故先定强弱，再论格局，二者合参方为的当。此处所述为格局所主之「常」，非一人之定命，仍须合原局刑冲会合、神煞、岁运通盘活看。</div>';
}

// —— 调候（《穷通宝鉴》）——
// 逐月取法：寅卯、巳午、申酉、亥子八月各从其季；辰戌丑未四月另按 TIAO_HOU_TU 取——
//   《穷通宝鉴》原以「月令」立论，非以「季」立论，四季土月土旺用事、寒暖燥湿与本季前两月不同，
//   不可一例相绳。故先问土月，无则归季。
function tiaoHou(dayGan, monthZhi){
  var zhi=TIAO_HOU_ZHI[dayGan+monthZhi];      // 月支细案（穷通宝鉴逐月明训）
  var tu=TIAO_HOU_TU[dayGan]&&TIAO_HOU_TU[dayGan][monthZhi];
  var s=SEASON_OF[monthZhi];
  var t=TIAO_HOU[dayGan];
  if(!t&&!tu&&!zhi)return null;
  var row=zhi||tu||t[s];
  var isTu=!zhi&&!!tu;
  // season 只存「季／月」之单字（渲染处一律续以「月」字），土月之注别存于 seasonNote，
  //   免得「丑月（季冬土冻）月」之叠字。
  var seasonName=zhi?monthZhi:(isTu?monthZhi:['春','夏','秋','冬'][s]);
  var seasonNote=isTu?({辰:'季春土旺',未:'季夏土燥',戌:'季秋土厚',丑:'季冬土冻'}[monthZhi]):'';
  // 调候之缓急：冬夏为急（寒燥伤人）；四季土月中，未戌燥烈、丑月寒冻，二者为急，
  //   辰月土润气和，为「次急」——《穷通宝鉴》于辰月多言「土旺用事，宜疏宜润」，
  //   不若未戌丑之「急须」也。urgent 为真者书「急」，为假者书「次急」，二者皆入断。
  var urgent=(s===3||s===1)||isTu;
  var urgentLevel=(isTu&&monthZhi==='辰')?'次急':(urgent?'急':'缓');
  return {yong:row.y,ji:row.j,note:row.s,season:seasonName,seasonNote:seasonNote,s:s,
          urgent:urgent,urgentLevel:urgentLevel,isTu:isTu};
}

         '日主得依则不从，是为破格之忌；印衰微无根、倚杀而存者，古谓「子从父而就」，反为护杀之神，'+
         '旧说有「从杀格中以印护杀最为上乘」之论（此说不出四书，姑备一说）。本工具既以「印根合计不足一分」为入从之门槛，'+
         '故此处辅用之印专指虚浮无根之印；若印得根，则命不入从，当以正格（杀印相生）论之。'
  },
  '食伤':{  // 从儿格（从食伤）
    name:'从儿格（从食伤）',
    zhu:'食伤',
    fu:['财'],
    xi:['食伤','财'],
    ji:['印','官杀'],
    po:['印'],
    ji2:['官杀'],
    li:'印',
    note:'既从食伤，则只论食伤——儿又生财，故喜食伤、喜财星流通，是谓「儿又生儿」，其气不息。'+
         '最忌印星夺食（枭神夺食，破格之尤）、次忌官杀克身（身本无根，再见克则祸）。'+
         '《滴天髓》有所谓「儿能生母」之说、《三命通会》论「从儿格」皆以食伤生财为富贵之基，'+
         '故从儿格最喜财，有财则秀气流行而成器；无财而见印，则格败。'+
         '行运见食伤、财则发，见印则滞、见官杀则灾。'
  }
};

// 从格取用：返回与正格 quYongShen 同构的结构，使喜忌栏、岁运、原局总评皆可通用
function congQuYong(cg, dayGan, pillars, th){
  var def=CONG_QU_YONG[cg.key];
  if(!def)return null;
  var pw=cg.pw||{};
  // 喜用：主用居首，辅用次之，再补其余喜神（去重，最多三类，与正格口径一致）
  var yong=[def.zhu];
  def.fu.forEach(function(c){ if(yong.indexOf(c)<0)yong.push(c); });
  def.xi.forEach(function(c){ if(yong.indexOf(c)<0&&yong.length<3)yong.push(c); });
  if(yong.length>3)yong=yong.slice(0,3);
  // 忌神：破格之神恒居首位（《滴天髓》「从神又有吉和凶」——破神即凶之所在）
  var ji=[];
  def.po.forEach(function(c){ if(yong.indexOf(c)<0&&ji.indexOf(c)<0)ji.push(c); });
  def.ji.forEach(function(c){ if(yong.indexOf(c)<0&&ji.indexOf(c)<0)ji.push(c); });
  if(!ji.length)ji=[def.li];
  // 取用次第（从格专论，与正格四步区分）
  var reason=[];
  reason.push('从格取用：日主无根而'+GEN_NAME[def.zhu]+'独旺（党势'+(cg.pct*100).toFixed(0)+'%），'+
              '依《子平真诠》「日主无根而从四柱之旺神」，即以'+GEN_NAME[def.zhu]+'为用——'+
              '从格只论所从之神，不复论扶抑（《滴天髓·从象》）');
  if(def.fu.length){
    reason.push('辅以'+def.fu.map(function(c){return GEN_NAME[c];}).join('、')+
                '——'+(cg.key==='财'||cg.key==='官杀'||cg.key==='食伤'?
                  '相生相护，使所从之神愈旺而不孤':'同气生扶，顺其旺气而不可逆'));
  }
  reason.push('忌'+def.ji.map(function(c){return GEN_NAME[c];}).join('、')+
              '——'+({
                '比劫':'官杀克身逆其旺气，财星激旺反致争财',
                '印':'财星坏印为破格之尤，食伤泄秀亦损其专',
                '财':'比劫夺财为破格之尤，印星生身则日主不肯从',
                '官杀':'食伤制杀为破格之尤，比劫抗官则身不甘从',
                '食伤':'印星夺食为破格之尤，官杀克身则祸'
              }[cg.key]||'逆其所从之气'));
  // 真从／假从之别——《滴天髓》「从神又有吉和凶」，假从者运助则真、运破则败
  if(!cg.zhen){
    reason.push('本局为<b>假从</b>（党势'+(cg.pct*100).toFixed(0)+'%、破神'+(cg.pure*100).toFixed(1)+'%），'+
                '从气未纯——行运助其所从则渐真而吉，一遇'+GEN_NAME[def.li]+'则格破而凶；'+
                '故假从之喜忌虽同真从，而行运之顺逆更为吃紧');
  }else{
    reason.push('本局为<b>真从</b>（党势'+(cg.pct*100).toFixed(0)+'%、破神'+(cg.pure*100).toFixed(1)+'%），'+
                '从气得真——只宜顺其旺气而行，一毫逆之即祸，故忌神之运断不可行');
  }
  // 调候与从格之交：《穷通宝鉴》调候为急，然从格以「顺气」为纲，调候之着若为破神则不可用
  var thJi=[], thNote='';
  if(th&&th.yong){
    var thY=[], thJ=[];
    th.yong.forEach(function(g){
      var c=wxToClass(dayGan,GAN_WX[g]);
      if(!c)return;
      if(yong.indexOf(c)>=0)thY.push(c);
      else if(ji.indexOf(c)>=0)thJ.push(c);
    });
    if(thJ.length){
      // 【订】旧法径以 th.ji 全量作「调候所忌」，未滤其在从格中已列喜用者——
      //   若调候所忌之干恰与从格喜用同类，则同栏之内「喜」「忌」并陈，自相冲突。
      //   今加 yong 之过滤，与正格 quYongShen 处同一法（正格处已有此滤）。
      thJi=th.ji?th.ji.map(function(g){return {gan:g,wx:GAN_WX[g],cls:wxToClass(dayGan,GAN_WX[g])};})
                      .filter(function(x){return x.cls&&yong.indexOf(x.cls)<0;}):[];
      thNote='调候所需'+thJ.map(function(c){return GEN_NAME[c];}).join('、')+
             '恰为从格之忌神——依《滴天髓》「从得真者只论从」，既从之后当以顺气为先，'+
             '调候之着不可强用；惟'+th.season+'月寒暖燥湿失调，宜于起居、方位、颜色上稍作调和，'+
             '而不可以其为命理之用神';
    }else if(thY.length){
      thNote='调候所需'+thY.map(function(c){return GEN_NAME[c];}).join('、')+
             '与所从之神同气，调候与从格两不相碍，是为得宜——'+
             th.season+'月'+dayGan+'日，'+th.note;
    }else{
      thNote='调候所需'+th.yong.map(function(g){return g+'('+GAN_WX[g]+')';}).join('、')+
             '与从格喜忌皆不相应，从格以顺气为纲，调候只作参看，不为主用';
    }
  }
  return {
    yong:yong, ji:ji, th:null, reason:reason, pw:pw, thJi:thJi||[],
    isCong:true, cong:cg, congDef:def, thNote:thNote,
    // 供岁运判吉凶：顺／逆五级
    shun:def.xi, ni:def.ji
  };
}

// —— 取用神（合参四书，调候为先）——
function quYongShen(dayGan, pillars, st, th, gj, dayInMonth){
  var dg=dayGan;
  var strong=(st.cls==='身强'||st.cls==='偏强');
  var weak=(st.cls==='身弱'||st.cls==='偏弱');
  var mid=(st.cls==='中和');
  var mz=pillars[1].zhi;
  // 统计各十神类的力量（天干各12、藏干10/6/4，月令本气40）
  var pw={比劫:0,食伤:0,财:0,官杀:0,印:0};
  pillars.forEach(function(p,i){
    // 【订】日主本干不计入「比劫」之力（十神以日干为「我」，我不自与我比）——
    //   与 shiShenPower()、strength()、四柱宫位统计（15485 处）同一口径。
    //   旧此处独漏此判，致比劫一档恒虚增十二分：身弱之局于「印／比劫」二者择其为用时，
    //   比劫因虚增而常压印一头，遂有「身弱本喜印生、反取比劫为用」之偏；
    //   且下文「用神之力」所陈之分数（ys.pw）亦随之偏高，与他处所记之数不合。今归一。
    if(p.gan!==dg){ var c=wxToClass(dg,GAN_WX[p.gan]); if(c)pw[c]+=12; }
    HIDE[p.zhi].forEach(function(g,gi){
      var w=gi===0?(i===1?40:10):(gi===1?6:4);
      var cc=wxToClass(dg,GAN_WX[g]); if(cc)pw[cc]+=w;
    });
  });
  // 先生成候选用神池
  var pick=[], reason=[], firstTh=null, thFirstAsAux=false;
  // ── 第一优先：调候（《穷通宝鉴》「寒暖燥湿为先」）──
  if(th){
    var thWx=th.yong.map(function(g){return GAN_WX[g];});
    // 调候取用需「局中确有此五行可用」，且冬夏为急
    var avail=thWx.filter(function(w,i){
      // 首选用神必须可用：局中有该五行（天干或地支本气藏干）
      return pillars.some(function(p){
        return GAN_WX[p.gan]===w || HIDE[p.zhi].some(function(g){return GAN_WX[g]===w;});
      });
    });
    if(avail.length){
      firstTh={wx:avail, urgent:th.urgent};
      var clsT=wxToClass(dg,avail[0]);
      // 调候之着与扶抑相悖时，古法「先取调候，后论扶抑」——但此「先」指「不可废」，
      // 非指「必居首位」：日主已判为强（含偏强）而调候之着恰为印比（帮身），
      // 则只作「辅」不作「主用」，否则「旺而更旺」，与《滴天髓》「旺则宜泄宜伤」相违。
      var thHelp=(clsT==='印'||clsT==='比劫');
      if(strong && thHelp){
        pick.push(clsT);
        thFirstAsAux=true;
        reason.push('调候所需'+avail[0]+'（'+clsT+'）虽为《穷通宝鉴》之要，然日主已强，帮身之着只可为辅、不可为主，故列于次位');
      }else{
        pick.push(clsT);
        reason.push('调候为急：'+th.season+'月'+dg+'日，'+th.note+'（《穷通宝鉴》）');
      }
    }else{
      reason.push('调候所需'+th.yong.map(function(g){return g+'('+GAN_WX[g]+')';}).join('、')+'，局中无根可用，调候之法不施，转以扶抑为主');
    }
  }
  // ── 第二优先：扶抑（《滴天髓》「旺则宜泄宜伤，衰则喜帮喜助」）──
  function add(cls,why){ if(pick.indexOf(cls)<0)pick.push(cls); reason.push(why); }
  if(strong){
    // 身强：官杀克之、食伤泄之、财耗之。取局中有力者
    var order=['官杀','食伤','财'].sort(function(a,b){return pw[b]-pw[a];});
    order.forEach(function(c,i){
      if(i===0)add(c,'身强（同党'+(st.r*100).toFixed(0)+'%），以'+GEN_NAME[c]+'为用，取其克泄耗之力'+(pw[c]>0?'（局中'+GEN_NAME[c]+'有力）':'（局中尚缺，待运补）'));
    });
    order.slice(1).forEach(function(c){if(pick.indexOf(c)<0)pick.push(c);});
    // 若调候之着被降为辅（thFirstAsAux），主用应由克泄耗者居首
    if(thFirstAsAux && pick.length>1 && (pick[0]==='印'||pick[0]==='比劫')){
      var mainPick=pick.find(function(c){return c==='官杀'||c==='食伤'||c==='财';});
      if(mainPick){pick=pick.filter(function(c){return c!==mainPick;});pick.unshift(mainPick);}
    }
  }else if(weak){
    var order2=['印','比劫'].sort(function(a,b){return pw[b]-pw[a];});
    add(order2[0],'身弱（同党'+(st.r*100).toFixed(0)+'%），以'+GEN_NAME[order2[0]]+'为用，取其生扶之力');
    if(pick.indexOf(order2[1])<0)pick.push(order2[1]);
  }else{
    // 中和：看格局所需
    var need=(gj&&gj.cls)?({ '官杀':'印','财':'食伤','食伤':'财','印':'官杀','比劫':'食伤' }[gj.cls]||'食伤'):'食伤';
    add(need,'中和之局，不以扶抑取胜，依格局所需取'+GEN_NAME[need]+'为用（《子平真诠》以格局为主）');
  }
  // ── 格局一致性校正（《子平真诠》）──
  // 建禄、月劫、羊刃三格，日主以禄刃比劫为根，格局性质上已偏强。
  // 若程序算得「中和」或「身弱」而以食伤、财为用，却仍把比劫列为忌神，则自相矛盾；
  // 此三格须以官杀（制）或食伤（泄）为用，比劫为「体」——不作忌神，但亦不列喜用首位。
  var luRenJie=(gj&&(gj.type==='禄'||gj.type==='刃'||gj.ss==='比肩'||gj.ss==='劫财'));
  if(luRenJie){
    var luOrder=['官杀','食伤'].sort(function(a,b){return pw[b]-pw[a];});
    var luUse=luOrder[0];
    if(pick.indexOf(luUse)<0){
      pick.unshift(luUse);
      reason.push('禄刃之格日主有根，不以弱论，取'+GEN_NAME[luUse]+(luUse==='官杀'?'制之':'泄之')+'为用（《子平真诠》禄刃格法）');
    }else{
      // 已在喜用之列则提前，确保「主用」落在制泄而非帮身
      pick=pick.filter(function(v){return v!==luUse;});pick.unshift(luUse);
    }
  }
  // ── 第三：调候次选补入 ──
  // 【订】旧法无条件把 th.yong 全类补入喜用，有二弊：
  //   ① 上文既判「局中无根可用，调候之法不施」（avail 为空），此处反又一律补入，
  //      同一栏之内前后自相矛盾——既曰「不施」，又列为喜用；
  //   ② 身强（含偏强）而调候之着恰为印、比劫（帮身）者亦补入，与《滴天髓》
  //      「旺则宜泄宜伤」相违。今改：只补「局中确有可用」者（与上文 avail 同一口径），
  //      且身强者不取帮身之调候着。
  if(th&&th.yong){
    th.yong.forEach(function(g){
      if(avail.indexOf(GAN_WX[g])<0)return;          // 局中无此五行可用者不补
      var c=wxToClass(dg,GAN_WX[g]);
      if(strong&&(c==='印'||c==='比劫'))return;      // 身强者不取帮身之调候着
      if(pick.indexOf(c)<0)pick.push(c);
    });
  }
  // 去重
  pick=pick.filter(function(v,i){return pick.indexOf(v)===i;});
  if(!pick.length)pick=['印','比劫'];
  // 喜用不可「满盘皆喜」——最多留主用一、辅二，共三神。
  // 古法取用，主用一神为纲，辅神一至二为目；若五类尽列，则无所谓「忌」，失其纲纪。
  if(pick.length>3)pick=pick.slice(0,3);
  // 忌神：与用神相反者
  var ALL5=['比劫','印','食伤','财','官杀'];
  var ji=[]; 
  if(pick.indexOf('官杀')>=0||pick.indexOf('财')>=0||pick.indexOf('食伤')>=0)ji.push('比劫');
  if(pick.indexOf('印')>=0||pick.indexOf('比劫')>=0)ji.push('官杀');
  if(strong)ji.push('印');
  if(weak)ji.push('财');
  ji=ji.filter(function(v,i){return ji.indexOf(v)===i&&pick.indexOf(v)<0;});
  // 兜底：喜用过宽致忌神落空时，依「扶抑反向 + 格局所忌 + 调候所忌」三路补出忌神，
  // 不可出现「满盘皆喜、无一忌神」之说——《滴天髓》「旺则宜泄宜伤」必有反面。
  if(!ji.length){
    // ① 扶抑反面：身强取泄耗克，则印比为忌；身弱取生扶，则财官食伤为忌
    var revStrong=['印','比劫'], revWeak=['财','官杀','食伤'];
    var pool=(strong?revStrong:(weak?revWeak:ALL5.slice()));
    pool.forEach(function(c){ if(pick.indexOf(c)<0 && ji.indexOf(c)<0)ji.push(c); });
  }
  if(!ji.length)ji=[(strong?'印':'财')];
  // 禄刃之格：比劫为格之本体，不作忌神；官杀为制刃之药，亦不作忌神
  if(luRenJie){
    ji=ji.filter(function(v){return v!=='比劫'&&v!=='官杀';});
    pick=pick.filter(function(v){return v!=='比劫';});
  }
  // ② 格局所忌：优先置于首位
  // 【订·次序】旧法先剔禄刃之「比劫」（上一步），而后于此处加「格局所忌」；
  //   然建禄、羊刃、月劫三格之 cls 皆属「比劫」，其格局所忌按「财→比劫」之表
  //   恰为「比劫」——于是前脚刚剔、后脚又添，剔而无效，禄刃格之忌神栏中仍见
  //   「忌 比劫」，与上一步「比劫为格之本体、不作忌神」之说自相矛盾。
  //   今于此处再阻一次：禄刃之格，比劫不得入忌神。
  if(gj&&gj.cls){
    var gjJi=({ '官杀':'食伤','财':'比劫','食伤':'印','印':'财','比劫':'官杀' })[gj.cls];
    // 【订·官杀亦不得为禄刃之忌】禄刃之格，日主以禄刃为根而偏旺，其病在「旺而无制」，
    //   其药正在官杀制之、食伤泄之——《子平真诠》「月令建禄（月劫羊刃），则取月令所藏
    //   财官食伤为用」，羊刃「最喜七杀制刃（杀刃相济）」。若于此处仍以官杀为忌，
    //   则与本工具「格局行运」条下「羊刃格最喜七杀运制刃」自相矛盾（如甲生卯月，
    //   穷通明言「阳刃架杀，专用庚金」，而季表列庚为忌）。
    if(luRenJie&&(gjJi==='比劫'||gjJi==='官杀'))gjJi=null;
    // 仅当该神不在喜用之列时方可为忌
    if(gjJi&&pick.indexOf(gjJi)<0){ ji=ji.filter(function(v){return v!==gjJi;}); ji.unshift(gjJi); }
  }
  // ③ 调候所忌的干所在类，若非用神则并入
  // 【订】禄刃之格，调候所忌亦不得含比劫——理由同上：比劫为格之本体，
  //   非「忌神」所能名。如「庚辰 辛巳 丙寅 己亥」建禄格，夏丙调候忌木火再助，
  //   木为印、火为比劫，若径并入，则「忌 比劫」复见于禄刃格，与前说相悖。
  //   古法于禄刃格只言「喜官杀制之、食伤泄之」，未尝言「忌比劫」——
  //   禄刃之病在「旺而无制」，其药在制泄，不在自伐其体。
  if(th&&th.ji){
    th.ji.forEach(function(g){ var c=wxToClass(dg,GAN_WX[g]);
      if(luRenJie&&(c==='比劫'||c==='官杀'))return;
      if(c&&pick.indexOf(c)<0&&ji.indexOf(c)<0)ji.push(c); });
  }
  // 终检：忌神不得与用神重叠（去重后再过滤一次）
  ji=ji.filter(function(v,i){return ji.indexOf(v)===i&&pick.indexOf(v)<0;});
  if(!ji.length){
    // 兜底：取一未入喜用且与主用相克之十神类
    var ALL=[ '比劫','印','食伤','财','官杀' ];
    var foe={'官杀':'比劫','比劫':'财','财':'印','印':'食伤','食伤':'官杀'};
    var cand=foe[pick[0]];
    if(!cand||pick.indexOf(cand)>=0) cand=ALL.filter(function(c){return pick.indexOf(c)<0;})[0]||'财';
    // 【订】禄刃之格，兜底亦不得取比劫为忌（比劫为格之本体，见上文）
    if(luRenJie&&(cand==='比劫'||cand==='官杀')){
      cand=['食伤','财','印'].filter(function(c){return pick.indexOf(c)<0;})[0]||'财';
    }
    ji=[cand];
  }
  // 调候明忌
  // 【订】禄刃之格，调候明忌亦不列比劫（同上），只列其为忌而不为格之本体者。
  var thJi=[];
  if(th&&th.ji)thJi=th.ji.map(function(g){return {gan:g,wx:GAN_WX[g],cls:wxToClass(dg,GAN_WX[g])};})
                       .filter(function(x){return !(luRenJie&&x.cls==='比劫');});

  // ── 第四：通关（《滴天髓》）──
  // 《滴天髓》「关内有织女，关外有牛郎，此关若通也，相邀入洞房」——两神相战而中间有
  //   和解之者，谓之通关。通关之神不在「扶抑」一路（非生扶我身、亦非克泄我身），
  //   而在「解二神之争」，使相克者转为相生——故为取用之一别格，不当与扶抑混为一谈。
  //   五对相战与其中间之神（十神之相克链，恰成一周）：
  //     官杀↔比劫（克我者克我身）——以「印」通关：官生印、印生身；
  //     财  ↔印  （我克者克生我者）——以「官杀」通关：财生官、官生印；
  //     比劫↔财  （我同类夺我之财）——以「食伤」通关：比劫生食伤、食伤生财；
  //     食伤↔官杀（我生者克克我者）——以「财」通关：食伤生财、财生官杀；
  //     印  ↔食伤（生我者克我生者）——以「比劫」通关：印生身、身生食伤。
  //   本路只作「补充说明」出之，不改上列 pick／ji 之主算法：
  //     盖通关之神多已落在扶抑之喜用中（如身弱官杀旺以印通关，印本即扶抑之喜用），
  //     若径并入选用之列，则「扶抑」与「通关」二途相混，读者莫知其由何而取。
  //     今别出一路：言其「有战、有间神、间神有力与否」，而取舍仍归扶抑之纲。
  var TONG_GUAN=[
    {a:'官杀',b:'比劫',via:'印',   zhan:'官杀攻身',   why:'官杀克身而身不弱，是二神相战；以印通关——官生印、印生身，则杀不攻身而反为生身之阶'},
    {a:'财',  b:'印',  via:'官杀', zhan:'财印相战',   why:'财克印，是二神相战；以官杀通关——财生官、官生印，则财不克印而反为生印之源'},
    {a:'比劫',b:'财',  via:'食伤', zhan:'比劫夺财',   why:'比劫夺财，是二神相战；以食伤通关——比劫生食伤、食伤生财，则劫不夺财而反为生财之路'},
    {a:'食伤',b:'官杀',via:'财',   zhan:'食伤制官',   why:'食伤克官（古所谓「伤官见官」），是二神相战；以财通关——食伤生财、财生官，则伤不克官而反为生官之资'},
    {a:'印',  b:'食伤',via:'比劫', zhan:'枭神夺食',   why:'印克食伤（古所谓「枭神夺食」），是二神相战；以比劫通关——印生身、身生食伤，则印不夺食而反为生食之本'}
  ];
  var tg=null;
  // 相战须双方皆有力：单方虚微者不成为「战」，故取「短板」最大之一对
  var best=null;
  TONG_GUAN.forEach(function(o){
    var pa=pw[o.a]||0, pb=pw[o.b]||0;
    if(pa<12||pb<12)return;                 // 一方不足一干之力，不成为战
    var short=Math.min(pa,pb);
    if(!best||short>best.short)best={o:o,pa:pa,pb:pb,short:short};
  });
  if(best){
    var viaP=pw[best.o.via]||0;
    // 【辨·通关之方向】通关之旨，在「化克为生，使忌之力转生喜用」，非遇相战即可言通。
    //   盖相克之二神，其于我有喜忌之别：
    //     ① 克者（A）为忌、被克者（B）为喜——A 克 B 是「忌伤喜」，通关使 A 之力经 C 转生 B，
    //        是化忌为喜，其利最大（如身弱，财克印，以官杀通关：财生官、官生印）；
    //     ② 二神皆喜而相战——是「内耗」，通关解之，使二喜相生，亦利（如官印两全而伤官见官）；
    //     ③ 身弱而官杀攻身——官杀虽克我身，以印通关则杀化为印、印复生身，是转忌为喜，亦利；
    //     ④ 反是——克者（A）为喜、被克者（B）为忌，则 A 克 B 本是「喜制忌」，于我大利，
    //        此时若复以 C 通关，A 之力反经 C 转生 B（忌），是「化喜为忌」，断不可取
    //        （如身弱比劫帮身制财，财本为忌，比劫克之正合我意，岂可复通关使比劫之力去生财？）。
    //   故通关之提示，必以「B 为喜或我方、且 A 为忌（或二喜相战、或身弱官杀攻身）」为限；
    //   且通关之神（C）须为喜——C 若自为忌，则通关虽解 A、B 之争，却引入一忌，两失之。
    var aIsYong=pick.indexOf(best.o.a)>=0, bIsYong=pick.indexOf(best.o.b)>=0;
    var aIsJi=ji.indexOf(best.o.a)>=0,      bIsJi=ji.indexOf(best.o.b)>=0;
    var cIsYong=pick.indexOf(best.o.via)>=0, cIsJi=ji.indexOf(best.o.via)>=0;
    var beneficial=false;
    if(best.o.a==='官杀'&&best.o.b==='比劫') beneficial = weak && cIsYong;   // 身弱官杀攻身，印通关化杀生身
    else if(bIsYong&&aIsJi)                    beneficial = cIsYong;            // 忌克喜 → 通关化忌生喜
    else if(aIsYong&&bIsYong)                  beneficial = cIsYong;            // 二喜相战 → 通关解内耗
    // A为喜B为忌（我克敌，利我不通关）、二忌相战（通关使忌更旺）、或C为忌者，皆不提示通关
    if(beneficial){
      tg={a:best.o.a,b:best.o.b,via:best.o.via,zhan:best.o.zhan,why:best.o.why,
          pa:best.pa,pb:best.pb,viaP:viaP,
          has:viaP>=6,                        // 局中略有其气
          isYong:cIsYong,
          isJi:cIsJi};
    }
  }
  return {yong:pick,ji:ji,th:firstTh,reason:reason,pw:pw,thJi:thJi,tg:tg};
}

/**

// 组合检核：need 全部命中（all=true）或达 lv 之数
function shaCombos(list){
  if(!list||!list.length)return [];
  var out=[];
  SHA_COMBO.forEach(function(cb){
    // 带「（互见）」后缀者（天罗／地网）仍作命中——后缀只表力之轻重，非另立一煞
    var hit=cb.need.filter(function(n){
      return list.some(function(s){return s===n||s.indexOf(n+'（')===0;});
    });
    var ok=cb.all?(hit.length===cb.need.length):(hit.length>=cb.lv);
    if(ok)out.push({cb:cb,hit:hit});
  });
  // 只保留「最专」的组合：若某组合的命中集被另一组合完全包含且后者更专，则略去前者（空亡单见等）
  out=out.filter(function(o,i){
    return !out.some(function(p,j){
      return j!==i&&p.hit.length>o.hit.length&&o.hit.every(function(n){return p.hit.indexOf(n)>=0;});
    });
  });
  return out.sort(function(a,b){return b.hit.length-a.hit.length;});
}
// 神煞组合之行（列于单煞之论后）
function shaComboLine(list,st,jud){
  var cs=shaCombos(list);
  if(!cs.length)return '';
  var strong=st&&(st.cls==='身强'||st.cls==='偏强');
  var weak=st&&(st.cls==='身弱'||st.cls==='偏弱');
  var rows=cs.map(function(o){
    var cb=o.cb;
    var byStr=strong?cb.s:(weak?cb.w:'中和之身，其应视喜忌而定，吉凶皆不过分');
    var byJi='';
    if(jud&&jud.t==='喜')byJi=cb.good;
    else if(jud&&jud.t==='忌')byJi=cb.bad;
    else if(jud&&jud.t==='混')byJi=cb.mid;
    else byJi='此柱为闲神，其应平平，组合之象虽在而不显。';
    // 力度以「实际命中数」为准：三煞齐见为重、二煞为中
    var lvTxt=o.hit.length>=3?'重':o.hit.length===2?'中':'轻';
    return '<b style="color:#7a3a2a">◇ '+cb.name+'</b>'+
      '<span style="color:#9a7a5a;font-size:12.5px">（'+o.hit.join('·')+'　力'+lvTxt+'）</span>：'+
      cb.y+'。'+byStr+'；'+byJi;
  });
  return '<div class="gs-line" style="font-size:13.5px;margin-top:3px;border-top:1px dashed #d8c8a8;padding-top:3px">'+
    '<b>神煞组合之应</b>　<span style="color:#5a6a8a">单煞力薄，二三相并则其象显、其应专；组合之力大于单煞之和，故先看组合、再论单煞。</span><br>'+
    rows.join('<br>')+'</div>';
}

function shaLine(colName,shaMap,st,jud){

  var out='<div class="gs-line" style="font-size:13.5px"><b>神煞之象</b>　'+

 * @param {string} ssg 天干十神
 * @param {string} ssz 地支本气十神
 * @returns {'same'|'sheng'|'ke'}
 */
function comboType(ssg,ssz){
  if(!ssg||!ssz)return 'sheng';
  if(ssg===ssz)return 'same';
  var a=SS2GEN[ssg]||ssg,b=SS2GEN[ssz]||ssz;
  if(a===b)return 'same';
  if(SS_SHENG[a]===b||SS_SHENG[b]===a)return 'sheng';
  if(SS_KE[a]===b||SS_KE[b]===a)return 'ke';
  return 'sheng';
}

    '比肩|食神':'父母温厚有艺，门庭平顺，青年可凭才艺自辟蹊径，事业平台虽不显赫而得自在一途，稳步向前。',
    '比肩|伤官':'父母才气有余而规矩偏疏，青年才思外露、不安于常，宜以技艺创意立身，忌与上司抗争、忌恃才犯众。',
    '比肩|偏财':'父母经营有方而聚散无常，青年可涉多方之利，宜经营流动之业，忌合伙分财，得财而后须守。',
    '比肩|正财':'父母勤俭持家、门庭安稳，青年所入稳定、田宅可图，事业宜循正业渐进，不喜投机，则累迁可期。',
    '比肩|七杀':'父母管教严或家境多难，青年承压而行，事业竞争激烈、责任繁重，宜借强势磨炼己身，忌逞力争锋。',
    '比肩|正官':'父母门第清正、家教有方，青年循规矩入正途，平台稳固有名，宜在体制、名门之内循序而进。',
    '比肩|偏印':'父母门庭疏淡或偏冷门之业，青年宜专攻一门专门技艺、学术玄理，宜独立钻研而不宜群聚争锋。',
    '比肩|正印':'父母书香温厚、得长辈提携，青年学业顺、所入平台得贵人扶，根基稳固，宜循学而进、借荫而上。',
    '劫财|比肩':'父母助力分薄、门庭有争，青年所立之业多与人共分，平台虽成而利薄，宜明算账、定合伙之规。',
    '劫财|劫财':'父母家计起伏、门庭多耗，青年谋事屡变、破财多而积财少，宜远利争、忌作保借贷，独立而不合股为上。',
    '劫财|食神':'父母虽不厚而善谋口食，青年能凭一技自养，平台虽小而稳，忌再贪多，专一于所长即可安身。',
    '劫财|伤官':'父母多口舌是非、家计失和，青年才高气傲、易与尊长冲突，宜离乡外求、以技艺独立，忌与人争口。',
    '劫财|偏财':'父母经营多变、财聚复散，青年可搏利而难守，宜广开财路、速进速守，忌高杠杆与合伙。',
    '劫财|正财':'父母以勤俭积财、门庭稳固，青年宜守正业、忌贪旁利，财帛虽被分而根基在，勤则不缺。',
    '劫财|七杀':'父母曾历困厄、家风严紧，青年承压甚重，事业竞争烈、责任繁，宜借势炼身，忌以暴制暴。',
    '劫财|正官':'父母门第尚正而家计寻常，青年守正入仕途或正业，上升须自奋力，忌与人争功、忌越位行事。',
    '劫财|偏印':'父母家风疏冷或门庭偏业，青年宜专攻专门之术，多思而孤，宜自立门面，忌合伙共事。',
    '劫财|正印':'父母得长辈之荫而分薄，青年读书顺而门庭须自振，得师长提携，宜以文旅、文书、教育一路立身。',
    '食神|比肩':'父母勤俭自足、门庭平和，青年可凭才艺与人和合而进，平台安稳、同辈相扶，宜专一业以成其名。',
    '食神|劫财':'父母以技养家而不聚财，青年所得温饱有余、积蓄不足，宜守一技、忌合伙，勤则可安。',
    '食神|食神':'父母厚道有口福、门庭和顺，青年衣食宽裕、人缘佳，事业宜餐饮、文艺、教育、生养之途，稳步可成。',
    '食神|伤官':'父母才艺传家而规矩稍疏，青年才华外显、创意足，宜文教、技艺、传播之业，忌恃才凌人。',
    '食神|偏财':'父母善经营、门庭宽裕，青年财路活络、可涉经营与流动之利，食神生财格最宜以技艺生财。',
    '食神|正财':'父母勤俭、田宅安稳，青年所得渐丰、积蓄可期，宜循正业稳步图发展，享安稳之局。',
    '食神|七杀':'父母曾历风波而能自守，青年受制于压力而能化之，宜以专业制难题、以艺业化竞争，忌硬碰。',
    '食神|正官':'父母门第清正、家教有度，青年循正得名，平台稳固、声誉渐起，宜体制、公务、教育之途。',
    '食神|偏印':'父母有异艺之传、家风清冷，青年宜专精一门偏僻之学，宜研究、医卜、技术，忌半途改辙。',
    '食神|正印':'父母书香温厚、得母辈庇荫，青年学业尤顺、得师长提拔，宜文教、文书、研究工作，福气最厚。',
    '伤官|比肩':'父母才气外露而门庭不常，青年才思敏捷、不喜拘束，宜自由职业、技艺创意，忌与同辈争口舌。',
    '伤官|劫财':'父母多争、家计失和，青年不安于常、易破财招非，宜离乡外求、独立一技，忌合伙与借贷。',
    '伤官|食神':'父母以才艺立家而积蓄不厚，青年聪颖多能、宜文教技艺之途，纵才华却忌贪多而不精。',
    '伤官|伤官':'父母才高不遇、门庭多争，青年性傲难驯、易与上司冲突，宜自由技艺、创意之业，最忌入体制受压。',

    '正财|正财':'父母勤俭两代、田宅丰实，青年所得丰足、积蓄可期，宜守正业、稳步升迁，财运最为安稳。',

//   惟因其为「一运十年之总评」，故于四等之间再析「小吉」「小碍」二品，使诸运可相较。
function rpGrade(jg,jz){
  var y=(jg.t==='喜'?1:0)+(jz.t==='喜'?1:0);
  var j=(jg.t==='忌'?1:0)+(jz.t==='忌'?1:0);
  if(y===2)return {k:'吉运',n:3,bg:'#e8f3e8',fg:'#2b6b2b'};
  if(j===2)return {k:'逆运',n:-3,bg:'#fdeceb',fg:'#a33'};
  if(y&&j) return {k:'参半',n:-1,bg:'#fdf1e0',fg:'#8a5a12'};
  if(y)     return {k:'小吉',n:2,bg:'#f0f7f0',fg:'#3a6b3a'};
  if(j)     return {k:'小碍',n:-2,bg:'#fdf3ef',fg:'#8a4a2a'};
  return {k:'平运',n:0,bg:'#f0eee6',fg:'#6a6050'};
}
// 四字之简（表内用）：喜／忌／闲／混
function rpShort(j){ return j.t==='喜'?'喜':j.t==='忌'?'忌':j.t==='混'?'混':'闲'; }
// 刑冲合害之摘要：只取「何象加于何宫」，应事一律自 GONG_PAIR_YI 取，与「刑冲合害会」同源
function rpRelList(rel){
  if(!rel)return [];
  var out=[];
  var MAP=[['chong','冲'],['xing','刑'],['ziXing','自刑'],['hai','害'],['liuHe','六合'],
           ['he','三合'],['hui','三会'],['banHe','半合'],['ganHe','干合'],['ganChong','干冲'],
           ['fuYin','伏吟'],['fanYin','反吟']];
  // 「干支只动其一」（干克/干冲/支冲而未成反吟）者不列细目：天干相克于四柱之间几于无柱不有，
  //   逐条列出则喧宾夺主；其数另计，附于段末一句，与「刑冲合害会」之「附列」同例。
  MAP.forEach(function(m){
    (rel[m[0]]||[]).forEach(function(it){
      var items=it.items||[];
      if(items.length<2)return;
      var kp=pairGongKey(items);
      if(!kp)return;
      var yi='';
      var bank=GONG_PAIR_YI[m[0]];
      if(bank&&bank[kp]&&bank[kp].length)yi=String(bank[kp][0]).replace(/[；。\s]+$/,'');
      out.push({kind:m[0],verb:m[1],kp:kp,name:it.name||'',yi:yi,fy:(m[0]==='fuYin'||m[0]==='fanYin')});
    });
  });
  return out;
}
function rpGongName(kp){
  var s=GONG_SHORT_HEAD[kp]||kp;
  return String(s).replace('·岁运','');
}
function rpRelShort(list){
  if(!list||!list.length)return '<span style="color:#b0b0b0">—</span>';
  var seen={},out=[];
  list.forEach(function(o){
    var t=o.verb+rpGongName(o.kp);
    if(seen[t])return;seen[t]=1;out.push(t);
  });
  return out.join('、');
}

function yuanJuSanShi(dayGan,pillars,st,gj,ys,cong,gender){
  if(gender===undefined||gender===null)gender=1;   // 1=男、0=女（与 #gender 取值一致；marryStar 以 1 为男）
  var dg=dayGan;
  function judgeCls(cls){
    var isY=ys.yong.indexOf(cls)>=0, isJ=ys.ji.indexOf(cls)>=0;
    if(isY&&!isJ)return {t:'喜',c:'喜用',css:'color:#3a6b3a;font-weight:700'};
    if(isJ&&!isY)return {t:'忌',c:'忌神',css:'color:#8b3a3a;font-weight:700'};
    if(!isY&&!isJ)return {t:'平',c:'闲神',css:'color:#666'};

  }
  var pwSum=0;
  ['比劫','印','食伤','财','官杀'].forEach(function(c){pwSum+=(ys.pw[c]||0);});
  function pctOf(c){ return pwSum?((ys.pw[c]||0)/pwSum*100):0; }
  function pctStr(c){ return pctOf(c).toFixed(0)+'%'; }
  var pwMaxCls='财',pwMaxV=-1;
  ['比劫','印','食伤','财','官杀'].forEach(function(c){var v=ys.pw[c]||0;if(v>pwMaxV){pwMaxV=v;pwMaxCls=c;}});

     (mj.t==='喜'?'旺神即是用神，其力可倚，事业宜顺此势而行。'

      :'旺神为闲神，其力虽盛而无大功过，成败仍系于用神之得失。');

  }else if(caiRatio>=28&&weak){

  }else{

  else if(pWeak&&jdz.t==='忌')marry+='配偶星弱（'+pctStr(partner)+'）而配偶宫又落忌——<b>星宫俱薄</b>：主婚缘迟、情分易淡，宜迟婚、宜择配偶星得地之年，婚后尤须相忍。';
  else marry+='配偶星'+pctStr(partner)+'，配偶宫为<span style="'+jdz.css+'">'+jdz.c+'</span>——星宫皆不甚偏，主婚缘平顺，成败多系于相处之道与流年之助。';
  // 男女各有专防
  if(gender===0){

    pillars.forEach(function(p){

      if(shiShenName(dg,p.gan)==='七杀')gdGan++;
    });
    if(gdGan>=2)marry+='　<b>官杀混杂</b>——女命官杀并见，《三命通会》以为「官杀混杂，主夫星不定」，宜迟婚、宜择一而定，勿因选择过多而生犹豫。';

    if(biP>=caiP*1.2&&biP>=pwSum*0.2)marry+='　比劫'+pctStr('比劫')+' 胜于财星——男命「比劫夺财」，《三命通会》以此为「妻星被分」之象，主感情中易有竞争者、或聚少离多，宜晚婚、宜重承诺。';

  var marSha=['阴差阳错','孤鸾煞','红鸾','天喜','孤辰','寡宿','桃花','红艳','金舆'];
  var ssMap={};
  try{ ssMap=shenShas(dg,pillars[0].gan,pillars[0].zhi,pillars); }catch(e){ ssMap={}; }
